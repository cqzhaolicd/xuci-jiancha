<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>🎮 英语预习闯关 · 八年级上册 · 人教版 Go for it</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --red:#e74c3c; --green:#2ecc71; --gold:#f1c40f; --blue:#3498db; --brown:#8e5a2b;
  --bg:#1a1a2e; --card:#222244; --text:#eee; --pixel:'Press Start 2P',monospace; --body:'Noto Sans SC',sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:var(--body); background:var(--bg); color:var(--text); min-height:100vh;
  background-image:radial-gradient(circle at 20% 20%, rgba(52,152,219,.12) 0, transparent 30%),
                   radial-gradient(circle at 80% 70%, rgba(46,204,113,.1) 0, transparent 30%);
}
.clouds { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.cloud { position:absolute; background:rgba(255,255,255,.05); border-radius:50px; animation:float 20s linear infinite; }
.cloud:nth-child(1) { width:180px;height:40px;top:10%;left:-200px; }
.cloud:nth-child(2) { width:120px;height:30px;top:30%;left:-150px; animation-duration:28s; animation-delay:-8s; }
.cloud:nth-child(3) { width:220px;height:50px;top:55%;left:-250px; animation-duration:35s; animation-delay:-15s; }
.cloud:nth-child(4) { width:90px;height:25px;top:75%;left:-120px; animation-duration:22s; animation-delay:-4s; }
@keyframes float { from { transform:translateX(0); } to { transform:translateX(calc(100vw + 400px)); } }
#app { position:relative; z-index:1; max-width:860px; margin:0 auto; padding:16px; }
.hud { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:3px solid #333; border-radius:12px; padding:10px 16px; margin-bottom:14px; font-family:var(--pixel); font-size:11px; }
.hud .hud-item { display:flex; align-items:center; gap:6px; }
.hud .coin { color:var(--gold); } .hud .star { color:var(--green); }
.screen { animation:fadeIn .4s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
/* ===== 地图页 ===== */
.map-header { text-align:center; padding:18px 0 8px; }
.map-header h1 { font-family:var(--pixel); font-size:20px; color:var(--gold); text-shadow:3px 3px 0 rgba(0,0,0,.5); }
.map-header p { color:#aaa; font-size:13px; margin-top:6px; }
.world-list { display:flex; flex-direction:column; gap:12px; margin-top:16px; }
.world-item { display:flex; align-items:center; gap:14px; background:var(--card); border:3px solid #333; border-radius:12px; padding:14px 16px; cursor:pointer; transition:all .2s; }
.world-item:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.4); border-color:var(--gold); }
.world-item.locked { opacity:.45; cursor:not-allowed; }
.world-item .w-icon { font-size:28px; }
.world-item .w-info { flex:1; }
.world-item .w-name { font-weight:700; font-size:15px; }
.world-item .w-npc { color:#aaa; font-size:12px; margin-top:2px; }
.world-item .w-status { font-family:var(--pixel); font-size:10px; }
.world-item .w-status .ok { color:var(--green); }
.world-item .w-status .lock { color:#888; }
.map-buttons { display:flex; gap:10px; margin-top:18px; justify-content:center; }
.btn { font-family:var(--body); font-weight:700; border:none; border-radius:10px; padding:10px 22px; cursor:pointer; font-size:14px; transition:all .2s; }
.btn:hover { transform:translateY(-2px); }
.btn-gold { background:var(--gold); color:#333; }
.btn-blue { background:var(--blue); color:#fff; }
.btn-green { background:var(--green); color:#fff; }
.btn-red { background:var(--red); color:#fff; }
.btn-gray { background:#555; color:#ccc; }
/* ===== 教学页 ===== */
.teach-page { background:var(--card); border:3px solid #333; border-radius:14px; padding:22px; }
.teach-page h2 { font-size:20px; color:var(--gold); margin-bottom:14px; }
.teach-npc { display:flex; gap:12px; background:rgba(241,196,15,.08); border-left:4px solid var(--gold); border-radius:8px; padding:12px; margin-bottom:16px; }
.teach-npc .npc-icon { font-size:30px; }
.teach-npc .npc-text { font-size:14px; line-height:1.7; color:#ffd; }
.teach-body { font-size:15px; line-height:1.9; color:#ddd; }
.teach-body p { margin-bottom:10px; }
.teach-nav { display:flex; justify-content:space-between; margin-top:20px; }
/* ===== 答题页 ===== */
.quiz-page { background:var(--card); border:3px solid #333; border-radius:14px; padding:22px; }
.quiz-page .q-num { font-family:var(--pixel); font-size:11px; color:var(--gold); margin-bottom:8px; }
.quiz-page .q-text { font-size:17px; font-weight:700; margin-bottom:16px; line-height:1.6; }
.opt { display:block; width:100%; text-align:left; background:#2a2a4a; border:2px solid #444; color:var(--text); border-radius:10px; padding:12px 14px; margin-bottom:10px; font-size:14px; cursor:pointer; transition:all .15s; font-family:var(--body); }
.opt:hover { border-color:var(--gold); }
.opt.correct { background:var(--green); border-color:var(--green); color:#fff; }
.opt.wrong { background:var(--red); border-color:var(--red); color:#fff; }
.explanation { display:none; background:rgba(52,152,219,.1); border-left:4px solid var(--blue); border-radius:8px; padding:12px; margin-top:10px; font-size:14px; line-height:1.7; }
.explanation.show { display:block; animation:fadeIn .3s; }
.quiz-footer { display:flex; justify-content:space-between; margin-top:16px; align-items:center; }
/* ===== BOSS ===== */
.boss-page { text-align:center; padding:30px 16px; }
.boss-title { font-family:var(--pixel); font-size:22px; color:var(--red); text-shadow:3px 3px 0 rgba(0,0,0,.6); animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
.boss-avatar { font-size:72px; margin:24px 0; animation:bounce 1s infinite; display:inline-block; }
@keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-12px); } }
.hearts { font-size:26px; margin:12px 0; }
.hearts .lost { opacity:.25; }
/* BOSS 胜利动画 */
.screen-shake { animation:shake .5s; }
@keyframes shake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-12px); } 40% { transform:translateX(12px); } 60% { transform:translateX(-8px); } 80% { transform:translateX(8px); } }
.boss-defeated { font-family:var(--pixel); font-size:28px; color:var(--gold); margin:20px 0; animation:blink .6s infinite; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.2; } }
.trophy { font-size:64px; display:inline-block; animation:trophyScale 1s forwards; transform:scale(0.05); filter:drop-shadow(0 0 20px gold); }
@keyframes trophyScale { 0% { transform:scale(0.05); } 70% { transform:scale(1.35); } 100% { transform:scale(1.15); } }
.confetti { position:fixed; width:10px; height:14px; z-index:99; pointer-events:none; animation:confettiFall 2.5s ease-out forwards; }
@keyframes confettiFall { 0% { transform:translateY(-20px) rotate(0); opacity:1; } 100% { transform:translateY(100vh) rotate(720deg); opacity:0; } }
.stat-panel { background:var(--card); border:3px solid var(--gold); border-radius:14px; padding:20px; margin-top:20px; text-align:left; animation:fadeIn .5s .4s both; }
.stat-panel h3 { color:var(--gold); margin-bottom:10px; }
.stat-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #444; font-size:14px; }
/* ===== 错题本 ===== */
.wrongbook { background:var(--card); border:3px solid #333; border-radius:14px; padding:20px; }
.wrongbook h2 { color:var(--gold); margin-bottom:14px; }
.wrong-item { background:#2a2a4a; border-radius:10px; padding:14px; margin-bottom:12px; }
.wrong-item .wq { font-weight:700; margin-bottom:6px; }
.wrong-item .wa { color:#99ffcc; font-size:13px; }
.wrong-item .we { color:#aaa; font-size:13px; margin-top:4px; }
.empty-tip { text-align:center; color:#888; padding:30px 0; }
/* ===== 确认弹窗 ===== */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:center; justify-content:center; animation:fadeIn .2s; }
.modal-card { background:var(--card); border:3px solid var(--gold); border-radius:14px; padding:24px; max-width:340px; width:90%; text-align:center; }
.modal-card p { margin-bottom:18px; font-size:15px; }
.modal-btns { display:flex; gap:10px; justify-content:center; }
/* ===== 结果页 ===== */
.result-page { text-align:center; padding:30px 16px; }
.result-title { font-family:var(--pixel); font-size:20px; color:var(--gold); margin-bottom:16px; }
.result-stars { font-size:30px; margin:14px 0; }
.result-stars .off { opacity:.2; }
.result-detail { background:var(--card); border-radius:12px; padding:16px; margin:14px auto; max-width:400px; }
/* ===== 响应式 ===== */
@media (max-width:680px) {
  .hud { font-size:9px; padding:8px 10px; }
  .map-header h1 { font-size:16px; }
  .world-item .w-name { font-size:14px; }
  .teach-page, .quiz-page { padding:16px; }
}
</style>
</head>

<script>
// ===== 音效（Web Audio 8-bit）=====
let audioCtx = null;
function playTone(freq, dur, type='square', vol=0.08, when=0) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch(e) {}
}
const sfx = {
  jump: () => playTone(392, .12, 'square', .06),
  coin: () => { playTone(988, .08); playTone(1319, .12, 'square', .06, .06); },
  correct: () => { playTone(523, .1); playTone(659, .1, 'square', .07, .09); playTone(784, .18, 'square', .07, .18); },
  wrong: () => { playTone(220, .2, 'sawtooth', .07); playTone(175, .25, 'sawtooth', .06, .15); },
  fanfare: () => { [523,659,784,1047].forEach((f,i)=>playTone(f,.15,'square',.08,i*.12)); },
  bossHit: () => { playTone(98, .3, 'sawtooth', .1); playTone(82, .4, 'sawtooth', .08, .15); }
};

// ===== 数据 =====
const SUBJECT = "英语";
const VERSION = "八年级上册 · 人教版 Go for it";
const WORLDS = [{"name": "Unit 1 · Where did you go on vacation?", "npc": "旅行家小马：用过去时聊聊你的假期吧！", "teach": [{"title": "一般过去时（规则动词）", "text": "一般过去时表示过去发生的动作或状态，常与 yesterday、last week、two days ago、last summer 连用。规则动词直接加 -ed：play→played, visit→visited, cook→cooked；以 e 结尾只加 -d：like→liked；以辅音字母+y 结尾，变 y 为 i 加 -ed：study→studied。否定句：didn't + 动词原形（I didn't go...）；疑问句：Did + 主语 + 动词原形？（Did you go...?）"}, {"title": "不规则动词过去式", "text": "许多常用动词的过去式是不规则变化，需要逐个记忆：go→went, have/has→had, see→saw, eat→ate, buy→bought, take→took, write→wrote, read→read, do→did, get→got。例句：I went to the beach last summer.（去年夏天我去了海滩。）注意：在 didn't 和 Did 之后，动词要还原成原形。"}, {"title": "不定代词（some- / any- / no-）", "text": "不定代词表示不确定的人或物：someone/anyone（某人/任何人）、something/anything（某物/任何物）、nothing（什么也没有）、everyone/everything（每个人/每件事）。规则：some- 用于肯定句；any- 用于否定句和疑问句；no- 本身就表否定。例句：I bought something for my father.（肯定句用 something。）Did you do anything special?（疑问句用 anything。）"}], "quiz": [{"q": "—Where did you go on vacation? —I ___ to the beach with my parents.", "opts": ["go", "went", "gone", "going"], "ans": 1, "exp": "回答过去发生的事用一般过去时，go 的过去式是不规则变化 went。"}, {"q": "—Did you buy anything special on your trip? —No, I bought ___.", "opts": ["something", "anything", "nothing", "everything"], "ans": 2, "exp": "回答 No 表示'什么都没买'，用 nothing（什么也没有）。"}, {"q": "My mother ___ some delicious food for us yesterday.", "opts": ["cook", "cooks", "cooked", "cooking"], "ans": 2, "exp": "yesterday 是过去时间标志，规则动词 cook 加 -ed 构成过去式 cooked。"}, {"q": "There is ___ wrong with my computer. It doesn't work at all.", "opts": ["anything", "nothing", "everything", "something"], "ans": 3, "exp": "肯定句中表示'某事物'用 something，something wrong 意为'出了毛病'。"}]}, {"name": "Unit 2 · How often do you exercise?", "npc": "健身教练阿力：你多久锻炼一次？", "teach": [{"title": "频度副词", "text": "频度副词表示动作发生的频率，按频率从高到低排列：always(总是) > usually(通常) > often(经常) > sometimes(有时) > hardly ever(几乎不) > never(从不)。频度副词一般放在行为动词之前、be 动词之后：I often exercise.（我经常锻炼。）He is always late.（他总是迟到。）"}, {"title": "How often 问句", "text": "询问动作发生的频率用 How often（多久一次）：—How often do you exercise? —I exercise every day. 回答既可以用频度副词（always、sometimes...），也可以用 every day（每天）等频率短语。注意区分：How often 问频率，How long 问时长。"}, {"title": "每周几次的表达", "text": "次数表达：once(一次)、twice(两次)，三次及以上用'数字 + times'：three times(三次)、five times(五次)。后接时间范围：once a week(一周一次)、twice a month(一月两次)、three times a day(一天三次)、every day(每天)。例句：I go swimming twice a week.（我一周游两次泳。）"}], "quiz": [{"q": "—___ do you go to the library? —Three times a week.", "opts": ["How long", "How often", "How many", "How much"], "ans": 1, "exp": "回答 Three times a week（一周三次）表示频率，问频率用 How often。"}, {"q": "把频度副词按频率从高到低正确排序：", "opts": ["always > often > sometimes > never", "never > always > often > sometimes", "often > always > never > sometimes", "sometimes > often > always > never"], "ans": 0, "exp": "频率从高到低：always(总是) > usually > often > sometimes > hardly ever > never(从不)。"}, {"q": "He ___ watches TV. He only watches it once a month.", "opts": ["always", "usually", "hardly ever", "often"], "ans": 2, "exp": "一个月只看一次电视，说明'几乎不看'，用 hardly ever（几乎不）。"}, {"q": "—How often do you exercise? —___", "opts": ["For two hours", "Twice a week", "At seven o'clock", "With my friends"], "ans": 1, "exp": "Twice a week（一周两次）表示频率，可以直接回答 How often 的提问。"}]}, {"name": "Unit 3 · I'm more outgoing than my sister.", "npc": "对比大师：两两相比用 -er，看谁更胜一筹！", "teach": [{"title": "比较级的变化规则", "text": "比较级用于两者之间的比较。规则变化：① 一般直接加 -er：tall→taller；② 以 e 结尾加 -r：nice→nicer；③ 辅音字母+y 结尾，变 y 为 i 加 -er：easy→easier；④ 重读闭音节双写末尾辅音字母加 -er：big→bigger；⑤ 多音节词前加 more：more beautiful。不规则变化：good/well→better, bad→worse, many/much→more, little→less, far→farther/further。"}, {"title": "than 比较句型", "text": "句型：A + be + 比较级 + than + B，意为'A 比 B 更……'：Tom is taller than his brother.（汤姆比他弟弟高。）比较级前可用 much、a little、even 等修饰加强语气：much taller（高得多）、a little more outgoing（外向一点点）。"}, {"title": "both 与 as...as", "text": "both 表示'两者都'：Both of them are outgoing.（他们俩都很外向。）as + 形容词原级 + as 表示'和……一样'：She is as tall as me.（她和我一样高。）否定形式 not as/so...as 表示'不如……'：This box is not as heavy as that one.（这个箱子不如那个重。）"}], "quiz": [{"q": "Tom is ___ than his brother.", "opts": ["more tall", "taller", "tallest", "the tallest"], "ans": 1, "exp": "两者比较用比较级，tall 是短形容词，加 -er 构成 taller，后面接 than。"}, {"q": "This movie is ___ than that one. I like it very much.", "opts": ["more exciting", "most exciting", "excitinger", "the most exciting"], "ans": 0, "exp": "exciting 是多音节形容词，比较级用 more + 原级：more exciting。"}, {"q": "My sister is as ___ as me. We are the same height.", "opts": ["tall", "taller", "tallest", "the tallest"], "ans": 0, "exp": "as...as 中间用形容词原级，表示'和我一样高'。"}, {"q": "Her English is ___ than mine.", "opts": ["good", "better", "best", "the best"], "ans": 1, "exp": "good 的比较级是不规则变化 better，better than 表示'比……更好'。"}]}, {"name": "Unit 4 · What's the best movie theater?", "npc": "影评人莉莉：全镇最佳，非它莫属！", "teach": [{"title": "最高级的变化规则", "text": "最高级用于三者或三者以上的比较，前面要加 the。规则变化：① 一般加 -est：tall→tallest；② 以 e 结尾加 -st：nice→nicest；③ 辅音字母+y 结尾，变 y 为 i 加 -est：easy→easiest；④ 重读闭音节双写末尾辅音字母加 -est：big→biggest；⑤ 多音节词前加 the most：the most beautiful。"}, {"title": "不规则最高级", "text": "不规则变化要牢记：good/well→better→best, bad/badly→worse→worst, many/much→more→most, little→less→least, far→farther→farthest。例句：This is the best movie theater in town.（这是镇上最好的电影院。）"}, {"title": "the + 最高级 + in/of", "text": "最高级常与 in / of 搭配表示比较范围：in + 地点或集体（in my class, in town, in the world）；of + 复数或时间段（of all the students, of the three）。例句：He is the tallest student in his class.（他是班里最高的学生。）She runs fastest of all the girls.（她是所有女生中跑得最快的。）"}], "quiz": [{"q": "This is ___ movie theater in town.", "opts": ["the best", "better", "good", "the good"], "ans": 0, "exp": "全镇的电影院不止两家，三者以上比较用最高级，且最高级前要加 the。"}, {"q": "He is the tallest student ___ his class.", "opts": ["in", "of", "than", "for"], "ans": 0, "exp": "表示'在班级里'这个比较范围用 in + 集体名词：in his class。"}, {"q": "This is the ___ book I have ever read.", "opts": ["good", "better", "best", "most good"], "ans": 2, "exp": "good 的最高级是不规则变化 best，前面加 the。"}, {"q": "This is the ___ movie of the three.", "opts": ["more interesting", "most interesting", "interesting", "most interested"], "ans": 1, "exp": "interesting 是多音节形容词，最高级用 the most + 原级；of the three 表示三者范围。"}]}, {"name": "Unit 5 · Do you want to watch a game show?", "npc": "电视迷小杰：今晚看什么节目？", "teach": [{"title": "动词不定式作宾语", "text": "有些动词后面要接 to + 动词原形（动词不定式）作宾语：want to do（想要做）、plan to do（计划做）、hope to do（希望做）、decide to do（决定做）、learn to do（学着做）。例句：I want to watch a game show tonight.（我今晚想看游戏节目。）注意：want 后面也可以直接接名词：Do you want some tea?（你想要些茶吗？）"}, {"title": "What do you think of...?", "text": "询问对方对某事物的看法：What do you think of + 名词/动名词？相当于 How do you like...?（你觉得……怎么样？）应答：I like it.（我喜欢。）/ I love it.（我非常喜欢。）/ I don't mind it.（我不介意，无所谓。）/ I can't stand it.（我受不了。）/ It's fantastic.（太棒了。）"}, {"title": "Do you want to watch...?", "text": "邀请别人一起看节目：Do you want to watch a game show?（你想看游戏节目吗？）肯定回答：Sure, I'd love to. 否定回答：Sorry, I don't want to. 节目类型词汇：game show(游戏节目)、talk show(脱口秀)、soap opera(肥皂剧)、sitcom(情景喜剧)、talent show(才艺秀)、news(新闻)。"}], "quiz": [{"q": "Do you want ___ a game show with me tonight?", "opts": ["watch", "to watch", "watching", "watched"], "ans": 1, "exp": "want 后接动词不定式作宾语：want to do sth.（想要做某事）。"}, {"q": "—What do you think of soap operas? —I can't stand ___.", "opts": ["they", "them", "it", "their"], "ans": 1, "exp": "stand（忍受）是及物动词，soap operas 是复数，用宾格代词 them 代替。"}, {"q": "He plans ___ a new job next month.", "opts": ["finding", "find", "to find", "found"], "ans": 2, "exp": "plan 后接动词不定式作宾语：plan to do sth.（计划做某事）。"}, {"q": "—___ do you think of the new movie? —It's wonderful!", "opts": ["What", "How", "Why", "Which"], "ans": 0, "exp": "询问看法用固定句型 What do you think of...?（你觉得……怎么样？）。"}]}, {"name": "Unit 6 · I'm going to study computer science.", "npc": "梦想家小凯：你的未来职业是什么？", "teach": [{"title": "be going to 结构", "text": "be going to + 动词原形 表示打算、计划做某事，或根据迹象将要发生的事。be 动词随主语变化：I am going to...；He/She/It is going to...；We/You/They are going to...。例句：I'm going to study computer science.（我打算学习计算机科学。）否定：be + not going to；疑问：把 be 动词提到主语前。"}, {"title": "职业词汇", "text": "常见职业名词：engineer(工程师)、pilot(飞行员)、scientist(科学家)、computer programmer(电脑程序员)、actor/actress(演员)、doctor(医生)、teacher(教师)、violinist(小提琴手)、pianist(钢琴家)、cook(厨师)。问职业：What are you going to be?（你打算成为什么？）回答：I'm going to be an engineer."}, {"title": "How are you going to do that?", "text": "询问实现计划的方式：—How are you going to do that?（你打算怎么做？）—I'm going to take acting lessons.（我打算上表演课。）/ I'm going to practice every day.（我打算每天练习。）/ I'm going to study math really hard.（我打算非常努力地学数学。）回答都用 be going to + 动词原形。"}], "quiz": [{"q": "I ___ going to study computer science.", "opts": ["is", "am", "are", "be"], "ans": 1, "exp": "主语是 I，be going to 结构用 am：I am going to...。"}, {"q": "We ___ going to have a basketball game next Friday.", "opts": ["is", "are", "am", "be"], "ans": 1, "exp": "主语 We 是复数，be going to 结构用 are。"}, {"q": "—What are you going to be when you grow up? —I'm going to be ___.", "opts": ["an scientist", "scientist", "a scientist", "science"], "ans": 2, "exp": "职业名词前要加冠词，scientist 以辅音音素开头，用 a scientist。"}, {"q": "—___ are you going to do that? —I'm going to take acting lessons.", "opts": ["What", "How", "Where", "When"], "ans": 1, "exp": "回答'上表演课'说的是方式，问方式用 How：How are you going to do that?。"}]}, {"name": "Unit 7 · Will people have robots?", "npc": "未来学家艾米：预言 100 年后的世界！", "teach": [{"title": "will 将来时", "text": "will + 动词原形 表示将来要发生的动作或状态，所有人称通用。例句：People will have robots in their homes.（人们家里将会有机器人。）否定：will not = won't，后接动词原形；疑问：Will + 主语 + 动词原形？回答：Yes, 主语 + will. / No, 主语 + won't."}, {"title": "There will be 句型", "text": "There will be + 名词 表示'将会有……'：There will be more cars in the future.（将来会有更多汽车。）否定：There won't be...；疑问：Will there be...? 一般将来时的标志词：tomorrow、next year、soon、in the future、in 100 years。"}, {"title": "more / fewer / less", "text": "表示数量变化：more + 可数名词复数或不可数名词（更多）；fewer + 可数名词复数（更少）；less + 不可数名词（更少）。例句：There will be fewer trees and less pollution.（将会有更少的树、更少的污染。）"}], "quiz": [{"q": "I think people ___ have robots in their homes in the future.", "opts": ["are", "do", "will", "have"], "ans": 2, "exp": "in the future 是将来时间标志，一般将来时用 will + 动词原形。"}, {"q": "—Will there be more cars in the future? —Yes, there ___.", "opts": ["is", "are", "be", "will"], "ans": 3, "exp": "Will there be...? 的肯定回答是 Yes, there will."}, {"q": "There will be ___ pollution if we use less coal.", "opts": ["fewer", "many", "much", "less"], "ans": 3, "exp": "pollution 是不可数名词，'更少的'不可数名词用 less。"}, {"q": "Kids ___ go to school in 100 years. They will study at home on computers.", "opts": ["don't", "won't", "didn't", "aren't"], "ans": 1, "exp": "in 100 years 是将来时间，一般将来时的否定用 won't + 动词原形。"}]}, {"name": "Unit 8 · How do you make a banana milk shake?", "npc": "小厨师阿宝：跟我学做香蕉奶昔！", "teach": [{"title": "祈使句", "text": "祈使句以动词原形开头，表示命令、请求或建议：Peel the bananas.（剥香蕉皮。）Cut up the bananas.（切碎香蕉。）Put the bananas and yogurt into the blender.（把香蕉和酸奶放进搅拌机。）否定祈使句用 Don't + 动词原形：Don't forget to add salt.（别忘了加盐。）"}, {"title": "量词", "text": "不可数名词需要用量词来计量：a cup of yogurt(一杯酸奶)、two teaspoons of sugar(两茶匙糖)、a piece of bread(一片面包)、a slice of bread(一片面包)、three bottles of milk(三瓶牛奶)。注意：量词有复数形式，名词部分不变：two cups of...、three pieces of...。"}, {"title": "How many / How much", "text": "How many + 可数名词复数（多少）：How many bananas do we need? —Three. How much + 不可数名词（多少）：How much milk do we need? —Two cups. 注意：How many 的答语用具体数字；How much 的答语用数量词（two cups / a teaspoon 等）。"}], "quiz": [{"q": "___ the bananas and put them into the blender.", "opts": ["Peel", "Peels", "Peeling", "To peel"], "ans": 0, "exp": "祈使句以动词原形开头，表示命令或建议：Peel the bananas.（剥香蕉。）"}, {"q": "___ add too much sugar to the milk shake. It's not healthy.", "opts": ["Not", "Don't", "No", "Doesn't"], "ans": 1, "exp": "否定祈使句用 Don't + 动词原形：Don't add...（不要加……）。"}, {"q": "—___ yogurt do we need? —One cup.", "opts": ["How many", "How much", "How often", "How long"], "ans": 1, "exp": "yogurt（酸奶）是不可数名词，问多少用 How much + 不可数名词。"}, {"q": "—___ eggs do you need for the cake? —Four.", "opts": ["How much", "How often", "How many", "How long"], "ans": 2, "exp": "eggs 是可数名词复数，问数量用 How many + 可数名词复数。"}]}, {"name": "Unit 9 · Can you come to my party?", "npc": "派对达人小美：周六来参加我的聚会吧！", "teach": [{"title": "发出邀请与接受", "text": "邀请别人：Can you come to my party?（你能来我的聚会吗？）/ Would you like to come to my party?（你愿意来吗？）接受邀请：Sure, I'd love to.（当然，我很乐意。）/ Of course, I can.（当然可以。）/ Yes, I'd love to. 注意 I'd love to 后常省略动词。时间表达：on Saturday afternoon（周六下午）、at 7:00 pm（晚上七点）。"}, {"title": "拒绝邀请", "text": "拒绝时要礼貌地说明原因：Sorry, I can't. I have to study for a test.（对不起，我不能去。我得为考试复习。）常用原因：have to go to the doctor(得去看医生)、have to look after my sister(得照看我妹妹)、have to visit my grandparents(得去看望祖父母)。have to + 动词原形 表示'不得不'。"}, {"title": "might 表可能性", "text": "might + 动词原形 表示'可能、也许'，语气比 will 委婉、不确定：She might come to the party tonight.（她今晚可能会来聚会。）I might be a little late.（我可能会晚一点到。）交际运用：—Can you come to my party? —I might be late, but I can try.（我可能会晚点，但我会尽量来。）"}], "quiz": [{"q": "—Can you come to my party on Saturday? —Sure, ___.", "opts": ["I'd love to", "I'd love", "I love", "I can't"], "ans": 0, "exp": "接受邀请常用 Sure, I'd love to.，I'd love to 后省略了动词 come。"}, {"q": "—Can you go to the movies with me? —Sorry, I can't. I ___ study for a test.", "opts": ["must to", "have to", "has to", "had to"], "ans": 1, "exp": "主语是 I，用 have to + 动词原形表示'不得不'：I have to study...。"}, {"q": "—Can you play tennis with me this afternoon? —Sorry, I can't. I ___ go to the doctor.", "opts": ["has to", "must to", "have to", "had to"], "ans": 2, "exp": "拒绝邀请要说明原因：I have to go to the doctor.（我得去看医生。）"}, {"q": "She ___ come to the party tonight, but she isn't sure.", "opts": ["must", "might", "need", "has to"], "ans": 1, "exp": "but she isn't sure 说明不确定，用 might（可能）表示推测。"}]}, {"name": "Unit 10 · If you go to the party, you'll have a great time!", "npc": "智多星老张：条件句的魔法，if 一下就知道！", "teach": [{"title": "if 条件句（主将从现）", "text": "if 引导条件状语从句：主句用一般将来时（will + 动词原形），从句用一般现在时表示将来，这就是'主将从现'。例句：If you go to the party, you'll have a great time.（如果你去聚会，你会玩得很开心。）从句用一般现在时 go，主句用 will have。"}, {"title": "if 从句的位置", "text": "if 从句可以放在句首或句尾：放在句首时，后面要加逗号：If it rains, we will stay at home. 放在句尾时不加逗号：We will stay at home if it rains. 无论从句在哪个位置，都要遵循'主将从现'的原则。"}, {"title": "常见的 if 句型", "text": "主句除了用 will，还可以用祈使句或情态动词：If you don't hurry, you'll be late.（如果你不快点，你会迟到。）If you are tired, you can have a rest.（如果你累了，你可以休息一下。）否定从句用 If you don't...（如果你不……）。"}], "quiz": [{"q": "If you ___ to the party, you'll have a great time!", "opts": ["goes", "go", "will go", "went"], "ans": 1, "exp": "if 条件句'主将从现'：从句用一般现在时，主语 you 后接动词原形 go。"}, {"q": "If it ___ tomorrow, we will stay at home.", "opts": ["will rain", "rain", "rains", "rained"], "ans": 2, "exp": "主句 will stay 是一般将来时，if 从句用一般现在时；主语 it 是第三人称单数，用 rains。"}, {"q": "If she ___ hard, she will pass the exam.", "opts": ["will work", "work", "works", "worked"], "ans": 2, "exp": "从句主语 she 是第三人称单数，一般现在时动词要加 -s：works。"}, {"q": "If you don't hurry, you ___ the bus.", "opts": ["will miss", "miss", "missed", "would miss"], "ans": 0, "exp": "主句用一般将来时 will + 动词原形：you will miss the bus（你会错过公交车）。"}]}];
const BOSS = {"name": "魔王殿 · 英语总决战", "npc": "大魔王：过去时、比较级、最高级、将来时、条件句，全都要会！", "quiz": [{"q": "Last summer, I ___ to the beach and ___ a lot of photos.", "opts": ["go; take", "went; took", "go; took", "went; take"], "ans": 1, "exp": "last summer 是过去时间标志，go 和 take 的过去式都是不规则变化：went, took。"}, {"q": "—Which do you like ___, apples or oranges? —Apples. But of all fruits, I like watermelons ___.", "opts": ["better; best", "best; better", "more; most", "better; better"], "ans": 0, "exp": "两者比较（apples or oranges）用比较级 better；三者以上（of all fruits）用最高级 best。"}, {"q": "If you ___ hard, you ___ good grades.", "opts": ["study; will get", "will study; get", "studied; get", "study; get"], "ans": 0, "exp": "if 条件句主将从现：从句 study（一般现在时），主句 will get。"}, {"q": "—What are you going to do this weekend? —I ___ visit my grandparents.", "opts": ["will going to", "going to", "am going to", "am going"], "ans": 2, "exp": "be going to + 动词原形表示计划打算：I am going to visit...。"}]};
const LS = {
  coins: 'preview_coins_' + SUBJECT,
  stars: 'preview_stars_' + SUBJECT,
  unlocked: 'preview_unlocked_' + SUBJECT,
  cleared: 'preview_cleared_' + SUBJECT,
  wrong: 'preview_wrong_' + SUBJECT,
  boss: 'preview_boss_' + SUBJECT
};

// ===== 状态 =====
let state = {
  coins: 0, stars: 0,
  unlocked: [0],
  cleared: [],
  wrong: {},
  bossBeaten: false,
  curWorld: 0,
  curTeach: 0,
  curQ: 0,
  hearts: 3,
  worldStars: 0,
  isBoss: false
};

function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function loadState() {
  state.coins = lsGet(LS.coins, 0);
  state.stars = lsGet(LS.stars, 0);
  state.unlocked = lsGet(LS.unlocked, [0]);
  state.cleared = lsGet(LS.cleared, []);
  state.wrong = lsGet(LS.wrong, {});
  state.bossBeaten = lsGet(LS.boss, false);
}
function saveState() {
  lsSet(LS.coins, state.coins); lsSet(LS.stars, state.stars);
  lsSet(LS.unlocked, state.unlocked); lsSet(LS.cleared, state.cleared);
  lsSet(LS.wrong, state.wrong); lsSet(LS.boss, state.bossBeaten);
}
function resetGame() {
  state = { coins:0, stars:0, unlocked:[0], cleared:[], wrong:{}, bossBeaten:false, curWorld:0, curTeach:0, curQ:0, hearts:3, worldStars:0, isBoss:false };
  saveState(); renderHUD(); showMap();
}

// ===== 渲染 =====
const app = document.getElementById('app');
function renderHUD() {
  document.getElementById('hud-coins').textContent = state.coins;
  document.getElementById('hud-stars').textContent = state.stars;
  document.getElementById('hud-total').textContent = totalStars();
}
function totalStars() {
  let n = 0;
  WORLDS.forEach((w,i) => n += (state.cleared.includes(i) ? w.quiz.length : 0));
  if (state.bossBeaten) n += BOSS.quiz.length;
  return n;
}

function showMap() {
  sfx.jump();
  const worldsHtml = WORLDS.map((w, i) => {
    const locked = !state.unlocked.includes(i);
    const cleared = state.cleared.includes(i);
    const stars = cleared ? w.quiz.length : 0;
    return `<div class="world-item ${locked ? 'locked' : ''}" onclick="${locked ? '' : 'startWorld(' + i + ')'}">
      <div class="w-icon">${locked ? '🔒' : (cleared ? '⭐' : '🏰')}</div>
      <div class="w-info">
        <div class="w-name">第 ${i+1} 关 · ${w.name}</div>
        <div class="w-npc">${w.npc}</div>
      </div>
      <div class="w-status">${locked ? '<span class="lock">🔒 未解锁</span>' : (cleared ? '<span class="ok">★ ' + stars + '/' + w.quiz.length + '</span>' : '🆕 挑战')}</div>
    </div>`;
  }).join('');
  const bossLocked = !(WORLDS.every((w,i) => state.cleared.includes(i)));
  const bossHtml = `<div class="world-item ${bossLocked ? 'locked' : ''}" onclick="${bossLocked ? '' : 'startBoss()'}">
    <div class="w-icon">${bossLocked ? '🔒' : (state.bossBeaten ? '👑' : '👹')}</div>
    <div class="w-info">
      <div class="w-name">BOSS 关 · ${BOSS.name}</div>
      <div class="w-npc">${BOSS.npc}</div>
    </div>
    <div class="w-status">${bossLocked ? '<span class="lock">🔒 需通关全部关卡</span>' : (state.bossBeaten ? '<span class="ok">👑 已击败</span>' : '⚔️ 决战')}</div>
  </div>`;
  app.innerHTML = `<div class="screen">
    <div class="map-header">
      <h1>🎮 ${SUBJECT} 预习闯关</h1>
      <p>${VERSION} · 打通所有关卡，击败大魔王！</p>
    </div>
    <div class="world-list">${worldsHtml}${bossHtml}</div>
    <div class="map-buttons">
      <button class="btn btn-blue" onclick="showWrongBook()">📝 错题本</button>
      <button class="btn btn-gray" onclick="confirmReset()">🔄 重新开始</button>
    </div>
  </div>`;
}

function startWorld(i) {
  state.curWorld = i; state.curTeach = 0; state.curQ = 0; state.worldStars = 0;
  renderTeach();
}
function startBoss() {
  state.isBoss = true; state.curQ = 0; state.hearts = 3; state.worldStars = 0;
  renderBossIntro();
}

// ===== 教学页 =====
function renderTeach() {
  const w = WORLDS[state.curWorld];
  const t = w.teach[state.curTeach];
  const total = w.teach.length;
  const isLast = state.curTeach === total - 1;
  app.innerHTML = `<div class="screen teach-page">
    <h2>第 ${state.curWorld+1} 关 · ${w.name}（教学 ${state.curTeach+1}/${total}）</h2>
    <div class="teach-npc"><div class="npc-icon">🧙</div><div class="npc-text">${w.npc}</div></div>
    <div class="teach-body">
      <h3 style="color:#fff;margin-bottom:8px;">${t.title}</h3>
      <p>${t.text}</p>
    </div>
    <div class="teach-nav">
      <button class="btn btn-gray" onclick="showMap()">← 返回地图</button>
      <button class="btn btn-gold" onclick="${isLast ? 'startQuiz()' : 'nextTeach()'}">${isLast ? '开始答题 ⚔️' : '下一页 →'}</button>
    </div>
  </div>`;
  sfx.jump();
}
function nextTeach() {
  state.curTeach++;
  renderTeach();
}

// ===== 答题 =====
function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz() {
  state.curQ = 0; state.worldStars = 0;
  // 选项随机打乱
  const w = WORLDS[state.curWorld];
  w.quiz.forEach(q => {
    const idxs = [0,1,2,3];
    shuffleArr(idxs);
    q._opts = idxs.map(i => q.opts[i]);
    q._ans = idxs.indexOf(q.ans);
  });
  renderQuiz();
}
function renderQuiz() {
  const w = WORLDS[state.curWorld];
  const q = w.quiz[state.curQ];
  const total = w.quiz.length;
  const answered = q._answered;
  app.innerHTML = `<div class="screen quiz-page">
    <div class="q-num">Q${state.curQ+1}/${total} · 第 ${state.curWorld+1} 关</div>
    <div class="q-text">${q.q}</div>
    ${q._opts.map((o, i) => `
      <button class="opt ${answered ? (i === q._ans ? 'correct' : (i === q._picked ? 'wrong' : '')) : ''}" ${answered ? 'disabled' : ''} onclick="selQ(${i})">
        ${'ABCD'[i]}. ${o}
      </button>`).join('')}
    <div class="explanation ${answered ? 'show' : ''}" id="expl">✅ ${q.exp}</div>
    <div class="quiz-footer">
      <button class="btn btn-gray" onclick="showMap()">← 返回</button>
      <span class="q-stars">⭐ ${state.worldStars}/${total}</span>
      ${answered ? (state.curQ < total-1 ? '<button class="btn btn-gold" onclick="nextQ()">下一题 →</button>' : '<button class="btn btn-gold" onclick="finishWorld()">查看结果 🏁</button>') : ''}
    </div>
  </div>`;
}
function selQ(i) {
  const w = WORLDS[state.curWorld];
  const q = w.quiz[state.curQ];
  if (q._answered) return;
  q._picked = i;
  if (i === q._ans) {
    q._answered = true;
    state.worldStars++;
    state.coins += 10;
    state.stars++;
    sfx.correct();
  } else {
    q._answered = true;
    sfx.wrong();
    // 错题导入
    if (!state.wrong[state.curWorld]) state.wrong[state.curWorld] = [];
    state.wrong[state.curWorld].push({ q: q.q, ans: q.opts[q.ans], exp: q.exp, world: w.name });
  }
  saveState();
  renderQuiz();
}
function nextQ() {
  state.curQ++;
  renderQuiz();
}
function finishWorld() {
  const w = WORLDS[state.curWorld];
  const total = w.quiz.length;
  const got = state.worldStars;
  const passed = got === total;
  if (passed) {
    sfx.fanfare();
    if (!state.cleared.includes(state.curWorld)) {
      state.cleared.push(state.curWorld);
      const nxt = state.curWorld + 1;
      if (!state.unlocked.includes(nxt) && nxt < WORLDS.length) state.unlocked.push(nxt);
      state.coins += 50;
    }
  } else {
    sfx.wrong();
  }
  saveState();
  app.innerHTML = `<div class="screen result-page">
    <div class="result-title">${passed ? '🎉 闯关成功！' : '💔 闯关失败'}</div>
    <div class="result-stars">${[...Array(total)].map((_,i) => `<span class="${i < got ? '' : 'off'}">⭐</span>`).join('')}</div>
    <div class="result-detail">
      <p>答对 ${got}/${total} 题</p>
      <p style="margin-top:8px;">${passed ? '✅ 全部答对，解锁下一关！+50金币' : '❌ 需全部答对才能通过，加油再战！'}</p>
    </div>
    <div class="map-buttons" style="margin-top:20px;">
      ${passed ? '<button class="btn btn-green" onclick="showMap()">继续闯关 🏰</button>' : '<button class="btn btn-gold" onclick="startQuiz()">重新挑战 🔄</button>'}
      <button class="btn btn-blue" onclick="showMap()">地图</button>
    </div>
  </div>`;
  renderHUD();
}

// ===== BOSS =====
function renderBossIntro() {
  app.innerHTML = `<div class="screen boss-page">
    <div class="boss-title">⚠️ BOSS 战 ⚠️</div>
    <div class="boss-avatar">👹</div>
    <p style="margin-bottom:14px;color:#ff9;">${BOSS.npc}</p>
    <p style="color:#aaa;font-size:14px;">3 条命（♥），答错扣命，0 命需重打！</p>
    <div class="map-buttons" style="margin-top:20px;">
      <button class="btn btn-gray" onclick="showMap()">← 撤退</button>
      <button class="btn btn-red" onclick="startBossQuiz()">⚔️ 开战！</button>
    </div>
  </div>`;
  sfx.jump();
}
function startBossQuiz() {
  state.curQ = 0; state.hearts = 3; state.worldStars = 0;
  BOSS.quiz.forEach(q => {
    const idxs = [0,1,2,3];
    shuffleArr(idxs);
    q._opts = idxs.map(i => q.opts[i]);
    q._ans = idxs.indexOf(q.ans);
  });
  renderBossQuiz();
}
function renderBossQuiz() {
  if (state.hearts <= 0) {
    sfx.wrong();
    app.innerHTML = `<div class="screen boss-page">
      <div class="boss-title" style="color:var(--red);">💀 挑战失败</div>
      <div class="boss-avatar">👹</div>
      <p style="margin:14px 0;color:#aaa;">生命值为 0，BOSS 还在咆哮…</p>
      <button class="btn btn-red" onclick="startBossQuiz()">🔄 重新挑战</button>
      <button class="btn btn-gray" style="margin-left:10px;" onclick="showMap()">地图</button>
    </div>`;
    return;
  }
  const q = BOSS.quiz[state.curQ];
  const total = BOSS.quiz.length;
  const answered = q._answered;
  app.innerHTML = `<div class="screen quiz-page">
    <div class="q-num" style="color:var(--red);">☠️ BOSS 战 · Q${state.curQ+1}/${total}</div>
    <div class="hearts">${[...Array(3)].map((_,i) => `<span class="${i < state.hearts ? '' : 'lost'}">♥</span>`).join('')}</div>
    <div class="q-text">${q.q}</div>
    ${q._opts.map((o, i) => `
      <button class="opt ${answered ? (i === q._ans ? 'correct' : (i === q._picked ? 'wrong' : '')) : ''}" ${answered ? 'disabled' : ''} onclick="selBossQ(${i})">
        ${'ABCD'[i]}. ${o}
      </button>`).join('')}
    <div class="explanation ${answered ? 'show' : ''}">✅ ${q.exp}</div>
    <div class="quiz-footer">
      <button class="btn btn-gray" onclick="showMap()">← 撤退</button>
      ${answered ? (state.curQ < total-1 ? '<button class="btn btn-red" onclick="nextBossQ()">下一题 →</button>' : '<button class="btn btn-red" onclick="finishBoss()">⚔️ 终结 BOSS</button>') : ''}
    </div>
  </div>`;
}
function selBossQ(i) {
  const q = BOSS.quiz[state.curQ];
  if (q._answered) return;
  q._picked = i;
  if (i === q._ans) {
    q._answered = true;
    state.worldStars++;
    state.coins += 20;
    state.stars++;
    sfx.correct();
  } else {
    q._answered = true;
    state.hearts--;
    state.coins = Math.max(0, state.coins - 5);
    sfx.bossHit();
    if (!state.wrong['boss']) state.wrong['boss'] = [];
    state.wrong['boss'].push({ q: q.q, ans: q.opts[q.ans], exp: q.exp, world: 'BOSS关' });
  }
  saveState();
  renderBossQuiz();
}
function nextBossQ() {
  state.curQ++;
  renderBossQuiz();
}
function finishBoss() {
  if (state.worldStars === BOSS.quiz.length) {
    state.bossBeaten = true;
    state.coins += 100;
    saveState();
    bossVictory();
  } else {
    sfx.wrong();
    app.innerHTML = `<div class="screen boss-page">
      <div class="boss-title">😤 还差一点！</div>
      <p style="margin:14px;color:#aaa;">需全部答对才能击败 BOSS（当前 ${state.worldStars}/${BOSS.quiz.length}）</p>
      <button class="btn btn-red" onclick="startBossQuiz()">🔄 再战</button>
    </div>`;
  }
}
function bossVictory() {
  sfx.fanfare();
  document.body.classList.add('screen-shake');
  // 三波纸屑
  spawnConfetti(0); spawnConfetti(500); spawnConfetti(1500);
  setTimeout(() => document.body.classList.remove('screen-shake'), 600);
  app.innerHTML = `<div class="screen boss-page">
    <div class="boss-defeated">BOSS DEFEATED!</div>
    <div class="trophy">🏆</div>
    <div class="stat-panel">
      <h3>🎊 恭喜通关 ${SUBJECT} 预习！</h3>
      <div class="stat-row"><span>总星星</span><span>⭐ ${state.stars}</span></div>
      <div class="stat-row"><span>金币</span><span>🪙 ${state.coins}</span></div>
      <div class="stat-row"><span>已掌握关卡</span><span>${WORLDS.length}/${WORLDS.length} + BOSS</span></div>
    </div>
    <div class="map-buttons" style="margin-top:20px;">
      <button class="btn btn-gold" onclick="showMap()">🏰 返回地图</button>
      <button class="btn btn-blue" onclick="showWrongBook()">📝 错题本</button>
    </div>
  </div>`;
  renderHUD();
}
function spawnConfetti(delay) {
  const colors = ['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e67e22'];
  setTimeout(() => {
    for (let i = 0; i < 24; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '0';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDelay = (Math.random() * 0.5) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }
  }, delay);
}

// ===== 错题本 =====
function showWrongBook() {
  const entries = [];
  Object.keys(state.wrong).forEach(k => {
    (state.wrong[k] || []).forEach(e => entries.push(e));
  });
  const html = entries.length === 0
    ? '<div class="empty-tip">🎉 还没有错题，继续保持！</div>'
    : entries.map(e => `<div class="wrong-item">
        <div class="wq">📝 ${e.q}</div>
        <div class="wa">✅ 正确答案：${e.ans}</div>
        <div class="we">💡 ${e.exp}（${e.world}）</div>
      </div>`).join('');
  app.innerHTML = `<div class="screen wrongbook">
    <h2>📝 错题本（${entries.length}）</h2>
    ${html}
    <div class="map-buttons" style="margin-top:16px;">
      <button class="btn btn-blue" onclick="showMap()">← 返回地图</button>
    </div>
  </div>`;
}

// ===== 重置确认 =====
function confirmReset() {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal-card">
    <p>确定要重新开始吗？<br>所有星星、金币、进度将清零！</p>
    <div class="modal-btns">
      <button class="btn btn-gray" id="cancel-reset">取消</button>
      <button class="btn btn-red" id="ok-reset">确定重置</button>
    </div>
  </div>`;
  document.body.appendChild(mask);
  mask.querySelector('#cancel-reset').onclick = () => mask.remove();
  mask.querySelector('#ok-reset').onclick = () => { mask.remove(); resetGame(); };
}

// ===== 启动 =====
loadState();
app.innerHTML = `<div class="hud">
  <div class="hud-item">🪙 <span id="hud-coins" style="color:var(--gold)">${state.coins}</span></div>
  <div class="hud-item">⭐ <span id="hud-stars" style="color:var(--green)">${state.stars}</span></div>
  <div class="hud-item">🎯 <span id="hud-total" style="color:#fff">${totalStars()}</span></div>
</div>`;
showMap();
</script>
</body>
</html>
