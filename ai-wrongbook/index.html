<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI错题本 v4.0.27</title>
<base href="/xuci-jiancha/"><style>
/* ===== AI错题本-测试版 · 登录门禁 ===== */
.ab-gate{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;align-items:center;justify-content:center;padding:18px}
.ab-gate.ab-hide{display:none}
.ab-card{background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:360px;
  box-shadow:0 18px 50px rgba(0,0,0,.25)}
.ab-logo{font-size:1.12rem;font-weight:700;color:#1a202c;text-align:center}
  .ab-vip{display:inline-block;padding:9px 22px;border-radius:999px;background:linear-gradient(135deg,#f7cf5b,#e0890a);color:#fff;font-size:1.35rem;font-weight:800;letter-spacing:1px;box-shadow:0 6px 16px rgba(224,137,10,.32);text-shadow:0 1px 2px rgba(0,0,0,.18);margin:2px 0}
.ab-sub{font-size:.82rem;color:#718096;text-align:center;margin:.25rem 0 1rem}
.ab-tabs{display:flex;gap:.4rem;margin-bottom:.9rem}
.ab-tab{flex:1;background:#f0f2f5;color:#4a5568;border:none;padding:.5rem;border-radius:10px;
  font-weight:600;font-size:.9rem;cursor:pointer;font-family:inherit}
.ab-tab.active{background:#667eea;color:#fff}
.ab-card input{width:100%;padding:.62rem .8rem;border:1.5px solid #e2e8f0;border-radius:10px;
  font-size:.92rem;margin-bottom:.55rem;font-family:inherit;outline:none}
.ab-card input:focus{border-color:#667eea}
.ab-btn{width:100%;background:#667eea;color:#fff;border:none;padding:.68rem;border-radius:10px;
  font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:.2rem}
.ab-btn:disabled{opacity:.6;cursor:not-allowed}
.ab-msg{font-size:.82rem;min-height:1.15rem;margin-top:.6rem;text-align:center}
.ab-msg.err{color:#e53e3e}.ab-msg.ok{color:#38a169}
.ab-foot{font-size:.72rem;color:#a0aec0;text-align:center;margin-top:.8rem;line-height:1.5}
/* 账号信息：放进顶部紫色导航栏（右上角），跟着 sticky 导航栏一起吸顶 */
.ab-chip{position:static;margin-left:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);
  color:#fff;font-size:.72rem;padding:.24rem .58rem;border-radius:999px;display:flex;gap:.45rem;align-items:center;
  white-space:nowrap;line-height:1.5}
.ab-chip a{color:#fff;cursor:pointer;text-decoration:underline}
.ab-chip #abUserName{font-weight:600}
.ab-off{background:#ecc94b;color:#1a202c;border-radius:999px;padding:.05rem .45rem;font-size:.7rem}
.ab-trial{background:#fefcbf;color:#744210;border-radius:999px;padding:.05rem .45rem;font-size:.7rem;font-weight:700}
#abPayQrBox img{width:230px;max-width:82%;border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:6px}
#abPayQrBox .ab-qrhint{font-size:.8rem;color:#718096;line-height:1.6}
  .ab-invite-note{display:inline-block;margin:0 0 6px;padding:4px 14px;border-radius:999px;background:#e8f7ee;color:#1a7f4b;border:1px solid #b7e4c9;font-size:13px;font-weight:700}
  .ab-paytip{margin-top:10px;font-size:15px;font-weight:700;color:#b45309;background:#fff7e6;border:1px dashed #f0b429;border-radius:10px;padding:8px 10px;line-height:1.5}
  .ab-paytip b{font-size:22px;color:#d97706}
#abPayNote.ok{color:#2f855a}#abPayNote.err{color:#c53030}
.ab-lb{display:block;text-align:left;font-size:.8rem;color:#4a5568;font-weight:600;margin:.6rem 0 .25rem}
.ab-card select{width:100%;padding:.55rem .7rem;border:1px solid #cbd5e0;border-radius:8px;font-size:.95rem;
  font-family:inherit;background:#fff;color:#1a202c}
.ab-rad{display:flex;gap:1.4rem;justify-content:flex-start;padding:.3rem 0 .2rem;font-size:.95rem;color:#2d3748}
.ab-rad label{display:flex;align-items:center;gap:.35rem;cursor:pointer}
.ab-btn2{width:100%;background:#edf2f7;color:#2d3748;border:none;padding:.6rem;border-radius:10px;
  font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:.5rem}
.ab-bk{display:flex;gap:.5rem}
.ab-bk .ab-btn2{margin-top:.2rem;font-size:.85rem;padding:.55rem .4rem}
.ab-trial.lock{background:#fed7d7;color:#c53030;cursor:pointer}
/* 账号胶囊放在子导航行最右（顶部三标签取消后走 .ab-navrow 兜底通道） */
.ab-navrow .ab-chip{margin-left:auto}
@media (max-width:520px){
  .ab-chip{font-size:.6rem !important;padding:.1rem .34rem !important;gap:.2rem !important;margin-left:auto !important}
  .ab-chip .ab-trial,.ab-chip .ab-off{font-size:.58rem;padding:.01rem .26rem;border-radius:999px}
}
</style>

<style>
:root{--primary:#667eea;--secondary:#764ba2;--success:#48bb78;--warning:#ecc94b;--danger:#f56565;--info:#4299e1;--bg:#f0f2f5;--card-bg:#fff;--text:#1a202c;--text-light:#718096;--border:#e2e8f0;--radius:16px;--radius-sm:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
/* Navbar */
.navbar{background:linear-gradient(135deg,var(--primary),var(--secondary));padding:.7rem 0;position:sticky;top:0;z-index:1000;box-shadow:0 2px 20px rgba(102,126,234,.3)}
.navbar .container{max-width:1100px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between}
.navbar-brand{color:#fff;text-decoration:none;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.navbar-nav{display:flex;gap:.2rem;flex-wrap:wrap}
.navbar-nav a{color:rgba(255,255,255,.85);text-decoration:none;padding:.35rem .6rem;border-radius:8px;font-size:.82rem;transition:all .2s;display:flex;align-items:center;gap:.3rem;cursor:pointer}
.navbar-nav a:hover,.navbar-nav a.active{background:rgba(255,255,255,.2);color:#fff}
/* 返回上一页（老板 2026-10-02） */
.navbar .container{gap:.35rem}
.navbar-brand{margin-right:auto}
.nav-back{display:none;align-items:center;gap:.3rem;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:.3rem .7rem;font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s}
.nav-back.on{display:inline-flex}
.nav-back:hover{background:rgba(255,255,255,.32)}
@media(max-width:768px){.nav-back span{display:none}.nav-back{padding:.32rem .55rem;font-size:.85rem}}
.container{max-width:1100px;margin:0 auto;padding:1rem}
.page{display:none}.page.active{display:block;animation:fadeInUp .35s ease}
.card{background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:1.05rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.5rem}
.stat-card{border-radius:var(--radius);padding:1.2rem;color:#fff;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.stat-card:active{transform:translateY(0) scale(.985)}
.stat-go{font-size:.95rem;font-weight:700;opacity:.8;margin-left:.18rem;line-height:1}
.stat-card::before{content:'';position:absolute;top:-40%;right:-20%;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.1)}
.stat-card .num{font-size:2rem;font-weight:900}
.stat-card .label{font-size:.8rem;opacity:.85}
.stat-card .icon{position:absolute;right:1rem;bottom:.8rem;font-size:1.8rem;opacity:.2}
.bg-g1{background:linear-gradient(135deg,#667eea,#764ba2)}
.bg-g2{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.bg-g3{background:linear-gradient(135deg,#2ecc71,#27ae60)}
.bg-g4{background:linear-gradient(135deg,#f39c12,#e67e22)}
/* 首页快捷入口（老板 2026-10-02：录入/打印/复习要点） */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.5rem}
.quick-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;padding:1rem .6rem;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.05);font-family:inherit;color:var(--text);text-decoration:none}
.quick-btn i{font-size:1.35rem;width:2.7rem;height:2.7rem;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff}
.quick-btn span{font-size:.9rem;font-weight:600;line-height:1.2}
.quick-btn small{font-size:.7rem;color:var(--text-light)}
.quick-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.1);border-color:transparent}
.quick-btn:active{transform:translateY(0) scale(.98)}
.qb-add i{background:linear-gradient(135deg,#667eea,#764ba2)}
.qb-print i{background:linear-gradient(135deg,#4299e1,#2b6cb0)}
/* 录入页 · 题目图片置顶突出（老板 2026-10-02） */
.img-first{border:2px dashed var(--primary);background:linear-gradient(135deg,#faf8ff,#f2eeff);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1rem}
.img-first-head{font-size:1.02rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:.45rem;margin-bottom:.6rem}
.img-first-head i{color:var(--primary)}
.img-opt{font-size:.74rem;font-weight:500;color:var(--text-light);margin-left:.15rem}
.img-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:1.3rem 1rem;background:#fff;border:2px dashed #c4b5fd;border-radius:12px;cursor:pointer;transition:all .2s;text-align:center;margin:0}
.img-drop:hover{border-color:var(--primary);background:#fbfaff;transform:translateY(-1px)}
.img-drop:active{transform:translateY(0) scale(.995)}
.img-drop i{font-size:2rem;color:var(--primary)}
.img-drop-main{font-size:1rem;font-weight:700;color:var(--text)}
.img-drop-sub{font-size:.76rem;color:var(--text-light);line-height:1.55}
.img-file-hidden{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.img-preview{margin-top:.7rem;max-width:340px}
.img-shot{width:100%;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.13)}
.img-del{display:inline-block;margin-top:.35rem;font-size:.78rem;color:var(--danger);cursor:pointer;font-weight:600}
.recog-status{margin-top:.6rem;padding:.6rem .8rem;border-radius:10px;background:#f8f5ff;border:1px solid #ddd6fe;font-size:.85rem;line-height:1.65;word-break:break-word}
.recog-pick{display:flex;flex-direction:column;gap:.4rem}
.recog-pick-btn{text-align:left;background:#fff;border:1.5px solid #ddd6fe;border-radius:10px;padding:.55rem .7rem;font-size:.85rem;cursor:pointer;font-family:inherit;color:var(--text);display:flex;flex-direction:column;gap:.2rem;transition:all .15s}
.recog-pick-btn:hover{border-color:var(--primary);background:#fbfaff}
.recog-pick-btn b{color:var(--primary)}
.ai-setup-card{border:1px solid #ddd6fe;border-radius:12px;background:linear-gradient(135deg,#faf8ff,#f5f3ff);padding:.8rem .9rem;margin-bottom:.9rem}
.ai-setup-head{font-weight:700;color:#5b21b6;font-size:.92rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.ai-setup-state{margin-left:auto;font-size:.72rem;font-weight:600;color:#475569;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:.1rem .45rem}
.ai-setup-body{font-size:.83rem;color:#3f3d56;line-height:1.85;margin-top:.45rem}

.review-card{text-align:center;padding:2rem}

.pick-bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}

}
/* Analysis */

.analysis-table{width:100%;border-collapse:collapse;font-size:.85rem}

@media(max-width:768px){.navbar-nav a span{display:none}.stat-grid{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(3,1fr)}.quick-btn{padding:.8rem .4rem}.quick-btn i{width:2.3rem;height:2.3rem;font-size:1.15rem}.quick-btn span{font-size:.82rem}.quick-btn small{font-size:.65rem}.subject-grid{grid-template-columns:repeat(3,1fr)}.filter-bar .form-select,.filter-bar .form-control{min-width:100px}}
/* ==== 年级维度（1-12年级）==== */

.grade-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

<script>
// ===================== DATA LAYER =====================
const LS_KEY = 'wrong_bank_data_test';
const IMPORT_KEY = 'wrong_bank_import_test';
// ⚠️ 历史/地理/生物/道法 已下线（老板 2026-09-25 要求）；前 5 科 id 不变，旧数据不受影响
const SUBJECTS_DEFAULT = ['数学','语文','英语','物理','化学'];
const REMOVED_SUBJECTS = ['历史','地理','生物','道法'];
const SUBJECT_ICONS = ['fa-calculator','fa-book','fa-language','fa-flask','fa-flask','fa-history','fa-globe','fa-leaf','fa-gavel'];
const SUBJECT_COLORS = ['#e74c3c','#3498db','#2ecc71','#667eea','#9b59b6','#f39c12','#1abc9c','#2ecc71','#34495e'];
const ERROR_REASONS = ['概念不清','计算失误','审题不清','思路错误','公式记错','其他'];
const SOURCES = ['考试','作业','练习','课外题','其他'];
const REVIEW_INTERVALS = [1,3,7,15,30];

function loadData() {
  let d = JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(!d||!d.subjects){
    d={subjects:SUBJECTS_DEFAULT.map((n,i)=>({id:i+1,name:n,sort_order:i})),chapters:[],questions:[],nextQId:1,nextChapId:1};
    saveData(d);
  }
  const _rp=repairIds(d);
  if(_rp){saveData(d);toast('🔧 已修复 '+_rp+' 道错题的重复编号','info');}
  const _mg=migrateGrades(d);
  if(_mg){saveData(d);toast('📚 已把 '+_mg+' 道旧错题归入 '+DEFAULT_GRADE+'年级（可在详情页修改）','info');}
  if(pruneSubjects(d))saveData(d);   // 下线科目清理
  return d;
}
// ===================== 跨设备同步（威联通后端 api_wrongbank.php） =====================
// 同步后端地址解析：
//   ① https 站点（cloudflared 隧道）→ 同源相对路径，由本机 8099 服务反代到威联通（免混合内容）
//   ② 威联通本机页面 → 同源相对路径，直连自己的 PHP
//   ③ 其它来源（如群晖版页面，内网 http）→ 直接指向威联通
const SYNC_REMOTE = 'http://192.168.3.88/xuci-jiancha/api_wrongbank_test.php';
const SYNC_API = (function(){
  const host = location.hostname;
  if (host === '192.168.3.88') return '/xuci-jiancha/api_wrongbank_test.php';                  // ① 威联通页面：直连本地 PHP
  if (/\.trycloudflare\.com$/.test(host)) return '/xuci-jiancha/api_wrongbank_test.php';       // ② 隧道(https)：同源，由 8099 反代
  if (location.protocol === 'https:') return null;                          // ③ 其它 https（如 GitHub Pages）：本机模式
  return SYNC_REMOTE;                                                       // ④ 内网其它来源（如群晖）：指向威联通
})();
const SYNC_TOKEN = 'xuji-sync-2026';
let _syncTimer = null, _syncPulling = false, _lastPushed = '';
// ⚠️ 数据保护闸：只有「成功从服务器拉取过」才允许上传。
//    历史事故：NAS 慢/拉取失败时页面退回本机旧数据，此时任何一次编辑都会把旧数据整包
//    推回服务器 → 服务器上的新内容（如刚补的五维分析）被静默覆盖。故加此闸门。
let _pullOK = false;
// ⚠️ 无超时的 fetch 会让「正在同步…」在 NAS 慢时无限转（2026-09-27 实测同一接口 3 次里 2 次 45s+ 无响应、
//    1 次 15.7s 才成功）→ 统一走带超时的 fetchTO，失败即抛，交给重试循环；之后最多再自动重试 3 次。
const SYNC_TIMEOUT_MS = 20000;
const SYNC_TRIES = 3;
let _syncRetryTimer = null, _autoRetry = 0;
async function fetchTO(url, opts, ms){
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctl ? setTimeout(()=>ctl.abort(), ms) : null;
  try{
    return await fetch(url, ctl ? Object.assign({}, opts||{}, {signal:ctl.signal}) : (opts||{}));
  }catch(e){
    if(e && e.name==='AbortError') throw new Error('请求超时 '+Math.round(ms/1000)+'s');
    throw e;
  }finally{ if(timer) clearTimeout(timer); }
}

function _syncOn(){ return !!SYNC_API; }

// 【账号隔离】云同步按登录账号分文件存放。
//   页面通过 window.__wbSyncUser() 提供当前登录账号（测试版注入，见构建脚本）；
//   未注入时（如学习中心正式页）只带共用令牌，行为与以前完全一致。
function syncUser(){
  try{ return (typeof window.__wbSyncUser === 'function' && window.__wbSyncUser()) || ''; }catch(e){ return ''; }
}
function syncHeaders(extra){
  const h = Object.assign({'X-Sync-Token':SYNC_TOKEN}, extra || {});
  const u = syncUser();
  if(u) h['X-Sync-User'] = u;                     // 有账号 → 服务器按账号分文件存
  return h;
}

async function cloudPull(){
  const r = await fetchTO(`${SYNC_API}?action=load`, {headers:syncHeaders(), cache:'no-store'}, SYNC_TIMEOUT_MS);
  if(!r.ok) throw new Error(r.status === 403
    ? '未登录：云端同步需先登录账号（数据仍安全存在本机）'
    : 'HTTP '+r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'load 失败');
  return j;   // {data, updated_at}  data 可能为 null
}

async function cloudPushNow(d){
  const body = JSON.stringify(d);
  if(body === _lastPushed) return;               // 无变化不重复上传
  const r = await fetchTO(`${SYNC_API}?action=save`, {
    method:'POST',
    headers:syncHeaders({'Content-Type':'application/json'}),
    body
  }, SYNC_TIMEOUT_MS*2);
  let j = null;
  try{ j = await r.json(); }
  catch(e){ throw new Error(r.status === 403 ? '未登录，改动只存本机' : '服务端返回异常(HTTP '+r.status+')'); }
  if(!j.ok) throw new Error(j.error||'save 失败');
  _lastPushed = body;
  return j;
}

function cloudPush(d){                            // 防抖：停止操作 1.2s 后上传
  if(!SYNC_API) return;                           // 无可用后端（https 版）→ 纯本机模式
  if(!_pullOK){                                   // ⚠️ 数据保护闸：没成功拉过服务器数据就不许上传
    setSyncBadge('error','未连上云端：改动只存本机，不会覆盖服务器（点此徽章可重试同步）');
    return;
  }
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(()=>{
    cloudPushNow(d).then(()=>{ setSyncBadge('ok'); })
                   .catch(e=>{ setSyncBadge('error', e.message); });
  }, 1200);
}

function setSyncBadge(state, msg){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(state==='ok'){ el.textContent='☁️ 已同步'; el.style.background='#e6f4ea'; el.style.color='#137333'; el.title='已保存到服务器，其他设备可见'; }
  else if(state==='error'){ el.textContent='⚠️ 同步失败(仅本机)'; el.style.background='#fce8e6'; el.style.color='#c5221f'; el.title=msg||''; }
  else if(state==='local'){ el.textContent='📴 本机模式'; el.style.background='#f1f3f4'; el.style.color='#5f6368'; el.title='此页面地址无同步服务（如 GitHub Pages 版），数据仅存本机；用 NAS 地址打开即可跨设备同步'; }
  else if(state==='pulling'){ el.textContent='⏳ 正在同步…'; el.style.background='#e8f0fe'; el.style.color='#1967d2'; }
  else { el.textContent='☁️ 同步已启用'; el.style.background='#f1f3f4'; el.style.color='#5f6368'; }
}

async function cloudInit(forceRemote, silent){
  if(!SYNC_API){ setSyncBadge('local'); return; }   // 如 GitHub Pages(https) 版：无后端可用
  setSyncBadge('pulling');
  let j=null, lastErr=null;
  for(let attempt=1; attempt<=SYNC_TRIES; attempt++){   // 单次限时 20s + 重试（2s/4s 退避）；以前无超时会一直挂
    try{ j=await cloudPull(); lastErr=null; break; }
    catch(e){ lastErr=e; if(attempt<SYNC_TRIES) await new Promise(r=>setTimeout(r, attempt*2000)); }
  }
  try{
    if(lastErr) throw lastErr;
    _pullOK = true;                                 // 拉取成功 → 打开上传闸门
    const localRaw = localStorage.getItem(LS_KEY);
    const localObj = localRaw ? JSON.parse(localRaw) : null;
    const hasRemote = j.data && Array.isArray(j.data.questions) && (j.data.questions.length > 0 || (j.data.subjects||[]).length > 0);
    _autoRetry = 0;
    if(_syncRetryTimer){ clearTimeout(_syncRetryTimer); _syncRetryTimer=null; }
    if(hasRemote){
      // 服务器有真实数据：以服务器为准（服务器是唯一真实源）
      saveData(j.data);                                   // 走统一保存：顺便校准 id 计数器
      _lastPushed = JSON.stringify(j.data);
      const _chg=repairIds(j.data)+migrateGrades(j.data)+pruneSubjects(j.data);
      if(_chg){ saveData(j.data); _lastPushed=''; cloudPushNow(j.data).then(()=>setSyncBadge('ok')).catch(()=>{}); }
      setSyncBadge('ok');
      if(!silent){ navigate('dashboard'); toast('☁️ 已从服务器同步最新错题本','success'); }
    }else{
      // 服务器为空或只有空壳：把本地数据推上去初始化
      const d0 = loadData();
      await cloudPushNow(d0);
      setSyncBadge('ok');
      if(!silent) toast('☁️ 已把本机错题上传到服务器完成初始化','success');
    }
  }catch(e){
    // 后端不可达：file:// 或无 PHP 的静态站（如 GitHub Pages）→ 中性提示，静默退回本机模式
    _pullOK = false;                                // ⚠️ 关闭上传闸门：本机可能是旧数据，禁止覆盖服务器
    const neutral = (location.protocol === 'file:') || !/^https?:/.test(location.protocol);
    if(neutral){
      setSyncBadge('local');
    }else{
      setSyncBadge('error', '云端暂时连不上（'+e.message+'）：先显示本机数据，改动只存本机、不会覆盖服务器（点徽章立即重试）');
      if(!silent) toast('⚠️ 云端暂时连不上，先显示本机数据；改动只存本机，不会覆盖服务器','error');
      // 网络恢复后自动再同步（最多 3 次、间隔 60s，静默进行不打断当前操作）
      if(_autoRetry < 3){
        _autoRetry++;
        if(_syncRetryTimer) clearTimeout(_syncRetryTimer);
        _syncRetryTimer = setTimeout(()=>{ _syncRetryTimer=null; cloudInit(false,true); }, 60000);
      }
    }
  }
}

function _maxId(arr,key){return (arr||[]).reduce((m,x)=>Math.max(m,(x&&+x[key])||0),0);}
function saveData(d){
  // ⚠️ 历史 bug：调用方常拿旧快照回写，把 nextQId 覆盖回旧值（生产库曾出现已有 39 题而
  //    nextQId=1）→ 新录入的题被分配与旧题重复的 id，点开新题看到的是旧题（find 取首个匹配）。
  //    这里每次保存都按现有最大 id 校准计数器，从根上堵住。
  if(d&&Array.isArray(d.questions))d.nextQId=Math.max((+d.nextQId)||1,_maxId(d.questions,'id')+1);
  if(d&&Array.isArray(d.chapters))d.nextChapId=Math.max((+d.nextChapId)||1,_maxId(d.chapters,'id')+1);
  localStorage.setItem(LS_KEY,JSON.stringify(d));cloudPush(d);
}

// ===================== 数据备份：导出 / 导入恢复 =====================
// 用途：换手机、重装、升级前留底。导出 = 整份错题库（含章节 + 三层训练答案 + 五维分析）；
//       导入 = 与当前数据【合并】（按题干判重、重新编号），只增不减，绝不覆盖已有题目。
function _bkStamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function backupFileName(){ return `AI错题本备份_${_bkStamp()}.json`; }
function buildBackupPack(){
  const d = loadData();
  return {
    app: 'AI错题本',
    app_version: (typeof window.__APP_VERSION__ !== 'undefined' ? String(window.__APP_VERSION__) : 'web'),
    data_version: 2,
    exported_at: new Date().toISOString(),
    counts: {questions:(d.questions||[]).length, chapters:(d.chapters||[]).length, subjects:(d.subjects||[]).length},
    data: d
  };
}
// 导出：App 内走原生桥存到「手机存储/Download/AI错题本备份/」；浏览器里直接下载
function exportBackup(){
  const pack = buildBackupPack();
  const txt  = JSON.stringify(pack, null, 2);
  const name = backupFileName();
  try{
    if(window.AndroidBridge && typeof AndroidBridge.saveBackup === 'function'){
      const r = String(AndroidBridge.saveBackup(name, txt) || '');
      if(r.indexOf('OK:') === 0)  return {where:'native', path:r.slice(3), name, counts:pack.counts};
      if(r.indexOf('ERR:') === 0) return {where:'error', msg:r.slice(4), name, counts:pack.counts};
    }
  }catch(e){}
  try{
    const blob = new Blob([txt], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{URL.revokeObjectURL(a.href); a.remove();}catch(e){} }, 2000);
    return {where:'browser', name, counts:pack.counts};
  }catch(e){
    return {where:'error', msg:'当前环境无法保存文件：'+(e.message||e), name, counts:pack.counts};
  }
}
// 导入：文本 → 合并进当前数据（返回新增/跳过统计）
function importBackupText(txt){
  let o = null;
  try{ o = JSON.parse(txt); }catch(e){ throw new Error('不是有效的备份文件（JSON 解析失败）'); }
  const src = (o && o.data && Array.isArray(o.data.questions)) ? o.data
            : (o && Array.isArray(o.questions)) ? o : null;
  if(!src) throw new Error('备份里没有找到错题数据');
  const cur = loadData();
  const norm = s => String(s==null?'':s).replace(/\s+/g,'').trim().slice(0,150);
  const item = (arr,k) => (arr||[]).filter(x=>x&&x[k]!=null).map(x=>x[k]);

  // 1) 科目：按名字对齐，缺的补上
  const curSubj = cur.subjects || (cur.subjects=[]);
  const subjName = id => { const s = (src.subjects||[]).find(x=>+x.id===+id); return s ? String(s.name||'').trim() : ''; };
  const subjOf = nm => {
    if(!nm) return null;
    let s = curSubj.find(x=>String(x.name||'').trim()===nm);
    if(!s){
      s = {id: Math.max(0,...item(curSubj,'id'))+1, name: nm, sort_order: curSubj.length};
      curSubj.push(s);
    }
    return s;
  };
  // 2) 章节：按「科目+章节名」对齐，记录新旧 id 映射
  const curChap = cur.chapters || (cur.chapters=[]);
  const chapMap = {};
  (src.chapters||[]).forEach(c=>{
    const nm = String(c.name||'').trim(); if(!nm) return;
    const s  = subjOf(subjName(c.subject_id)); if(!s) return;
    let c2 = curChap.find(x=>String(x.name||'').trim()===nm && +x.subject_id===+s.id);
    if(!c2){
      c2 = {id: Math.max(0,...item(curChap,'id'))+1, subject_id: s.id, name: nm, sort_order: curChap.length};
      curChap.push(c2);
    }
    chapMap[c.id] = c2.id;
  });
  // 3) 错题：按题干判重，导入的重新编号（避免与现有 id 撞车）
  let nextId = Math.max((+cur.nextQId)||1, ...([0].concat(item(cur.questions,'id').map(Number)))) + 1;
  nextId = Math.max(nextId, Math.max(0,...item(cur.questions,'id'))+1);
  const seen = new Set((cur.questions||[]).map(q=>norm(q.content)));
  let added=0, skipped=0;
  (src.questions||[]).forEach(q=>{
    const k = norm(q.content);
    if(!k || seen.has(k)){ skipped++; return; }
    const nq = JSON.parse(JSON.stringify(q));
    const s  = subjOf(subjName(q.subject_id));
    nq.id = nextId++;
    if(s) nq.subject_id = s.id;
    if(q.chapter_id!=null && chapMap[q.chapter_id]!=null) nq.chapter_id = chapMap[q.chapter_id];
    seen.add(k);
    cur.questions.push(nq);
    added++;
  });
  cur.nextQId = Math.max(nextId, Math.max(0,...item(cur.questions,'id'))+1);
  cur.nextChapId = Math.max((+cur.nextChapId)||1, Math.max(0,...item(cur.chapters,'id'))+1);
  saveData(cur);
  return {added, skipped, srcTotal:(src.questions||[]).length, total:(cur.questions||[]).length,
          chapters:(cur.chapters||[]).length};
}
// 弹系统文件选择框 → 读文件 → 合并
function pickBackupFile(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.style.display = 'none';
  inp.onchange = function(){
    const f = inp.files && inp.files[0];
    if(!f){ inp.remove(); return; }
    const rd = new FileReader();
    rd.onload = function(){
      try{
        const r = importBackupText(String(rd.result||''));
        toast(`✅ 导入完成：新增 ${r.added} 题，跳过重复 ${r.skipped} 题（现有共 ${r.total} 题）`,'success');
      }catch(e){ toast('❌ 导入失败：'+(e.message||e),'error'); }
      inp.remove();
    };
    rd.onerror = function(){ toast('❌ 文件读取失败','error'); inp.remove(); };
    rd.readAsText(f, 'utf-8');
  };
  document.body.appendChild(inp);
  inp.click();
}

function genId(){const d=loadData();const id=Math.max((+d.nextQId)||1,_maxId(d.questions,'id')+1);d.nextQId=id+1;saveData(d);return id;}
function genChapId(){const d=loadData();const id=Math.max((+d.nextChapId)||1,_maxId(d.chapters,'id')+1);d.nextChapId=id+1;saveData(d);return id;}
function repairIds(d){                          // 一次性修补历史重复编号
  if(!d)return 0;
  const used=new Set();let fixed=0;
  (d.questions||[]).forEach(q=>{
    if(used.has(q.id)){const nid=(used.size?Math.max(...used):0)+1;q.id=nid;used.add(nid);fixed++;}
    else used.add(q.id);
  });
  if(fixed)d.nextQId=(used.size?Math.max(...used):0)+1;
  return fixed;
}
// 下线科目：从已有数据里移除历史/地理/生物/道法（该科下仍挂着题或章节则保留，避免孤儿数据）
function pruneSubjects(d){
  if(!d||!Array.isArray(d.subjects))return 0;
  const qs=(d.questions||[]).map(q=>q.subject_id),cs=(d.chapters||[]).map(c=>c.subject_id);

  return before-d.subjects.length;
}

// ===================== ROUTER =====================
let currentPage='dashboard';
// ── 返回上一页：返回栈 + 系统返回键联动（老板 2026-10-02）────
let _navStack=[],_curData=null,_skipPop=0;
function _paint(page,data){
  currentPage=page;_curData=data===undefined?null:data;
  document.querySelectorAll('.navbar-nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  render(page,data);
  updateNavBack();
  window.scrollTo({top:0,behavior:'smooth'});
}
function navigate(page,data){
  if(page==='dashboard')_navStack=[];
  else{_navStack.push({page:currentPage,data:_curData});if(_navStack.length>30)_navStack.shift();}
  try{history.pushState({nav:_navStack.length},'');}catch(e){}
  _paint(page,data);
}
function goBack(){
  if(!_navStack.length){if(currentPage!=='dashboard')navReset('dashboard');return;}
  const p=_navStack.pop();
  _skipPop++;try{history.back();}catch(e){_skipPop--;}
  _paint(p.page,p.data);
}
function navReset(page,data,stack){   // 保存/删除后：重置返回栈，避免返回已经过期的页
  _navStack=(stack||[{page:'dashboard',data:null}]).slice();
  try{history.pushState({nav:_navStack.length},'');}catch(e){}
  _paint(page,data);
}
function updateNavBack(){const b=document.getElementById('navBack');if(b)b.classList.toggle('on',_navStack.length>0);}
window.addEventListener('popstate',function(){   // 安卓系统返回键
  if(_skipPop>0){_skipPop--;return;}
  if(!_navStack.length)return;
  const p=_navStack.pop();_paint(p.page,p.data);
});
document.querySelectorAll('.navbar-nav a').forEach(a=>a.addEventListener('click',()=>navigate(a.dataset.page)));

}

async function aiChatRaw(messages,cfg,maxTokens,useJson){
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),200000);
  try{
    const payload={model:cfg.model,messages,temperature:0.1,max_tokens:maxTokens||4000};
    if(useJson)payload.response_format={type:'json_object'};
    const r=await fetch(String(cfg.base).replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify(payload)});
    if(!r.ok){let msg='';try{msg=(await r.json()).error.message||'';}catch(e){}const er=new Error('HTTP '+r.status+(msg?'：'+msg:''));er.status=r.status;throw er;}
    return await r.json();
  } finally{clearTimeout(tm);}
}

    {type:'image_url',image_url:{url:dataUrl}},{type:'text',text:vlUserMsg()}]}];
  let j;                                   // 先带 JSON 模式，个别模型不支持就退回普通模式
  try{ j=await aiChatRaw(msgs,cfg,4000,true); }
  catch(e){ if(e.status===400||e.status===422) j=await aiChatRaw(msgs,cfg,4000,false); else throw e; }

  return o;
}

async function analyzeOneQuestion(q,no,dataUrl){
  if(!String(q.content||'').trim()){                 // 清单项：先单独精读，保证题干逐字
    const one=await vlAskQuestion(dataUrl,no);
    if(one.content){q.content=one.content;q.wrong=one.wrong||q.wrong;q.note=one.note||q.note;}
  }
  if(!String(q.content||'').trim()) throw new Error('题干没认出');
  const rc={subject:afSubjectName(),grade:addForm.grade,chapter:'',source:addForm.source,
            content:q.content,wrong:q.wrong||'',image:false};
  const msgs=[{role:'system',content:AI_SYS},{role:'user',content:aiUserMsg(rc)}];
  let last=null;
  for(let attempt=0;attempt<2;attempt++){            // 失败自动重试一次（第二次换更硬的指令）
    const use=attempt?msgs.concat([{role:'user',content:'上一次输出不是合法 JSON。请只输出一个 JSON 对象：第一个字符是 {，最后一个字符是 }，不要解释、不要代码块、不要省略。'}]):msgs;
    const j=await aiChat(use,aiCfg(),8000);
    try{return aiParse(j);}catch(e){last=e;}
  }
  throw last;
}

async function retryBatchItem(i){

    if(!vlCfg().key)throw new Error('视觉模型没配 Key');
    if(!aiCfg().key)throw new Error('文本模型没配 Key');

    error_reason:String(oo.error_reason||'概念不清'),
    tags:Array.isArray(oo.tags)?oo.tags.join(','):String(oo.tags||''),
    source:addForm.source,difficulty:+oo.difficulty||3,grade:(addForm.grade?+addForm.grade:lastGrade()),

function vlCleanNote(n){

async function aiRecognizeImage(){
  const dataUrl=addForm.image_path;
  if(!dataUrl){setRecStatus('⚠️ 先选一张题目图片',true);return;}
  const btn=document.getElementById('ai_recog_btn');
  if(btn){btn.disabled=true;btn.style.opacity=.6;}
  _vlQuestions=[];_vlPick=new Set();_vlBatch=[];_vlBatchPick=new Set();renderRecPick();
  setRecStatus('🖼️ AI 正在识别图片（约 10-40 秒，请稍等）…');
  try{
    const o=await aiVision(dataUrl);
    // ① 基本信息
    const sub=String(o.subject||'').trim();
    if(sub){
      const sel=document.getElementById('af_subject');
      const opt=sel?[...sel.options].find(x=>x.textContent.trim()===sub||x.textContent.includes(sub)):null;
      if(opt){sel.selectedIndex=opt.index;addForm.subject_id=parseInt(opt.value);}
    }
    const gr=String(o.grade==null?'':o.grade).replace(/[^0-9]/g,'');
    if(gr){const g=document.getElementById('af_grade');if(g){g.value=gr;addForm.grade=gr;}}
    if(o.source){
      const s=document.getElementById('af_source');
      if(s){                            // 来源是下拉框：认出的试卷名当新选项塞进去并选中
        const sv=String(o.source).trim();
        let opt=[...s.options].find(x=>x.value===sv||x.textContent.trim()===sv);
        if(!opt){opt=document.createElement('option');opt.value=sv;opt.textContent=sv;s.appendChild(opt);}
        s.value=opt.value; addForm.source=opt.value;
      }
    }
    // ② 题目：第1题逐字全文 + 其余题清单（整卷一次抄完容易抄飞，所以只对选中的那题精读）
    let qs=[];
    const f=o.first||o.question||null;
    if(f&&String(f.content||'').trim())
      qs.push({n:f.n||1,content:String(f.content).trim(),wrong:String(f.wrong||'').trim(),note:vlCleanNote(o.note)});
    const others=Array.isArray(o.others)?o.others:(Array.isArray(o.rest)?o.rest:[]);
    others.forEach((r,k)=>{
      if(!r)return;
      const n=r.n||r.num||(k+2);
      if(qs.some(x=>String(x.n)===String(n)))return;
      const head=String(r.head||'').trim(),rw=String(r.wrong||'').trim();
      if(!head&&!rw)return;
      qs.push({n:n,content:'',head:head,wrong:rw});
    });
    if(!qs.length&&Array.isArray(o.questions)){        // 兼容旧格式（整卷 questions）
      qs=o.questions.filter(q=>q&&String(q.content||'').trim())
        .map(q=>({n:q.n,content:String(q.content).trim(),wrong:String(q.wrong||'').trim(),note:vlCleanNote(o.note)}));
    }
    _vlQuestions=qs;
    const nt=vlCleanNote(o.note);
    if(!_vlQuestions.length){
      setRecStatus('⚠️ 没认出题目文字'+(nt?'：'+esc(nt):'')+'　（换张更清楚的图，或手动填题干）',true);
      return;
    }
    if(_vlQuestions.length===1&&_vlQuestions[0].content){
      _vlPick=new Set([0]);renderRecPick();            // 只有一题：自动选中并直接生成分析（不再填表）
      setRecStatus(`✅ 识别到 <b>1</b> 道题（${esc(o.source||'出处未识别')}）—— 正在生成 答案/错因/考点/五维…`);
      aiAnalyzePicked();
    }else{
      setRecStatus(`✅ 识别到 <b>${_vlQuestions.length}</b> 道题（${esc(o.source||'出处未识别')}）—— <b>点选要录入的题</b>（可多选，再点一次取消），然后点「AI 一键分析这 N 题」${nt?'（'+esc(nt)+'）':''}`);
      renderRecPick();
    }
  }catch(e){
    setRecStatus('❌ 识别失败：'+esc(e.message)+'　（检查网络 / 视觉 Key / 模型名）',true);
  }finally{if(btn){btn.disabled=false;btn.style.opacity=1;}}
}
// 考点词表：从现有错题汇总高频标签，让 AI 选词与既有标签保持同一套
function aiVocab(){
  const d=loadData(),c={};
  (d.questions||[]).forEach(q=>String(q.tags||'').replace(/，/g,',').split(',').forEach(t=>{t=t.trim();if(t)c[t]=(c[t]||0)+1;}));
  const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,45).map(x=>x[0]);
  const base=['二次根式','勾股定理','全等三角形','等腰三角形','轴对称','一次函数','动点问题','分类讨论','绝对值化简','分母有理化','整体代换','英语词汇','拼写','时态','不定代词','机械运动','速度计算','运动学','相对运动','临界问题','质量与密度','光学','透镜','辅助线','几何证明'];
  return [...new Set([...arr,...base])].slice(0,60).join('、');
}

2) 凡是计算结果，先自己验算一遍再写进答案。
3) 只输出 JSON（不要 markdown 代码块、不要解释），字段固定：
{"correct_answer":"正确答案，含关键数值；多问用(1)(2)(3)分行",

风格：五维用 ①②③ 编号 + 【第X步：】分段；用 √ ² △ ∠ 等符号；中文；不写客套话。tags 优先从给定考点词表里选，最多5个。`;

async function aiChat(messages,cfg,maxTokens){
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),200000);
  try{
    const r=await fetch(String(cfg.base).replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({model:cfg.model,messages,temperature:0.3,max_tokens:maxTokens||8000,response_format:{type:'json_object'}})
    });
    if(!r.ok){let msg='';try{msg=(await r.json()).error.message||'';}catch(e){}throw new Error('HTTP '+r.status+(msg?'：'+msg:''));}
    return await r.json();
  } finally{clearTimeout(tm);}
}
function aiParse(j){
  const raw=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  try{return JSON.parse(raw);}catch(e){}
  const m=raw.match(/\{[\s\S]*\}/);        // 兜底：抠出第一个 JSON 块
  if(m){try{return JSON.parse(m[0]);}catch(e){}}
  throw new Error('模型没返回 JSON（'+(j.choices&&j.choices[0]&&j.choices[0].finish_reason||'?')+'）');
}

// 把 AI 结果回填到表单（p='af' 录入表单 / p='ed' 编辑表单）
function aiApply(o,p){
  const set=(id,val)=>{const el=document.getElementById(id);if(el&&val!=null&&val!=='')el.value=val;};
  const sel=(id,val)=>{const el=document.getElementById(id);if(!el||val==null)return;
    const opt=[...el.options].find(x=>x.value===String(val)||x.textContent.trim()===String(val).trim());
    if(opt)el.selectedIndex=opt.index;
    else if(el.tagName==='SELECT'){const op=document.createElement('option');op.value=op.textContent=String(val);el.appendChild(op);el.value=op.value;}};
  if(o.correct_answer)set(p+'_correct',String(o.correct_answer));
  if(o.error_reason)sel(p+'_reason',String(o.error_reason));
  if(o.tags)set(p+'_tags',Array.isArray(o.tags)?o.tags.join(','):String(o.tags));
  if(o.difficulty)sel(p==='af'?'af_difficulty':'ed_diff',o.difficulty);
  const a=o.ana5||{};
  ANA5_DIMS.forEach(dm=>{const v=a[dm.k];if(v)set(p+'_ana5_'+dm.k,String(v).trim());});
  // 同步进表单状态对象（保存时读的是它）
  if(p==='af'){
    if(o.correct_answer)addForm.correct_answer=String(o.correct_answer);
    if(o.error_reason)addForm.error_reason=String(o.error_reason);
    if(o.tags)addForm.tags=Array.isArray(o.tags)?o.tags.join(','):String(o.tags);
    if(o.difficulty)addForm.difficulty=+o.difficulty;
    addForm.ana5=Object.assign({},addForm.ana5||{},Object.fromEntries(ANA5_DIMS.map(dm=>[dm.k,String((a[dm.k]||'').trim())])));
    addForm.ana5_ai=true;
  }else{
    window._aiFilledEdit=true;      // 编辑表单：保存时给题目打 AI 待核对标记
  }
}

  }finally{if(btn){btn.disabled=false;btn.style.opacity=1;}}
}

function vlConfReset(){
  try{const k=JSON.parse(localStorage.getItem(VL_LS)||'{}')||{};
      localStorage.setItem(VL_LS,JSON.stringify({key:k.key||''}));}catch(e){}
  _vlAutoFixed=false;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v;};
  set('vl_base',VL_DEFAULT.base);set('vl_model',VL_DEFAULT.model);
  document.getElementById('vl_test_result').innerHTML='已恢复默认：<code>'+VL_DEFAULT.model+'</code> @ '+VL_DEFAULT.base+'（Key 不变）';
  toast('已恢复默认视觉模型','success');

async function vlConfTest(){
  const el=document.getElementById('vl_test_result');
  const g=id=>(document.getElementById(id)||{}).value||'';
  const cfg={base:g('vl_base').trim(),model:g('vl_model').trim(),key:g('vl_key').trim()};
  if(!cfg.key){ const v=vlCfg(); cfg.key=v.key; cfg.base=cfg.base||v.base; cfg.model=cfg.model||v.model; }
  if(!cfg.key){el.textContent='⚠️ 还没有 Key';return;}
  if(!_vlModelOk(cfg.base,cfg.model)){
    el.innerHTML='❌ DeepSeek 没有这个模型名：<code>'+cfg.model+'</code><br>'+
      '👉 DeepSeek 官方模型只有 <code>deepseek-flash</code>（能看图，推荐）和 <code>deepseek-v4-pro</code>（不能看图）。<br>'+
      '点「恢复默认」即可。';
    return;
  }
  el.textContent='⏳ 正在测试视觉接口（约 5-20 秒）…';
  try{
    const j=await aiChatRaw([{role:'user',content:[{type:'image_url',image_url:{url:VL_PROBE_PNG}},{type:'text',text:'看这张图，只回复JSON {"ok":true}'}]}],cfg,800,false);
    const c=((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'').trim();
    if(!c || /无法查看图片|Unsupported Image|cannot see|看不到/i.test(c)){
      el.innerHTML='⚠️ 接口通了，但<b>这个模型看不到图片</b>（回复：'+(c||'空')+'）。<br>'+
        '👉 视觉请用 <code>deepseek-flash</code>，或硅基流动 <code>Qwen/Qwen3-VL-30B-A3B-Instruct</code>。';
      return;
    }
    el.textContent='✅ 视觉接口可用：'+cfg.model+'（'+(j.usage?j.usage.total_tokens+' tokens':'响应正常')+'）';
  }catch(e){
    const m=String(e.message||'');
    let hint='';
    if(/400/.test(m)&&/model name/i.test(m)) hint='。模型名不存在 → 用 deepseek-flash，或点「恢复默认」';
    else if(/404/.test(m)) hint='。地址或模型名不对 → 检查地址是否为 https://api.deepseek.com/v1，或点「恢复默认」';
    else if(/401|403/.test(m)) hint='。这个 Key 无效或没有权限';
    else if(/400/.test(m)) hint='。接口拒收该请求，多为模型名不对或模型不支持图片';
    else if(/fetch|Network|cross-origin|CORS/i.test(m)) hint='。网络不通或被跨域拦截（手机 App 版不受此影响）';
    el.textContent='❌ 失败：'+m+hint;
  }
}

function render(page,data){
  const app=document.getElementById('app');
  if(page==='dashboard') app.innerHTML=renderDashboard();
  else if(page==='add') app.innerHTML=renderAdd();
  else if(page==='list') app.innerHTML=renderList();
  else if(page==='detail') app.innerHTML=renderDetail(data);
  else if(page==='review') app.innerHTML=renderReview();
  else if(page==='training') app.innerHTML=renderTraining(data);
  else if(page==='print-page') app.innerHTML=renderPrint();
  else if(page==='analysis') app.innerHTML=renderAnalysis();
  else if(page==='points') app.innerHTML=renderPoints();
  else if(page==='aiconf') app.innerHTML=renderAiConf();
}

// ===================== FILE UPLOAD HELPERS =====================
function handleFile(input, field) {
  const file = input.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type||'')) { toast('请选择图片文件','error'); input.value=''; return; }
  if (file.size > 12 * 1024 * 1024) { toast('图片太大（超过12MB），换一张试试','error'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    // 【老板 2026-10-02】真·自动缩放：最长边压到 1600px / JPEG 0.85，手机拍照原图也能进
    shrinkImage(e.target.result, function(dataUrl){
      addForm[field] = dataUrl;
      const preview = document.getElementById(field === 'image_path' ? 'af_image_preview' : 'af_answer_image_preview');
      if (preview) {
        preview.style.display = 'block';
        preview.innerHTML = `<img src="${dataUrl}" class="img-shot">
          <span class="img-del" onclick="clearFile('${field}','${input.id}','${preview.id}')">✕ 删除图片</span>`;
      }
      // 老板 2026-10-02：题目图片一选好就自动识别 + 分析（答案图片不自动跑；无识别入口时也不跑）
      if (field === 'image_path' && document.getElementById('ai_recog_status')) aiRecognizeImage();
    });
  };
  reader.readAsDataURL(file);
}
function shrinkImage(src, cb){
  const MAX=1600, Q=0.85;
  try{
    const img=new Image();
    img.onload=function(){
      try{
        const w0=img.width,h0=img.height;
        const scale=Math.min(1, MAX/Math.max(w0,h0));
        if(scale>=1 && src.length<=700*1024){ cb(src); return; }   // 本来就小 → 不动
        const w=Math.max(1,Math.round(w0*scale)), h=Math.max(1,Math.round(h0*scale));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);              // 透明底铺白，转 JPEG 不发黑
        ctx.drawImage(img,0,0,w,h);
        const out=c.toDataURL('image/jpeg',Q);
        cb(out && out.length<src.length ? out : src);
      }catch(err){ cb(src); }
    };
    img.onerror=function(){ cb(src); };
    img.src=src;
  }catch(e){ cb(src); }
}
function clearFile(field, inputId, previewId) {
  addForm[field] = '';
  const inp = document.getElementById(inputId);
  if (inp) inp.value = '';
  const pre = document.getElementById(previewId);
  if (pre) pre.style.display = 'none';
}

function reviewResult(r){
  const q=reviewList[reviewIdx];

    ['fc_known','fc_target','fc_plan','fc_check'].forEach(id=>{const el=document.getElementById(id);fcVals[id]=el?(el.value||'').trim():'';});
    if(!fcVals.fc_known||!fcVals.fc_target||!fcVals.fc_plan||!fcVals.fc_check){

      toast('⚠️ 流程未完成：请填完 已知/求/步骤/检验 四项，才算订正完成！','error');
      return;

    qq.flow={known:fcVals.fc_known,target:fcVals.fc_target,plan:fcVals.fc_plan,check:fcVals.fc_check};
    if(r===2)qq.mastery=Math.min(qq.mastery+1,REVIEW_INTERVALS.length);

    qq.next_review=calcNextReview(qq.mastery);

    saveData(d);

// ── 三层练变式：换数字（修复版，老板 2026-10-02）──
// 旧实现用 v.replace(n,新数) 只替换「第一个匹配」，数字换错位置，
// 把试卷来源标注里的年份/讲次也改了（2026秋 → 1799秋）。现在：
//   ① 保护来源标注（含 秋/春/第N讲/小测/班/卷… 的括号内容）② 保护题号前缀 ③ 正文数字按出现顺序逐个换
const LAYER_GEN_VER=2;
function _isSrcLabel(m){
  return /[秋春夏冬]|[0-9]+[讲次]|班|小测|测试|月考|期中|期末|卷|年级|学期|真题|模拟|作业|练习/.test(m);
}
function varyNumbers(content){
  const raw=String(content==null?'':content);
  for(let tryN=0;tryN<4;tryN++){
    const r=_varyOnce(raw);
    if(r!==raw)return r;
  }
  return raw;
}
function _varyOnce(s){
  // 题号前缀原样保留（「1.」「第2题」）
  const pre=s.match(/^ {0,4}第?[0-9]+ *[.、)）]/);
  const head=pre?pre[0]:'';
  const rest=head?s.slice(head.length):s;
  const body=t=>t.replace(/[0-9]+([.][0-9]+)?/g,(m,dec,off,str)=>{
    let v=newNum(m);
    // 数字后面紧跟字母 = 系数，不能写成「1m」「0m」
    if(/[a-zA-Z]/.test(str.charAt(off+m.length))&&(v==='1'||v==='0'))v='2';
    return v;
  });
  let out='',last=0,m;
  const P=/[（(][^）)]{3,60}[）)]/g;
  while((m=P.exec(rest))){
    out+=body(rest.slice(last,m.index));
    out+=_isSrcLabel(m[0])?m[0]:body(m[0]);   // 来源标注整块跳过（年份/讲次不动）
    last=m.index+m[0].length;
  }
  out+=body(rest.slice(last));
  return head+out;
}
function newNum(n){
  const f=parseFloat(n);
  if(!isFinite(f)||f===0)return n;
  if(n.indexOf('.')>=0){
    const dec=n.split('.')[1].length;
    const d=Math.max(1,Math.round(Math.abs(f)*0.25));
    return (f+(Math.random()<0.5?-d:d)).toFixed(dec);
  }
  const i=Math.floor(f);
  const d=Math.max(1,Math.round(i*0.35));
  let v=i+(Math.random()<0.5?-d:d);
  if(i>0&&v<1)v=1;                       // 正数不变成 0，避免出现分母为 0
  if(i>0&&v===i)v=i+1;                   // 保证真的变了
  return String(Math.abs(v));
}

function getOrGenLayers(q){
  const d=loadData();
  const fq=d.questions.find(x=>x.id===q.id);
  // 生成器版本变了 → 旧缓存作废重算（已保存的作答 _layers.answers 不动）
  if(fq&&fq._layers&&fq._layers.data&&fq._layers.ver===LAYER_GEN_VER)return fq._layers.data;
  const layers=genLayers(q);
  if(fq){if(!fq._layers)fq._layers={};fq._layers.data=layers;fq._layers.ver=LAYER_GEN_VER;saveData(d);}
  return layers;
}

function genLayers(q){
  const content=q.content||'';
  const answer=q.correct_answer||'';
  const d0=loadData();
  const subjName=((d0.subjects||[]).find(s=>s.id===q.subject_id)||{}).name||'';
  const isMath=/\d+/.test(content);
  const hasChoice=/[A-D]\)/.test(content)||/A\./.test(content);
  
  // Layer 1: 原题重现
  const l1={
    title:'基础同构 · 原题重做',
    content:`<strong>原题：</strong><span class="prewrap">${content}</span><br><strong style="color:var(--success)">✅ 原题正确答案：</strong><span class="prewrap">${answer||'（见下方）'}</span>`,
    placeholder:'请重新解答这道题，检验是否真正掌握…',
    answer:`原题正确答案：${answer||'（未记录）'}<br>重新做一遍，看是否和正确答案一致。`,
    savedAnswer:''
  };

  // Layer 2: 生成变式
  let l2Content,l2Ans,l2Place;
  if(subjName==='英语'||subjName==='语文'){
    // 语言类 → 同考点换素材（不能换数字）
    const w=subjName==='英语'?'句子':'语段';
    l2Content=`<strong>变式题（同考点换个语境）：</strong>把这道题考查的同一个知识点，换一个${w}再练一遍。<br><br>`+
      `<div style="background:var(--card-bg);padding:.6rem .8rem;border-radius:8px;border-left:3px solid #e67e22">`+
      `💡 提示：${subjName==='英语'?'换个主语/时间/情境，让同一个词或语法点出现在新句子里':'换个说法或换一段文字，同一个考点换一种表达方式'}，<br>`+
      `写出来后再对照原题，看这个知识点是不是真的会用了。</div>`;
    l2Ans=`换语境训练的关键：<br>1. 先写清原题考的是哪个知识点<br>2. 自己造一个新的${w}，确保用上同一个知识点<br>3. 对照原题答案，检查用法是否一致`;
    l2Place=`写出你编的新${w}，并标明用到的知识点…`;
  }else if(subjName==='物理'){
    // 物理 → 换场景
    l2Content=`<strong>变式题（换场景）：</strong>保持考查的知识点和公式不变，换一个物体或生活场景再算一遍。`;
    l2Ans=`换场景训练的关键：<br>1. 明确原题用的公式/规律<br>2. 换物体、换数值或换情境，重算一遍<br>3. 对比原题，看结论是否合理`;
    l2Place='换一个场景改编，写出新题和数据，再解一遍…';
  }else if(isMath&&!/[A-D]\)/.test(content)){
    // 数学计算题 → 换数字（修复：保护来源标注与题号，正文数字按序替换）
    const v=varyNumbers(content);
    if(v&&v!==content){
      l2Content=`<strong>变式题（换数）：</strong>${v}`;
      l2Ans=`题目变了数字，但解题方法相同。按照原题思路，代入新数据重新计算。`;
      l2Place='按照原题解题方法，代入新的数据计算…';
    }else{
      l2Content=`<strong>变式题：</strong>改变题目中的一个条件，自己编一道类似的题并解答。`;
      l2Ans=`变式练习的关键是找出题目的核心条件，改变其中一个，看解题思路是否变化。`;
      l2Place='尝试改变条件，题目会怎么变？写出变式题和解答…';
    }
  }else if(hasChoice){
    // 选择题 → 改选项/改情景
    const opts=content.match(/[A-D][.）][^A-D]*/g);
    if(opts&&opts.length>=2){
      l2Content=`<strong>变式题（改选项/改情景）：</strong><br>把题目中的核心条件改一下，看看正确答案变不变？<br><br>`+
        `<div style="background:var(--card-bg);padding:.6rem .8rem;border-radius:8px;border-left:3px solid #e67e22">`+
        `💡 提示：想一下如果改变题目中的某个关键词，<br>比如"音调"改成"响度"、"声源处"改成"传播过程中"，<br>答案会怎么变？</div>`;
      l2Ans=`变式练习答案取决于具体改动。关键思路：<br>1. 找出题目考查的核心知识点<br>2. 改变条件后重新分析哪个选项正确<br>3. 验证原答案是否仍然成立`;
      l2Place='写出你改编的题目，以及改编后的正确答案…';
    }else{
      l2Content=`<strong>变式题：</strong>自己出一道与本题考查相同知识点的选择题，并给出答案。`;
      l2Ans=`编题思路：确定考查的知识点 → 设计题干 → 设计4个选项（1正确3干扰）<br>确保干扰项来自常见的概念混淆。`;
      l2Place='请编一道相似的选择题并给出答案…';
    }
  }else{
    // 其他题型
    l2Content=`<strong>变式题：</strong>改变题目的某个条件或数据，重新解答。看看条件变了以后，答案有什么不同？`;
    l2Ans=`变式练习的关键：<br>1. 找出题目的可变条件<br>2. 改变一个条件后重新分析<br>3. 对比原题答案，理解条件变化对结果的影响`;
    l2Place='写出你改编后的题目和解答过程…';
  }
  const l2={
    title:'条件变化 · 灵活应变',
    content:l2Content,
    placeholder:l2Place||'思考条件变化后的新解法…',
    answer:l2Ans||'条件变化训练的是你灵活运用知识的能力。尝试改变题目条件，看解题思路的变化。',
    savedAnswer:''
  };

  // Layer 3: 反向综合
  let l3Content,l3Ans,l3Place;
  if(answer){
    l3Content=`<strong>反向综合题：</strong>根据答案<strong>"${answer.length>50?answer.substring(0,50).replace(/\n/g,' ')+'…':answer.replace(/\n/g,' ')}"</strong>反推，<br>`+
      `你能编出一道能得到这个答案的题目吗？<br><br>`+
      `<div style="background:var(--card-bg);padding:.6rem .8rem;border-radius:8px;border-left:3px solid #e74c3c">`+
      `💡 提示：从答案出发，想想什么样的题目条件或场景能得出这个答案。`+
      `这是从"解题"到"出题"的思维转换，最能检验是否真正理解。</div>`;
    l3Ans=`反向综合示范：<br>原题问的是"${content.length>80?content.substring(0,80).replace(/\n/g,' ')+'…':content.replace(/\n/g,' ')}"<br>从答案"${answer.length>60?answer.substring(0,60).replace(/\n/g,' ')+'…':answer.replace(/\n/g,' ')}"反推，<br>可以编一道：保持核心知识点不变，换一个生活场景来出题。`;
    l3Place='从答案反推，编一道新题…';
  }else{
    l3Content=`<strong>反向综合题：</strong>请自己出一道与本题知识点相同的题目，<br>`+
      `并解释你的出题思路。<br><br>`+
      `<div style="background:var(--card-bg);padding:.6rem .8rem;border-radius:8px;border-left:3px solid #e74c3c">`+
      `💡 从"做题者"变成"出题者"，把这道题的知识点用你自己的方式再表达一次。</div>`;
    l3Ans=`出题思路：<br>1. 确定核心知识点<br>2. 设计一个应用场景<br>3. 设置条件和问题<br>4. 制定评分标准`;
    l3Place='编一道新题并写出出题思路…';
  }
  const l3={
    title:'反向综合 · 思维提升',
    content:l3Content,
    placeholder:l3Place,
    answer:l3Ans,
    savedAnswer:''
  };
  return[l1,l2,l3];
}

function nextTrainingQ(){

function stripHtml(h){return String(h==null?'':h).replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li)>/gi,'\n').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/\n{3,}/g,'\n\n').trim();}

// 单题打印内容（按勾选项渲染）
function printCard(q,i){
  const d=loadData();
  const subj=d.subjects.find(s=>s.id===q.subject_id);
  const a=ana5(q);
  let h=`<div class="print-q"><div class="pq-num">${i+1}. ${subj?subj.name:'?'} · ${gradeText(q.grade)} · #${q.id}</div>`;
  if(printOpts.stem){
    h+=`<div class="pq-block"><div class="pq-label">题目</div><div class="prewrap">${esc5(q.content)}</div>`;
    if(q.image_path)h+=`<div style="margin-top:.4rem"><img src="${q.image_path}" style="max-width:100%;max-height:220px;border-radius:4px"></div>`;
    h+=`</div>`;
  }
  if(printOpts.wrong&&q.my_answer)h+=`<div class="pq-block"><div class="pq-label" style="color:var(--danger)">❌ 我的错误答案</div><div class="prewrap">${esc5(q.my_answer)}</div></div>`;
  if(printOpts.correct&&q.correct_answer)h+=`<div class="pq-block"><div class="pq-label" style="color:var(--success)">✅ 正确答案</div><div class="prewrap">${esc5(q.correct_answer)}</div></div>`;
  if(printOpts.reason)h+=`<div class="pq-block"><div class="pq-label">错因分析</div><div>${esc5(q.error_reason||'—')}${q.tags?' &nbsp;🏷️ '+esc5(q.tags):''}</div></div>`;
  if(printOpts.ana5){
    h+=`<div class="pq-block"><div class="pq-label">🧩 五维分析</div>`+ANA5_DIMS.map(dm=>{
      const v=String(a[dm.k]||'').trim();
      return `<div style="margin-top:.2rem;font-size:.92rem"><strong>${dm.tag}</strong>：<span class="prewrap">${v?esc5(v):'未填写'}</span></div>`;
    }).join('')+`</div>`;
  }
  if(printOpts.train){
    let layers=[];
    try{layers=getOrGenLayers(q)||[];}catch(e){layers=[];}
    if(layers.length){
      h+=`<div class="pq-block"><div class="pq-label">📚 三层练的题</div>`+layers.map((L,li)=>{
        // 第1层就是原题（不要它自带的答案），第2/3层取生成的变式题干
        const t=li===0?String(q.content||''):stripHtml(L.content);
        return `<div style="margin-top:.35rem"><strong>${esc5(stripHtml(L.title))}</strong><div class="prewrap" style="font-size:.92rem">${esc5(t)}</div></div>`;
      }).join('')+`</div>`;
    }else{
      h+=`<div class="pq-block"><div class="pq-label">📚 三层练的题</div><div style="color:var(--text-light)">（该题暂无三层练）</div></div>`;
    }
  }
  return h+`</div>`;
}

// ===================== ANALYSIS =====================
let analysisChart=null;

function renderAnalysis(){
  const d=loadData();
  const qs=d.questions;
  if(!qs.length)return'<div class="empty-state"><i class="fas fa-chart-pie"></i><h5>还没有数据</h5><p>录入错题后查看分析报告</p></div>';
  
  // By error reason
  const reasonCount={};ERROR_REASONS.forEach(r=>reasonCount[r]=0);
  qs.forEach(q=>{if(reasonCount[q.error_reason]!==undefined)reasonCount[q.error_reason]++;});
  
  // By subject
  const subjCount={},subjMastered={};d.subjects.forEach(s=>{subjCount[s.id]=0;subjMastered[s.id]=0;});
  qs.forEach(q=>{if(subjCount[q.subject_id]!==undefined){subjCount[q.subject_id]++;if(q.mastery>=5)subjMastered[q.subject_id]++;}});
  
  // By chapter
  const chapWeak={};
  d.chapters.forEach(c=>chapWeak[c.id]=0);
  qs.forEach(q=>{if(q.chapter_id&&chapWeak[q.chapter_id]!==undefined&&q.mastery===0)chapWeak[q.chapter_id]++;});
  const weakChaps=Object.entries(chapWeak).filter(([_,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // By grade（年级维度）
  const gradeAgg={};
  qs.forEach(q=>{const k=(q.grade===undefined||q.grade===null||q.grade==='')?'none':String(q.grade);
    if(!gradeAgg[k])gradeAgg[k]={total:0,mastered:0};gradeAgg[k].total++;if(q.mastery>=5)gradeAgg[k].mastered++;});
  const gradeRows=[...GRADES.map(String),'none'].filter(k=>gradeAgg[k]);

  setTimeout(()=>{
    const canvas=document.getElementById('chartReason');
    if(!canvas)return;
    if(analysisChart)analysisChart.destroy();
    const ctx=canvas.getContext('2d');
    const labels=Object.keys(reasonCount).filter(k=>reasonCount[k]>0);
    const data=labels.map(k=>reasonCount[k]);
    const colors=['#f56565','#ecc94b','#4299e1','#9b59b6','#e67e22','#a0aec0'];
    analysisChart=new Chart(ctx,{type:'doughnut',data:{labels:labels.map(l=>l+`(${reasonCount[l]})`),datasets:[{data,backgroundColor:colors.slice(0,labels.length),borderWidth:0}]},
      options:{responsive:true,cutout:'60%',plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}});
  },50);

  return`<div class="chart-grid">
    <div class="chart-box"><h4>错因分布</h4><canvas id="chartReason" style="max-height:250px"></canvas></div>
    <div class="chart-box"><h4>科目统计</h4>
      <table class="analysis-table"><thead><tr><th>科目</th><th>错题</th><th>已掌握</th><th>掌握率</th></tr></thead>
      <tbody>${d.subjects.map(s=>{
        const total=subjCount[s.id]||0;
        const mastered=subjMastered[s.id]||0;
        return`<tr><td>${s.name}</td><td>${total}</td><td>${mastered}</td><td>${total?Math.round(mastered/total*100)+'%':'-'}</td></tr>`;
      }).join('')}</tbody></table></div>
  </div>
  <div class="card" style="margin-top:1rem">
    <div class="card-title"><i class="fas fa-graduation-cap" style="color:var(--primary)"></i> 年级维度统计</div>
    <table class="analysis-table"><thead><tr><th>年级</th><th>错题</th><th>已掌握</th><th>掌握率</th></tr></thead>
      <tbody>${gradeRows.map(k=>{const a=gradeAgg[k];
        return`<tr><td>${k==='none'?'未标注年级':k+'年级'}</td><td>${a.total}</td><td>${a.mastered}</td><td>${a.total?Math.round(a.mastered/a.total*100)+'%':'-'}</td></tr>`;
      }).join('')}</tbody></table>
    <p style="font-size:.8rem;color:var(--text-light);margin-top:.5rem">💡 跨年级错题可分开集中突破；点「错题本」用年级筛选查看</p>
  </div>
  <div class="card" style="margin-top:1rem">
    <div class="card-title"><i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i> 薄弱章节 TOP</div>
    ${weakChaps.length?`<table class="analysis-table"><thead><tr><th>章节</th><th>未掌握题数</th></tr></thead>
      <tbody>${weakChaps.map(([cid,cnt])=>{
        const chap=d.chapters.find(c=>c.id===parseInt(cid));
        const subj=chap?d.subjects.find(s=>s.id===chap.subject_id):null;
        return`<tr><td>${subj?subj.name+' · ':''}${chap?chap.name:'?'}</td><td><span style="color:var(--danger);font-weight:600">${cnt}</span></td></tr>`;
      }).join('')}</tbody></table>`:'<p style="color:var(--text-light)">暂无薄弱章节数据</p>'}
  </div>`;
}

let rvfOpen=false;
function rvfSave(){try{localStorage.setItem('wrong_bank_review_filter_test',JSON.stringify(RVF));}catch(e){}}
function rvfLoad(){try{const j=JSON.parse(localStorage.getItem('wrong_bank_review_filter_test')||'null');if(j&&typeof j==='object')RVF=Object.assign({subject:'all',grade:'all',term:'all',month:'all',week:'all'},j);}catch(e){}
  if(RVF.term==='up'||RVF.term==='lower')RVF.term='all';   // 旧版学期值（上学期/下学期）已弃用
  rvfOpen=rvfHas();   // 上次的筛选还在生效时自动展开，避免"怎么只有一部分题"
}
function rvfWeekStart(dt){const x=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;}
function rvfHalf(dt){const m=dt.getMonth()+1;return (m>=9||m<=1)?'up':(m<=7?'lo':'');}   // 8月='' 不计入
function rvfTermKey(q){const dt=rvfDate(q);if(!dt)return'';const h=rvfHalf(dt);if(!h)return'';return ((q.grade==null||q.grade==='')?'none':String(q.grade))+'-'+h;}
function rvfSchoolYear(dt){const m=dt.getMonth()+1,y=dt.getFullYear();if(m>=9)return String(y).slice(2)+'秋';if(m<=1)return String(y-1).slice(2)+'秋';return String(y).slice(2)+'春';}
function rvfMonthKey(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function rvfDate(q){return ptsParseDate(q.created_at);}
function rvfList(list,skip){
  list=list||(loadData().questions||[]);
  return list.filter(function(q){
    const dt=rvfDate(q);
    if(skip!=='subject'&&RVF.subject!=='all'&&String(q.subject_id)!==String(RVF.subject))return false;
    if(skip!=='grade'&&RVF.grade!=='all'&&String(q.grade==null?'none':q.grade)!==String(RVF.grade))return false;
    if(skip!=='term'&&RVF.term!=='all'&&rvfTermKey(q)!==RVF.term)return false;
    if(skip!=='month'&&RVF.month!=='all'&&(!dt||rvfMonthKey(dt)!==RVF.month))return false;
    if(skip!=='week'&&RVF.week!=='all'&&(!dt||rvfWeekStart(dt).getTime()!==Number(RVF.week)))return false;
    return true;
  });
}
function rvfApply(list){return rvfList(list,null);}
function rvfHas(){return Object.keys(RVF).some(k=>RVF[k]!=='all');}
function rvfCount(list,fn){return list.filter(fn).length;}
function rvfSubjectOpts(){
  const d=loadData(),base=rvfList(null,'subject'),m={};
  base.forEach(q=>{m[q.subject_id]=(m[q.subject_id]||0)+1;});
  return (d.subjects||[]).filter(s=>m[s.id]).map(s=>({v:s.id,label:s.name,n:m[s.id]}));
}
function rvfGradeOpts(){
  const base=rvfList(null,'grade'),m={};
  base.forEach(q=>{const k=(q.grade==null?'none':q.grade);m[k]=(m[k]||0)+1;});
  return Object.keys(m).sort((a,b)=>(a==='none'?99:+a)-(b==='none'?99:+b))
    .map(k=>({v:k,label:(k==='none'?'未标注':k+'年级'),n:m[k]}));
}
function rvfTermOpts(){
  const base=rvfList(null,'term'),m={},yr={};
  base.forEach(function(q){
    const k=rvfTermKey(q);if(!k)return;
    m[k]=(m[k]||0)+1;
    const sy=rvfSchoolYear(rvfDate(q));
    if(!yr[k])yr[k]={};
    yr[k][sy]=1;
  });
  const keys=Object.keys(m).sort(function(a,b){
    const pa=a.split('-'),pb=b.split('-');
    const ga=(pa[0]==='none'?99:+pa[0]),gb=(pb[0]==='none'?99:+pb[0]);
    if(ga!==gb)return ga-gb;
    return pa[1]==='up'?-1:1;
  });
  const dup={};keys.forEach(k=>{if(Object.keys(yr[k]).length>1)dup[k]=1;});
  return keys.map(function(k){
    const p=k.split('-');
    const lab=(p[0]==='none'?'未标注年级':p[0]+'年级')+(p[1]==='up'?'上':'下');
    return {v:k,label:lab+(dup[k]?'（'+Object.keys(yr[k]).sort().join('/')+'）':''),n:m[k]};
  });
}
function rvfMonthOpts(){
  const base=rvfList(null,'month'),m={};
  base.forEach(q=>{const dt=rvfDate(q);if(dt){const k=rvfMonthKey(dt);m[k]=(m[k]||0)+1;}});
  return Object.keys(m).sort().reverse().map(k=>{
    const p=k.split('-');return {v:k,label:String(p[0]).slice(2)+'年'+Number(p[1])+'月',n:m[k]};
  });
}
function rvfWeekOpts(){
  const base=rvfList(null,'week'),m={};
  base.forEach(q=>{const dt=rvfDate(q);if(dt){const t=rvfWeekStart(dt).getTime();m[t]=(m[t]||0)+1;}});
  const now=rvfWeekStart(new Date()).getTime();
  return Object.keys(m).map(Number).sort((a,b)=>b-a).map(function(t){
    const s=new Date(t),e=new Date(t+6*86400000),diff=Math.round((now-t)/(7*86400000));
    const tag=diff===0?'本周':diff===1?'上周':diff+'周前';
    return {v:t,label:tag+'('+(s.getMonth()+1)+'/'+s.getDate()+'~'+(e.getMonth()+1)+'/'+e.getDate()+')',n:m[t]};
  });
}
function rvfChipRow(label,key,opts){
  if(!opts.length)return'';
  const all={v:'all',label:'全部',n:rvfList(null,key).length};
  return '<div class="rvf-row"><span class="rvf-lab">'+label+'</span>'
    +[all].concat(opts).map(o=>'<button class="rvf-chip'+(String(RVF[key])===String(o.v)?' active':'')
      +'" onclick="rvfSet(\''+key+'\',\''+o.v+'\')">'+o.label+'<i>'+o.n+'</i></button>').join('')+'</div>';
}
function rvfNames(){
  const n=[];
  if(RVF.subject!=='all'){const s=(loadData().subjects||[]).filter(x=>String(x.id)===String(RVF.subject))[0];n.push(s?s.name:'科目'+RVF.subject);}
  if(RVF.grade!=='all')n.push(RVF.grade==='none'?'未标注年级':RVF.grade+'年级');
  if(RVF.term!=='all'){const o=rvfTermOpts().filter(x=>String(x.v)===String(RVF.term))[0];n.push(o?o.label.replace(/（.*$/,''):'学期');}
  if(RVF.month!=='all'){const p=RVF.month.split('-');n.push(String(p[0]).slice(2)+'年'+Number(p[1])+'月');}
  if(RVF.week!=='all'){const o=rvfWeekOpts().filter(x=>String(x.v)===String(RVF.week))[0];
    n.push(o?o.label.replace(/\(.*/,''):'指定周');}
  return n;
}
function rvfPanel(){
  const total=(loadData().questions||[]).length,hit=rvfList(null,null).length,nm=rvfNames();
  let h='<div class="rvf-box"><div class="rvf-head" onclick="rvfToggle()">'
    +'<span><i class="fas fa-filter"></i> 筛选：<b>'+(nm.length?nm.join(' · '):'全部')+'</b></span>'
    +'<span class="rvf-note" style="margin:0">命中 <b>'+hit+'</b> / '+total+' 题　'
    +(nm.length?'<a href="javascript:void(0)" onclick="event.stopPropagation();rvfClear()" class="rvf-clr">清空</a> ':'')
    +'<span>'+(rvfOpen?'收起 ▲':'展开 ▼')+'</span></span></div>';
  if(rvfOpen){
    h+=rvfChipRow('科目','subject',rvfSubjectOpts());
    h+=rvfChipRow('年级','grade',rvfGradeOpts());
    h+=rvfChipRow('学期','term',rvfTermOpts());
    h+=rvfChipRow('月份','month',rvfMonthOpts());
    h+=rvfChipRow('哪一周','week',rvfWeekOpts());
    h+='<div class="rvf-note">时间按错题的<b>录入日期</b>筛；学期＝年级+上/下（如 8年级上），上下半按录入日期定：9~1月=上、2~7月=下、8月不计入；'
      +(nm.length?'<a href="javascript:rvfClear()" style="color:var(--primary)">清空筛选</a>':'勾选即生效，再点一次取消。')+'</div>';
  }
  h+='</div>';
  return h;
}
function rvfSet(k,v){RVF[k]=(String(RVF[k])===String(v))?'all':v;rvfSave();rvfRedraw();}
function rvfToggle(){rvfOpen=!rvfOpen;rvfRedraw();}
function rvfClear(){RVF={subject:'all',grade:'all',term:'all',month:'all',week:'all'};rvfSave();rvfRedraw();}
function rvfRedraw(){
  if(currentPage==='points')document.getElementById('app').innerHTML=renderPoints();
  else if(currentPage==='review')document.getElementById('app').innerHTML=renderReview();
  else render(currentPage);
}
function reviewView(){return rvfPanel()+reviewCard();}

// ===================== 复习要点（AI错题本）=============================
// 四个板块＝四种复习节奏，各自的"汇总维度"不同（避免四块内容雷同）：
//   A 周复习   → 按错因（本周错在哪类）
//   B 月复习   → 按科目（各科薄弱在哪）
//   C 半期复习 → 按考点（章节化归并，抓高频考点）
//   D 期末复习 → 全量补漏（逐考点：关联错因 + 典型易错 + 全部题号）
// 内容 100% 由真实字段聚合：error_reason / tags / ana5.pitfall / ana5.points /
// mastery / review_count / created_at。不做猜测、不改写，每条结论都标来源题号可点开核对。
const POINTS_BLOCKS=[
  {key:'week', label:'A 周复习', days:7, axis:'error',   dim:'按错因',
   tip:'每周末 30 分钟：先纠错因，再重做本周错题'},
  {key:'month',label:'B 月复习', days:30, axis:'subject', dim:'按科目',
   tip:'每月末：按科目过一遍，定位各科薄弱环节'},
  {key:'half', label:'C 半期复习', days:90, axis:'point', dim:'按考点',
   tip:'期中考前一周：按考点归并，主攻高频考点'},
  {key:'final',label:'D 期末复习', days:0, axis:'full',   dim:'全量补漏',
   tip:'期末考前两周：逐考点补漏，把没复习过的清掉'}
];
let pointsBlock='week';
const PTS_SUBJ=['数学','物理','化学','语文','英语','历史','地理','生物','道法','政治'];

function ptsSpec(bk){const a=POINTS_BLOCKS.filter(b=>b.key===bk);return a.length?a[0]:POINTS_BLOCKS[0];}
function ptsParseDate(s){
  const m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(s||''));
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
function ptsSubjName(d,id){const s=(d.subjects||[]).filter(x=>x.id===id);return s.length?s[0].name:'未分科目';}
function ptsTags(q){return String(q.tags||'').split(',').map(x=>x.trim()).filter(x=>x&&PTS_SUBJ.indexOf(x)<0);}
function ptsErr(q){const k=String(q.error_reason||'').trim();return k||'未标注错因';}
function ptsErrShow(k){return (k==='其他'||k==='未标注错因')?k+'（原记录未细分）':k;}
function ptsTop(obj,n){return Object.keys(obj).sort((a,b)=>obj[b]-obj[a]).slice(0,n).map(k=>[k,obj[k]]);}
function ptsCount(list){const o={};list.forEach(x=>{o[x]=(o[x]||0)+1;});return o;}
function ptsQids(ids){return ids.slice(0,8).map(i=>`<span class="pts-q" onclick="navigate('detail',{qid:${i}})">#${i}</span>`).join('');}
function ptsPitfall(q){
  const p=String(((q.ana5||{}).pitfall)||'');if(!p)return'';
  const lines=p.split('\n').map(s=>s.trim()).filter(Boolean);let t='';
  for(let i=0;i<lines.length;i++){
    const m=/^(易错点|常见错法|错在哪|错误原因)[:：]\s*(.+)$/.exec(lines[i]);
    if(m){t=m[2];break;}
  }
  if(!t)t=(lines[0]||'').replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/,'');
  return t.replace(/^(易错点|常见错法|错在哪|错误原因)[:：]\s*/,'').replace(/^[0-9]+[.、]\s*/,'').replace(/[。；;]$/,'').trim();
}
function ptsPoints(q){return String(((q.ana5||{}).points)||'').split('\n').map(s=>s.trim()).filter(Boolean);}
function ptsWindow(bk){
  const d=loadData(),spec=ptsSpec(bk),all=d.questions||[];
  // 用户在筛选里指定了 学期/月份/哪一周 → 时间范围以用户选的为准，板块不再叠加自己的天数窗口
  const userTime=(RVF.week!=='all'||RVF.month!=='all'||RVF.term!=='all');
  let qs=all;
  if(spec.days>0&&!userTime){
    const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    qs=all.filter(q=>{const t=ptsParseDate(q.created_at);return t&&Math.round((t0-t)/86400000)<=spec.days;});
  }
  const f=rvfApply(qs);
  return {spec:spec,qs:f,allCount:all.length,d:d,thinner:f.length<all.length,filtered:f.length!==qs.length,userTime:userTime};
}
function ptsRangeText(w){
  const st=ptsCount(w.qs.map(q=>ptsSubjName(w.d,q.subject_id)));
  let s=w.spec.days>0?'近 '+w.spec.days+' 天':'全部';
  if(w.qs.length){
    const ds=w.qs.map(q=>String(q.created_at||'').slice(0,10)).filter(Boolean).sort();
    if(ds.length)s+='（'+ds[0]+' ~ '+ds[ds.length-1]+'）';
  }
  s+=' · <b>'+w.qs.length+'</b> 题';
  if(w.qs.length)s+=' · '+Object.keys(st).sort((a,b)=>st[b]-st[a]).map(k=>k+' '+st[k]).join(' / ');
  if(w.thinner)s+=' · <span class="pts-note">（共 '+w.allCount+' 题，其余不在本板块时间范围内）</span>';
  return s;
}

/* ① 学习上的弱点 —— 四种维度 */
function ptsWeaknessHtml(w){
  const qs=w.qs,d=w.d,ax=w.spec.axis;
  if(!qs.length)return'<div class="pts-empty">还没有错题。</div>';
  let h='';
  if(ax==='error'){
    const errs=ptsCount(qs.map(ptsErr));
    ptsTop(errs,4).forEach(function(pr){
      const k=pr[0],v=pr[1],inQ=qs.filter(q=>ptsErr(q)===k);
      const tags=ptsTop(ptsCount([].concat.apply([],inQ.map(ptsTags))),3).map(x=>x[0]);
      const sj=[];inQ.forEach(q=>{const n=ptsSubjName(d,q.subject_id);if(sj.indexOf(n)<0)sj.push(n);});
      h+=`<div class="pts-item"><b>${ptsErrShow(k)}</b><span class="pts-badge">${v} 题 · 占 ${Math.round(v/qs.length*100)}%</span><br>`
        +`<span class="pts-note">集中在：${sj.join('、')}${tags.length?'（'+tags.join('、')+'）':''}　来源：${ptsQids(inQ.map(q=>q.id))}</span></div>`;
    });
  }else if(ax==='subject'){
    const sj=[];qs.forEach(q=>{const n=ptsSubjName(d,q.subject_id);if(sj.indexOf(n)<0)sj.push(n);});
    sj.sort((a,b)=>qs.filter(q=>ptsSubjName(d,q.subject_id)===b).length-qs.filter(q=>ptsSubjName(d,q.subject_id)===a).length);
    sj.forEach(function(n){
      const inQ=qs.filter(q=>ptsSubjName(d,q.subject_id)===n);
      const errs=ptsTop(ptsCount(inQ.map(ptsErr)),3).map(x=>x[0]+'×'+x[1]).join('、');
      const tags=ptsTop(ptsCount([].concat.apply([],inQ.map(ptsTags))),4).map(x=>x[0]);
      h+=`<div class="pts-item"><b>${n}</b><span class="pts-badge">${inQ.length} 题 · 占 ${Math.round(inQ.length/qs.length*100)}%</span><br>`
        +`<span class="pts-note">主要错因：${errs}<br>涉及考点：${tags.join('、')||'（未打标签）'}<br>来源：${ptsQids(inQ.map(q=>q.id))}</span></div>`;
    });
  }else if(ax==='point'){
    const ks=ptsKeyData(qs,d).slice(0,5);
    ks.forEach(function(o){
      const inQ=qs.filter(q=>ptsTags(q).indexOf(o.name)>=0);
      const errs=ptsTop(ptsCount(inQ.map(ptsErr)),2).map(x=>ptsErrShow(x[0])+'×'+x[1]).join('、');
      h+=`<div class="pts-item"><b>${o.name}</b><span class="pts-badge">${o.n} 次错</span><br>`
        +`<span class="pts-note">错因：${errs}${o.pitfall?'<br>典型易错：'+o.pitfall:''}　来源：${ptsQids(o.ids)}</span></div>`;
    });
  }else{
    const errs=ptsCount(qs.map(ptsErr));
    ptsTop(errs,5).forEach(function(pr){
      const inQ=qs.filter(q=>ptsErr(q)===pr[0]);
      const tags=ptsTop(ptsCount([].concat.apply([],inQ.map(ptsTags))),4).map(x=>x[0]);
      h+=`<div class="pts-item"><b>${ptsErrShow(pr[0])}</b><span class="pts-badge">${pr[1]} 题 · 占 ${Math.round(pr[1]/qs.length*100)}%</span><br>`
        +`<span class="pts-note">涉及考点：${tags.join('、')||'（未打标签）'}　来源：${ptsQids(inQ.map(q=>q.id))}</span></div>`;
    });
  }
  const zero=qs.filter(q=>!(q.mastery>0)).length,noRev=qs.filter(q=>!(q.review_count>0)).length;
  h+=`<div class="pts-item"><b>掌握度</b>：`+(zero===qs.length&&noRev===qs.length
    ? `<b>${qs.length}</b> 题全部为 0 级（均未复习）`
    : `<b>${zero}</b> / ${qs.length} 题仍为 0 级<span class="pts-badge">${noRev} 题从未复习</span>`)+`</div>`;
  return h;
}

/* ② 易错点（五维「易错点」原文，不动一个字） */
function ptsPitfallData(qs){
  const map={};
  qs.forEach(function(q){
    const t=ptsPitfall(q);if(!t)return;
    const k=t.replace(/[\s，,。、；;：:（）()【】「」]/g,'').slice(0,14);
    if(!map[k])map[k]={text:t,ids:[],tags:ptsTags(q).slice(0,2)};
    map[k].ids.push(q.id);
  });
  const arr=Object.keys(map).map(k=>map[k]).sort((a,b)=>b.ids.length-a.ids.length);
  return {arr:arr,covered:qs.filter(q=>ptsPitfall(q)).length,total:qs.length};
}
function ptsPitfallHtml(w){
  const qs=w.qs,ax=w.spec.axis;
  if(!qs.length)return'<div class="pts-empty">还没有错题。</div>';
  const r=ptsPitfallData(qs);
  const noAna=qs.length-r.covered;
  if(!r.arr.length)return`<div class="pts-empty">这 ${r.total} 道题的「易错点」还没填写，可在错题详情里点「编辑」补上。</div>`;
  let h='';
  if(ax==='point'){
    const ks=ptsKeyData(qs,w.d);
    let shown=0;
    ks.forEach(function(o){
      if(shown>=6)return;
      const inQ=qs.filter(q=>ptsTags(q).indexOf(o.name)>=0);
      const pr=ptsPitfallData(inQ).arr.slice(0,2);
      if(!pr.length)return;shown++;
      h+=`<div class="pts-item"><b>${o.name}</b><br>`
        +pr.map(x=>`<span class="pts-note">· ${x.text}${x.ids.length>1?'（'+x.ids.length+' 题）':''}</span>`).join('<br>')
        +`<br><span class="pts-note">来源：${ptsQids(inQ.map(q=>q.id))}</span></div>`;
    });
  }else{
    const n=(ax==='full')?15:8;
    r.arr.slice(0,n).forEach(function(o){
      h+=`<div class="pts-item">${o.text}${o.ids.length>1?`<span class="pts-badge">${o.ids.length} 题</span>`:''}<br>`
        +`<span class="pts-note">来源：${ptsQids(o.ids)}${o.tags.length?'　考点：'+o.tags.join('、'):''}</span></div>`;
    });
    if(r.arr.length>n)h+=`<div class="pts-note" style="margin-top:.4rem">另有 ${r.arr.length-n} 条已按同类合并，未逐条展开。</div>`;
  }
  if(noAna)h+=`<div class="pts-note" style="margin-top:.4rem">另有 ${noAna} 题未填写五维分析，未纳入统计。</div>`;
  return h;
}

/* ③ 重点（考点标签按命中次数） */
function ptsKeyData(qs,d){
  const map={};
  qs.forEach(function(q){
    ptsTags(q).forEach(function(t){
      if(!map[t])map[t]={n:0,ids:[],subjects:[],pitfall:''};
      if(map[t].ids.indexOf(q.id)<0){
        map[t].n++;map[t].ids.push(q.id);
        const sn=d?ptsSubjName(d,q.subject_id):'';
        if(sn&&map[t].subjects.indexOf(sn)<0)map[t].subjects.push(sn);
      }
      if(!map[t].pitfall)map[t].pitfall=ptsPitfall(q);
    });
  });
  return Object.keys(map).sort((a,b)=>map[b].n-map[a].n).map(k=>{const o=map[k];o.name=k;return o;});
}
function ptsKeyHtml(w){
  const ks=ptsKeyData(w.qs,w.d);
  if(!w.qs.length)return'<div class="pts-empty">还没有错题。</div>';
  if(!ks.length)return'<div class="pts-empty">还没有带考点标签的错题，先给错题打上考点标签。</div>';
  const sum=ks.reduce((a,b)=>a+b.n,0);
  const n=(w.spec.axis==='full')?20:((w.spec.axis==='error')?6:10);
  const list=(w.spec.axis==='full'||w.spec.axis==='point')?ks:ks.slice(0,n);
  let h=`<div class="pts-item">考点清单${list.length<ks.length?'（前 '+list.length+' 个／共 '+ks.length+' 个）':'（共 '+ks.length+' 个）'}，按错题命中次数排序</div>`;
  list.forEach(function(o,i){
    h+=`<div class="pts-item">${i+1}. <b>${o.name}</b><span class="pts-badge">${o.n} 题</span><br>`
      +`<span class="pts-note">${o.pitfall?'典型易错：'+o.pitfall+'<br>':''}来源：${ptsQids(o.ids)}</span></div>`;
  });
  h+=`<div class="pts-note" style="margin-top:.4rem">共 ${ks.length} 个考点标签、${sum} 次命中（同一题多个考点会重复计入）。</div>`;
  return h;
}

/* ④ 应该补充学习的内容 */
function ptsTodoHtml(w){
  const qs=w.qs,d=w.d,ax=w.spec.axis;
  if(!qs.length)return'<div class="pts-empty">还没有错题。</div>';
  const ks=ptsKeyData(qs,d);
  if(!ks.length)return'<div class="pts-empty">还没有带考点标签的错题，先给错题打上考点标签。</div>';
  let h='';
  if(ax==='subject'){
    const sj=[];qs.forEach(q=>{const n=ptsSubjName(d,q.subject_id);if(sj.indexOf(n)<0)sj.push(n);});
    sj.forEach(function(n){
      const inQ=qs.filter(q=>ptsSubjName(d,q.subject_id)===n);
      const tk=ptsTop(ptsCount([].concat.apply([],inQ.map(ptsTags))),3);
      if(!tk.length)return;
      h+=`<div class="pts-item"><b>${n}</b><span class="pts-badge">优先补 ${tk.length} 个考点</span><br>`
        +`<span class="pts-note">`+tk.map(x=>`「${x[0]}」${x[1]} 题`).join('、')+`<br>做法：把该考点下这 ${inQ.length} 题重做一遍（错因已标在详情里）。</span></div>`;
    });
  }else{
    const n=(ax==='full')?12:(ax==='point'?8:5);
    ks.slice(0,n).forEach(function(o,i){
      const inQ=qs.filter(q=>ptsTags(q).indexOf(o.name)>=0);
      const errs=ptsTop(ptsCount(inQ.map(ptsErr)),2).map(x=>ptsErrShow(x[0])+'×'+x[1]).join('、');
      const rev=inQ.filter(q=>!(q.review_count>0)).length;
      h+=`<div class="pts-item"><b>${i+1}. ${o.name}</b><span class="pts-badge">${o.n} 题${rev?' · '+rev+' 题未复习':''}</span><br>`
        +`<span class="pts-note">错因：${errs}${o.pitfall?'<br>先解决：'+o.pitfall:''}<br>来源：${ptsQids(o.ids)}</span></div>`;
    });
  }
  if(ax==='error'){
    h+=`<div class="pts-note" style="margin-top:.4rem">排序依据：考点在错题里命中的次数（次数越多越该先补）。</div>`;
  }else if(ax==='full'){
    h+=`<div class="pts-note" style="margin-top:.4rem">全量清单：${ks.length} 个考点全部列出，按命中次数排序；标「未复习」的题请优先重做。</div>`;
  }else if(ax==='point'){
    h+=`<div class="pts-note" style="margin-top:.4rem">按考点归并：同一考点的错题一起处理，比重做单题更省时间。</div>`;
  }
  return h;
}

function renderPoints(){
  const w=ptsWindow(pointsBlock),sp=w.spec;
  const tabs=POINTS_BLOCKS.map(b=>
    `<button class="pts-tab${b.key===pointsBlock?' active':''}" onclick="pointsBlock='${b.key}';document.querySelector('#app').innerHTML=renderPoints()">${b.label}</button>`).join('');
  return rvfPanel()+`<div class="card">
    <div class="pts-title"><i class="fas fa-clipboard-check" style="color:var(--primary)"></i> 复习要点</div>
    <div class="pts-range" style="margin-bottom:.7rem">按复习节奏分四个板块，内容自动汇总自错题本里的题（错因 / 易错点 / 考点标签 / 掌握度），<b>每条都标来源题号，可点开核对</b>。「考点标签」＝录入时打的标签，不用打＝没标签先补。</div>

    <div class="pts-card c1"><h5>1️⃣ 学习上的弱点（${sp.dim}）</h5>${ptsWeaknessHtml(w)}</div>
    <div class="pts-card c2"><h5>2️⃣ 易错点${sp.axis==='point'?'（按考点归并）':''}</h5>${ptsPitfallHtml(w)}</div>
    <div class="pts-card c3"><h5>3️⃣ 重点（高频考点${sp.axis==='full'?'全量':' Top'}）</h5>${ptsKeyHtml(w)}</div>
    <div class="pts-card c4"><h5>4️⃣ 应该补充学习的内容</h5>${ptsTodoHtml(w)}</div>
  </div>`;
}

};

  // 每个候选地址的超时：内网(http)试得快一点，公网(https)给足时间
  function timeoutFor(base){return base.indexOf('https:')===0?12000:3000}
  // 依次尝试所有候选地址：在外网时内网地址连不上，必须自动切到公网隧道
  // （老板 2026-10-01：外网登录不了 —— 原来只试第一个地址，内网连不上就直接失败）
  function request(path,body,token){
    var list=candidates();
    if(!list.length)return Promise.reject(new Error('no-endpoint'));
    if(api&&list.indexOf(api)>=0)list=[api].concat(list.filter(function(x){return x!==api}));
    var i=0;
    function tryNext(){
      if(i>=list.length)return Promise.reject(new Error('all-endpoints-failed'));
      var base=list[i++];
      // 静默依次尝试，不给用户看「正在切换线路」这类过程提示
      var h={};if(body)h['Content-Type']='application/json';if(token)h['Authorization']='Bearer '+token;
      var opts={method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined};
      var ctl=null,to=null;
      try{
        if(window.AbortController){ctl=new AbortController();opts.signal=ctl.signal;to=setTimeout(function(){try{ctl.abort()}catch(e){}},timeoutFor(base))}
      }catch(e){}
      return fetch(base+path,opts).then(function(r){
        if(to)clearTimeout(to);
        api=base;
        return r.text().then(function(t){
          var j={};try{j=JSON.parse(t)}catch(e){}
          return {status:r.status,json:j,base:base};
        });
      },function(err){
        if(to)clearTimeout(to);
        return tryNext();
      });
    }
    return tryNext();
  }
