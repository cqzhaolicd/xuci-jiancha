<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">

<link href="assets/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">

<style>
:root{--primary:#667eea;--secondary:#764ba2;--success:#48bb78;--warning:#ecc94b;--danger:#f56565;--info:#4299e1;--bg:#f0f2f5;--card-bg:#fff;--text:#1a202c;--text-light:#718096;--border:#e2e8f0;--radius:16px;--radius-sm:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
/* Navbar */
.navbar{background:linear-gradient(135deg,var(--primary),var(--secondary));padding:.7rem 0;position:sticky;top:0;z-index:1000;box-shadow:0 2px 20px rgba(102,126,234,.3)}
.navbar .container{max-width:1100px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between}
.navbar-brand{color:#fff;text-decoration:none;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.navbar-nav{display:flex;gap:.2rem;flex-wrap:wrap}
.navbar-nav a{color:rgba(255,255,255,.85);text-decoration:none;padding:.35rem .6rem;border-radius:8px;font-size:.82rem;transition:all .2s;display:flex;align-items:center;gap:.3rem;cursor:pointer}
.navbar-nav a:hover,.navbar-nav a.active{background:rgba(255,255,255,.2);color:#fff}
.container{max-width:1100px;margin:0 auto;padding:1rem}
.page{display:none}.page.active{display:block;animation:fadeInUp .35s ease}
.card{background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:1.05rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.5rem}
.stat-card{border-radius:var(--radius);padding:1.2rem;color:#fff;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:-40%;right:-20%;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.1)}
.stat-card .num{font-size:2rem;font-weight:900}
.stat-card .label{font-size:.8rem;opacity:.85}
.stat-card .icon{position:absolute;right:1rem;bottom:.8rem;font-size:1.8rem;opacity:.2}
.bg-g1{background:linear-gradient(135deg,#667eea,#764ba2)}
.bg-g2{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.bg-g3{background:linear-gradient(135deg,#2ecc71,#27ae60)}
.bg-g4{background:linear-gradient(135deg,#f39c12,#e67e22)}
/* Subject grid */
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.6rem}
.subject-card{background:var(--card-bg);border-radius:var(--radius-sm);padding:.8rem;text-align:center;text-decoration:none;color:var(--text);border:2px solid var(--border);transition:all .2s;cursor:pointer}
.subject-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.subject-card .s-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto .4rem;font-size:1rem;color:#fff}
.subject-card .s-name{font-size:.82rem;font-weight:600}
.subject-card .s-count{font-size:.7rem;color:var(--text-light)}
/* Form */
.form-section{margin-bottom:1.2rem}
.form-section h6{font-size:.82rem;font-weight:700;color:var(--text-light);margin-bottom:.6rem;letter-spacing:.5px}
.form-section h6 i{margin-right:.3rem}
.form-label{font-size:.85rem;font-weight:500;margin-bottom:.3rem;display:block}
.form-label .req{color:var(--danger)}
.form-control,.form-select{width:100%;padding:.5rem .7rem;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:.9rem;font-family:inherit;transition:border-color .2s;background:#fff}
.form-control:focus,.form-select:focus{outline:none;border-color:var(--primary)}
textarea.form-control{resize:vertical;min-height:70px}
.row{display:flex;flex-wrap:wrap;gap:.8rem}.row>*{flex:1 1 200px}
.btn{padding:.5rem 1.2rem;border:none;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.35rem;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,.4)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:0 0;border:2px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:.35rem .8rem;font-size:.8rem}
.btn-group{display:flex;gap:.5rem;flex-wrap:wrap}
/* List */
.filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-bar .form-select,.filter-bar .form-control{width:auto;min-width:120px;flex:1}
.question-item{padding:.8rem;border-bottom:1px solid var(--border);transition:background .2s;cursor:pointer}
.question-item:hover{background:var(--bg)}
.question-item:last-child{border-bottom:none}
.question-item .q-header{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.3rem}
.question-item .q-content{font-size:.9rem;color:#4a5568}
.question-item .q-meta{font-size:.78rem;color:var(--text-light);margin-top:.3rem;display:flex;gap:.5rem;flex-wrap:wrap}
.q-badge{font-size:.7rem;padding:.05rem .4rem;border-radius:4px;font-weight:500}
.badge-subject{background:var(--primary);color:#fff}
.badge-chapter{background:var(--bg);color:var(--text-light)}
.badge-reason{background:#f5656515;color:var(--danger)}
.badge-source{background:#48bb7815;color:#276749}

/* Detail */
.detail-field{margin-bottom:.8rem}.detail-field .label{font-size:.8rem;color:var(--text-light);font-weight:600}
.detail-field .value{font-size:.95rem}
/* Review */
.review-card{text-align:center;padding:2rem}
.review-card .q-text{font-size:1.1rem;font-weight:600;margin-bottom:1.5rem}
.review-btns{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.review-meta{font-size:.8rem;color:var(--text-light);margin-top:1rem}
.flow-check{margin-top:1rem;padding:.9rem 1rem;border-radius:var(--radius-sm);background:#fdf2f2;border:1.5px solid #f5c6c6;text-align:left}
.flow-check-title{font-size:.85rem;font-weight:700;color:var(--danger);margin-bottom:.6rem}
.flow-check textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:.5rem .6rem;font-size:.85rem;font-family:inherit;margin-bottom:.45rem;resize:vertical;background:#fff;color:var(--text);line-height:1.6}
.flow-check textarea::placeholder{color:#bdc3c7}
.flow-check-warn{font-size:.76rem;color:var(--danger);margin-top:.2rem;display:none;font-weight:600}
.review-progress{margin-bottom:1rem}
/* Training */
.training-layout{display:grid;grid-template-columns:1fr;gap:1rem}
.training-panel{background:var(--card-bg);border-radius:var(--radius);padding:1.5rem}
.layer-tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.layer-tab{padding:.4rem 1rem;border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.layer-tab.l1{background:#667eea20;color:var(--primary)}.layer-tab.l1.active{background:var(--primary);color:#fff}
.layer-tab.l2{background:#e67e2220;color:#e67e22}.layer-tab.l2.active{background:#e67e22;color:#fff}
.layer-tab.l3{background:#e74c3c20;color:var(--danger)}.layer-tab.l3.active{background:var(--danger);color:#fff}

.print-layout{display:grid;gap:1.5rem}
.print-q{padding:1rem;border:1px dashed var(--border);border-radius:8px;min-height:120px;page-break-inside:avoid}
.print-q .pq-num{font-weight:700;color:var(--primary);margin-bottom:.5rem}
.print-q .pq-answer{border-top:1px dashed var(--border);margin-top:.5rem;padding-top:.5rem;font-size:.9rem}
/* Analysis */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.chart-box{background:var(--card-bg);border-radius:var(--radius);padding:1.2rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.chart-box h4{font-size:.9rem;margin-bottom:.8rem;text-align:center}
.analysis-table{width:100%;border-collapse:collapse;font-size:.85rem}
.analysis-table th,.analysis-table td{padding:.4rem .6rem;text-align:left;border-bottom:1px solid var(--border)}
.analysis-table th{color:var(--text-light);font-weight:600;font-size:.78rem}
/* Pagination */
.pagination{display:flex;justify-content:center;gap:.3rem;margin-top:1rem}
.pagination a{padding:.3rem .7rem;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--text);font-size:.82rem}
.pagination a.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Toast */
.toast{position:fixed;top:20px;right:20px;padding:.8rem 1.2rem;border-radius:var(--radius-sm);color:#fff;font-size:.85rem;z-index:9999;animation:fadeInUp .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-info{background:var(--info)}
/* Misc */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-light)}
.empty-state i{font-size:3rem;opacity:.3;margin-bottom:1rem}
.empty-state h5{font-size:1rem;margin-bottom:.3rem}
.footer{text-align:center;padding:1.5rem;color:var(--text-light);font-size:.82rem}
@keyframes fadeInUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media(max-width:768px){.navbar-nav a span{display:none}.stat-grid{grid-template-columns:repeat(2,1fr)}.subject-grid{grid-template-columns:repeat(3,1fr)}.filter-bar .form-select,.filter-bar .form-control{min-width:100px}}
/* ==== 年级维度（1-12年级）==== */
.q-badge.badge-grade{background:#eef2ff;color:#3b5bdb;border:1px solid #dbe2ff}
.grade-chips{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
.grade-chip{background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:.28rem .75rem;font-size:.8rem;cursor:pointer;transition:.15s;color:var(--text)}
.grade-chip:hover{border-color:var(--primary);color:var(--primary)}
.grade-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
/* ==== 五维分析（A已知/B求解/C思路/D易错/E知识点）==== */
.ana5-wrap{display:grid;gap:.45rem;margin-top:.15rem}
.ana5-item{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;line-height:1.7}
.ana5-tag{flex:0 0 auto;min-width:4.9rem;padding:.16rem .5rem;border-radius:6px;color:#fff;font-size:.75rem;font-weight:700;text-align:center;white-space:nowrap}
.ana5-empty{font-size:.78rem;color:var(--text-light);margin-top:.4rem}
.ana5-form-row{margin-bottom:.5rem}
.ana5-v{flex:1;min-width:0}
.ana5-line{line-height:1.9;padding-left:1.05rem;text-indent:-1.05rem;margin-bottom:.2rem}
.ana5-line:last-child{margin-bottom:0}
.ana5-key{font-weight:700;color:#334155}
/* 复习页里的五维分析盒子（REVIEW_SHOW_ANA5=true 时出现） */
.ana5-review-box{margin:1rem 0;padding:.9rem 1rem;border-radius:var(--radius-sm);background:#f8fafc;border-left:4px solid #7c3aed;text-align:left}
.ana5-review-title{font-weight:700;color:#5b21b6;margin-bottom:.6rem;font-size:.95rem}
/* AI 生成的五维分析：透明标记，核对后可清掉 ana5_ai */
.ana5-ai-chip{display:inline-block;margin-left:.4rem;padding:.1rem .45rem;border-radius:10px;background:#fff7e6;color:#b45309;border:1px solid #fcd34d;font-size:.68rem;font-weight:600;vertical-align:middle;cursor:help}
/* ==== 答案等长文本按行显示（保留换行，不被折叠成空格）==== */
.prewrap{white-space:pre-wrap;line-height:1.95}
/* ===== 复习要点（AI错题本）===== */
.pts-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.pts-tab{padding:.4rem 1rem;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);
  border-radius:999px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.pts-tab:hover{border-color:var(--primary);color:var(--primary)}
.pts-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(102,126,234,.35)}
.pts-range{font-size:.84rem;color:var(--text-light);margin-bottom:.9rem;line-height:1.7}
.pts-card{background:var(--card-bg);border-radius:var(--radius);padding:.95rem 1.05rem;margin-bottom:.85rem;
  border-left:4px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.pts-card h5{margin:0 0 .6rem;font-size:.96rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.pts-card.c1{border-left-color:#667eea}.pts-card.c2{border-left-color:#e67e22}
.pts-card.c3{border-left-color:#38a169}.pts-card.c4{border-left-color:#e74c3c}
.pts-item{font-size:.9rem;line-height:1.85;padding-left:1.15rem;text-indent:-1.15rem;margin-bottom:.45rem}
.pts-item:last-child{margin-bottom:0}
.pts-badge{display:inline-block;background:#667eea14;color:#4a5fd0;border-radius:6px;padding:0 .4rem;font-size:.76rem;
  margin-left:.3rem;white-space:nowrap}
.pts-q{display:inline-block;color:var(--primary);font-size:.78rem;cursor:pointer;margin-right:.25rem;
  border-bottom:1px dotted var(--primary)}
.pts-q:hover{opacity:.7}
.pts-note{font-size:.8rem;color:var(--text-light)}
.pts-empty{font-size:.88rem;color:var(--text-light);line-height:1.7}
.pts-title{font-size:1.15rem;font-weight:800;margin-bottom:.3rem;display:flex;align-items:center;gap:.45rem}
/* ===== 复习筛选（复习页/复习要点 共用）===== */
.rvf-box{border:1.5px solid var(--border);border-radius:var(--radius);padding:.6rem .8rem;margin-bottom:.9rem;background:var(--card-bg)}
.rvf-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.87rem;cursor:pointer}
.rvf-head b{color:var(--primary)}
.rvf-row{display:flex;gap:.32rem;flex-wrap:wrap;align-items:center;margin-top:.5rem}
.rvf-lab{font-size:.78rem;color:var(--text-light);font-weight:700;min-width:2.6rem}
.rvf-chip{padding:.22rem .62rem;border:1.5px solid var(--border);background:var(--bg);color:var(--text);
  border-radius:999px;font-size:.78rem;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.rvf-chip i{font-style:normal;color:var(--text-light);font-size:.72rem;margin-left:.25rem}
.rvf-chip:hover{border-color:var(--primary);color:var(--primary)}
.rvf-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.rvf-chip.active i{color:#fff}
.rvf-note{font-size:.76rem;color:var(--text-light);margin-top:.5rem;line-height:1.65}
.rvf-clr{color:#e74c3c;text-decoration:none;font-weight:700;margin-right:.2rem}
/* ===== AI错题本 · 顶部双功能区（错题本 / 三层训练） ===== */
.top-tabs{display:flex;gap:.35rem;flex-wrap:wrap}
.top-tab{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.35);
  padding:.35rem .95rem;border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:.35rem;transition:all .2s;font-family:inherit}
.top-tab:hover{background:rgba(255,255,255,.3)}
.top-tab.active{background:#fff;color:var(--primary);border-color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#mainNav{border-top:1px solid rgba(255,255,255,.18);padding-top:.35rem}
.domain-tip{font-size:.76rem;color:var(--text-light);margin:-.4rem 0 .8rem}
@media(max-width:768px){.top-tab{font-size:.78rem;padding:.3rem .7rem}}
</style>

<script>
// ===================== DATA LAYER =====================
// ⚠️ 测试版：错题不进入测试库（老板 2026-09-27）。一次性清掉历史注入的内置错题。
try{ if(!localStorage.getItem('wb_test_purge_builtin_v1')){
  localStorage.removeItem('wrong_bank_data_test');
  localStorage.removeItem('wrong_bank_import_test');
  localStorage.removeItem('wrong_bank_builtin_applied_test');
  localStorage.setItem('wb_test_purge_builtin_v1','1');
}}catch(e){}
const LS_KEY = 'wrong_bank_data_test';
const IMPORT_KEY = 'wrong_bank_import_test';
// ⚠️ 历史/地理/生物/道法 已下线（老板 2026-09-25 要求）；前 5 科 id 不变，旧数据不受影响
const SUBJECTS_DEFAULT = ['数学','语文','英语','物理','化学'];
const REMOVED_SUBJECTS = ['历史','地理','生物','道法'];
const SUBJECT_ICONS = ['fa-calculator','fa-book','fa-language','fa-flask','fa-flask','fa-history','fa-globe','fa-leaf','fa-gavel'];
const SUBJECT_COLORS = ['#e74c3c','#3498db','#2ecc71','#667eea','#9b59b6','#f39c12','#1abc9c','#2ecc71','#34495e'];
const ERROR_REASONS = ['概念不清','计算失误','审题不清','思路错误','公式记错','其他'];
const SOURCES = ['考试','作业','练习','课外题','其他'];
const REVIEW_INTERVALS = [1,3,7,15,30];

function loadData() {
  let d = JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(!d||!d.subjects){
    d={subjects:SUBJECTS_DEFAULT.map((n,i)=>({id:i+1,name:n,sort_order:i})),chapters:[],questions:[],nextQId:1,nextChapId:1};
    saveData(d);
  }
  const _rp=repairIds(d);
  if(_rp){saveData(d);toast('🔧 已修复 '+_rp+' 道错题的重复编号','info');}
  const _mg=migrateGrades(d);
  if(_mg){saveData(d);toast('📚 已把 '+_mg+' 道旧错题归入 '+DEFAULT_GRADE+'年级（可在详情页修改）','info');}
  if(pruneSubjects(d))saveData(d);   // 下线科目清理
  return d;
}
// ===================== 跨设备同步（威联通后端 api_wrongbank.php） =====================
// 同步后端地址解析：
//   ① https 站点（cloudflared 隧道）→ 同源相对路径，由本机 8099 服务反代到威联通（免混合内容）
//   ② 威联通本机页面 → 同源相对路径，直连自己的 PHP
//   ③ 其它来源（如群晖版页面，内网 http）→ 直接指向威联通
const SYNC_REMOTE = 'http://192.168.3.88/xuci-jiancha/api_wrongbank_test.php';
const SYNC_API = (function(){
  const host = location.hostname;
  if (host === '192.168.3.88') return '/xuci-jiancha/api_wrongbank_test.php';                  // ① 威联通页面：直连本地 PHP
  if (/\.trycloudflare\.com$/.test(host)) return '/xuci-jiancha/api_wrongbank_test.php';       // ② 隧道(https)：同源，由 8099 反代
  if (location.protocol === 'https:') return null;                          // ③ 其它 https（如 GitHub Pages）：本机模式
  return SYNC_REMOTE;                                                       // ④ 内网其它来源（如群晖）：指向威联通
})();
const SYNC_TOKEN = 'xuji-sync-2026';
let _syncTimer = null, _syncPulling = false, _lastPushed = '';
// ⚠️ 数据保护闸：只有「成功从服务器拉取过」才允许上传。
//    历史事故：NAS 慢/拉取失败时页面退回本机旧数据，此时任何一次编辑都会把旧数据整包
//    推回服务器 → 服务器上的新内容（如刚补的五维分析）被静默覆盖。故加此闸门。
let _pullOK = false;

function _syncOn(){ return !!SYNC_API; }

async function cloudPull(){
  const r = await fetch(`${SYNC_API}?action=load`, {headers:{'X-Sync-Token':SYNC_TOKEN}, cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'load 失败');
  return j;   // {data, updated_at}  data 可能为 null
}

async function cloudPushNow(d){
  const body = JSON.stringify(d);
  if(body === _lastPushed) return;               // 无变化不重复上传
  const r = await fetch(`${SYNC_API}?action=save`, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Sync-Token':SYNC_TOKEN},
    body
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'save 失败');
  _lastPushed = body;
  return j;
}

function cloudPush(d){                            // 防抖：停止操作 1.2s 后上传
  if(!SYNC_API) return;                           // 无可用后端（https 版）→ 纯本机模式
  if(!_pullOK){                                   // ⚠️ 数据保护闸：没成功拉过服务器数据就不许上传
    setSyncBadge('error','未连上云端：改动只存本机，不会覆盖服务器（点此徽章可重试同步）');
    return;
  }
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(()=>{
    cloudPushNow(d).then(()=>{ setSyncBadge('ok'); })
                   .catch(e=>{ setSyncBadge('error', e.message); });
  }, 1200);
}

function setSyncBadge(state, msg){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(state==='ok'){ el.textContent='☁️ 已同步'; el.style.background='#e6f4ea'; el.style.color='#137333'; el.title='已保存到服务器，其他设备可见'; }
  else if(state==='error'){ el.textContent='⚠️ 同步失败(仅本机)'; el.style.background='#fce8e6'; el.style.color='#c5221f'; el.title=msg||''; }
  else if(state==='local'){ el.textContent='📴 本机模式'; el.style.background='#f1f3f4'; el.style.color='#5f6368'; el.title='此页面地址无同步服务（如 GitHub Pages 版），数据仅存本机；用 NAS 地址打开即可跨设备同步'; }
  else if(state==='pulling'){ el.textContent='⏳ 正在同步…'; el.style.background='#e8f0fe'; el.style.color='#1967d2'; }
  else { el.textContent='☁️ 同步已启用'; el.style.background='#f1f3f4'; el.style.color='#5f6368'; }
}

async function cloudInit(forceRemote){
  if(!SYNC_API){ setSyncBadge('local'); return; }   // 如 GitHub Pages(https) 版：无后端可用
  setSyncBadge('pulling');
  let j=null, lastErr=null;
  for(let attempt=1; attempt<=3; attempt++){        // NAS 偶尔要几十秒才回：重试 3 次（1.5s/3s 退避）再放弃
    try{ j=await cloudPull(); lastErr=null; break; }
    catch(e){ lastErr=e; if(attempt<3) await new Promise(r=>setTimeout(r, attempt*1500)); }
  }
  try{
    if(lastErr) throw lastErr;
    _pullOK = true;                                 // 拉取成功 → 打开上传闸门
    const localRaw = localStorage.getItem(LS_KEY);
    const localObj = localRaw ? JSON.parse(localRaw) : null;
    const hasRemote = j.data && Array.isArray(j.data.questions) && (j.data.questions.length > 0 || (j.data.subjects||[]).length > 0);
    if(hasRemote){
      // 服务器有真实数据：以服务器为准（服务器是唯一真实源）
      saveData(j.data);                                   // 走统一保存：顺便校准 id 计数器
      _lastPushed = JSON.stringify(j.data);
      const _chg=repairIds(j.data)+migrateGrades(j.data)+pruneSubjects(j.data);
      if(_chg){ saveData(j.data); _lastPushed=''; cloudPushNow(j.data).then(()=>setSyncBadge('ok')).catch(()=>{}); }
      setSyncBadge('ok');
      navigate('dashboard');
      toast('☁️ 已从服务器同步最新错题本','success');
    }else{
      // 服务器为空或只有空壳：把本地数据推上去初始化
      const d0 = loadData();
      await cloudPushNow(d0);
      setSyncBadge('ok');
    }
  }catch(e){
    // 后端不可达：file:// 或无 PHP 的静态站（如 GitHub Pages）→ 中性提示，静默退回本机模式
    _pullOK = false;                                // ⚠️ 关闭上传闸门：本机可能是旧数据，禁止覆盖服务器
    const neutral = (location.protocol === 'file:') || !/^https?:/.test(location.protocol);
    setSyncBadge(neutral ? 'local' : 'error',
                 neutral ? undefined : (e.message + '（改动只存本机，不会覆盖服务器；点徽章重试）'));
  }
}

function _maxId(arr,key){return (arr||[]).reduce((m,x)=>Math.max(m,(x&&+x[key])||0),0);}
function saveData(d){
  // ⚠️ 历史 bug：调用方常拿旧快照回写，把 nextQId 覆盖回旧值（生产库曾出现已有 39 题而
  //    nextQId=1）→ 新录入的题被分配与旧题重复的 id，点开新题看到的是旧题（find 取首个匹配）。
  //    这里每次保存都按现有最大 id 校准计数器，从根上堵住。
  if(d&&Array.isArray(d.questions))d.nextQId=Math.max((+d.nextQId)||1,_maxId(d.questions,'id')+1);
  if(d&&Array.isArray(d.chapters))d.nextChapId=Math.max((+d.nextChapId)||1,_maxId(d.chapters,'id')+1);
  localStorage.setItem(LS_KEY,JSON.stringify(d));cloudPush(d);
}

function genId(){const d=loadData();const id=Math.max((+d.nextQId)||1,_maxId(d.questions,'id')+1);d.nextQId=id+1;saveData(d);return id;}
function genChapId(){const d=loadData();const id=Math.max((+d.nextChapId)||1,_maxId(d.chapters,'id')+1);d.nextChapId=id+1;saveData(d);return id;}
function repairIds(d){                          // 一次性修补历史重复编号
  if(!d)return 0;
  const used=new Set();let fixed=0;
  (d.questions||[]).forEach(q=>{
    if(used.has(q.id)){const nid=(used.size?Math.max(...used):0)+1;q.id=nid;used.add(nid);fixed++;}
    else used.add(q.id);
  });
  if(fixed)d.nextQId=(used.size?Math.max(...used):0)+1;
  return fixed;
}
// 下线科目：从已有数据里移除历史/地理/生物/道法（该科下仍挂着题或章节则保留，避免孤儿数据）
function pruneSubjects(d){
  if(!d||!Array.isArray(d.subjects))return 0;
  const qs=(d.questions||[]).map(q=>q.subject_id),cs=(d.chapters||[]).map(c=>c.subject_id);
  const before=d.subjects.length;
  d.subjects=d.subjects.filter(s=>!REMOVED_SUBJECTS.includes(s.name)||qs.includes(s.id)||cs.includes(s.id));
  return before-d.subjects.length;
}
function now(){return new Date().toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-');}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function calcNextReview(mastery){if(mastery>=REVIEW_INTERVALS.length)return null;const d=new Date();d.setDate(d.getDate()+REVIEW_INTERVALS[mastery]);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

const ANA5_DIMS=[
  {k:'known',  tag:'A 已知条件', color:'#2f6fed', ph:'题目给了什么（含隐含条件）'},
  {k:'ask',    tag:'B 求解什么', color:'#16a34a', ph:'要求的是什么 / 目标量'},
  {k:'method', tag:'C 做题思路', color:'#d97706', ph:'从条件到结论的路子、用的定理/公式'},

  {k:'points', tag:'E 知识点',   color:'#7c3aed', ph:'对应的课本知识点 / 考点'}

function esc5(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ana5(q){return (q&&q.ana5)||{};}
function ana5Empty(q){const a=ana5(q);return !ANA5_DIMS.some(dm=>(a[dm.k]||'').trim());}
function ana5Lines(v){                      // 按行渲染：行首编号/短标签做悬挂缩进，标签加粗
  return v.split('\n').map(x=>x.trim()).filter(x=>x).map(line=>{
    const m=line.match(/^([^：:]{1,10}[：:])/);
    if(m)return `<div class="ana5-line"><span class="ana5-key">${esc5(m[1])}</span>${esc5(line.slice(m[1].length))}</div>`;
    return `<div class="ana5-line">${esc5(line)}</div>`;
  }).join('');
}
function renderAna5View(q){
  const a=ana5(q);
  return `<div class="detail-field"><div class="label">🧩 五维分析 ${ana5AiChip(q)}</div>
    <div class="ana5-wrap">${ANA5_DIMS.map(dm=>{
      const v=(a[dm.k]||'').trim();
      return `<div class="ana5-item"><span class="ana5-tag" style="background:${dm.color}">${dm.tag}</span><div class="ana5-v">${v?ana5Lines(v):'<span style="color:#bdc3c7">未填写</span>'}</div></div>`;
    }).join('')}</div>
    ${ana5Empty(q)?'<div class="ana5-empty">💡 点下方「编辑」按 A–E 五维补全：先定已知与目标，再写思路，最后记易错点与知识点——复习时按这五步复盘最快</div>':''}

}

function lastGrade(){const v=parseInt(localStorage.getItem('wb_last_grade_test')||'');return(v>=1&&v<=12)?v:DEFAULT_GRADE;}

function gradeMatch(q,g){                       // 通用年级筛选：''=全部 'none'=未标注 '7'..'12'
  if(g==='none')return q.grade===undefined||q.grade===null||q.grade==='';
  if(g!=='')return q.grade===parseInt(g);
  return true;
}
function migrateGrades(d){                      // 旧数据一次性补年级（详情页可改）
  if(!d||d.grade_migrated)return 0;
  let n=0;(d.questions||[]).forEach(q=>{if(q.grade===undefined||q.grade===null||q.grade===''){q.grade=DEFAULT_GRADE;n++;}});
  d.grade_migrated=true;return n;
}

// ===================== IMPORT FROM LEARNING PAGES =====================
function checkImport(){try{
  const data=localStorage.getItem(IMPORT_KEY);
  if(!data)return;
  const items=JSON.parse(data);
  if(!items.length)return;
  const d=loadData();
  let imported=0;
  for(const item of items){
    const subj=d.subjects.find(s=>s.name===item.subject);
    if(!subj)continue;
    let chap=null;
    if(item.chapter){
      chap=d.chapters.find(c=>c.subject_id===subj.id&&c.name===item.chapter);
      if(!chap){chap={id:genChapId(),subject_id:subj.id,name:item.chapter,sort_order:0};d.chapters.push(chap);}
    }
    d.questions.push({
      id:genId(),subject_id:subj.id,chapter_id:chap?chap.id:null,
      content:item.content,correct_answer:item.correct_answer||'',my_answer:item.my_answer||'',
      error_reason:item.error_reason||'概念不清',tags:item.tags||'',source:item.source||'练习',
      difficulty:item.difficulty||3,grade:item.grade||lastGrade(),mastery:0,created_at:now(),updated_at:now(),
      next_review:today(),review_count:0,image_path:'',answer_image_path:'',flow:{},ana5:{}
    });
    imported++;
  }
  saveData(d);
  localStorage.removeItem(IMPORT_KEY);
  if(imported>0)toast(`📥 成功导入 ${imported} 道错题！`,'success');
}catch(e){console.error('Import error:',e);}}

      if(!chap){chap={id:genChapId(),subject_id:subj.id,name:b.chapter,sort_order:0};d.chapters.push(chap);}}
    d.questions.push({id:genId(),subject_id:subj.id,chapter_id:chap?chap.id:null,
      content:b.content,correct_answer:b.correct_answer||'',my_answer:b.my_answer||'',
      error_reason:b.error_reason||'概念不清',tags:b.tags||'',source:b.source||'练习',
      difficulty:b.difficulty||3,grade:b.grade||DEFAULT_GRADE,mastery:0,created_at:now(),updated_at:now(),
      next_review:today(),review_count:0,image_path:b.image_path||'',answer_image_path:'',flow:b.flow||{},ana5:b.ana5||{}});

// ===================== FILE UPLOAD HELPERS =====================
function handleFile(input, field) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('图片不能超过2MB','error'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    addForm[field] = e.target.result;
    const preview = document.getElementById(field === 'image_path' ? 'af_image_preview' : 'af_answer_image_preview');
    if (preview) {
      preview.style.display = 'block';
      preview.innerHTML = `<img src="${e.target.result}" style="width:100%;border-radius:6px">
        <span style="font-size:.75rem;color:var(--text-light);cursor:pointer" onclick="clearFile('${field}','${input.id}','${preview.id}')">✕ 删除</span>`;
    }
  };
  reader.readAsDataURL(file);
}
function clearFile(field, inputId, previewId) {
  addForm[field] = '';
  const inp = document.getElementById(inputId);
  if (inp) inp.value = '';
  const pre = document.getElementById(previewId);
  if (pre) pre.style.display = 'none';
}

function submitAdd(){
  const d=loadData();
  const content=document.getElementById('af_content').value.trim();
  if(!content){toast('请输入题目内容','error');return;}
  const qid=genId();
  const chapId=addForm.chapter_id?parseInt(addForm.chapter_id):null;
  d.questions.push({
    id:qid,subject_id:addForm.subject_id,chapter_id:chapId,
    content,correct_answer:addForm.correct_answer,my_answer:addForm.my_answer,
    error_reason:addForm.error_reason,tags:addForm.tags,source:addForm.source,
    difficulty:addForm.difficulty,grade:(addForm.grade?+addForm.grade:lastGrade()),mastery:0,created_at:now(),updated_at:now(),
    next_review:today(),review_count:0,image_path:addForm.image_path||'',answer_image_path:addForm.answer_image_path||'',flow:{},ana5:{}
  });
  saveData(d);
  setLastGrade(addForm.grade);
  addForm={subject_id:addForm.subject_id,chapter_id:'',content:'',correct_answer:'',my_answer:'',error_reason:'概念不清',tags:'',source:'练习',difficulty:3,grade:addForm.grade||lastGrade(),image_path:'',answer_image_path:''};
  toast('✅ 错题已保存','success');
  navigate('detail',{qid});
}

function addChapter(){
  const name=prompt('新章节名称：');

  d.chapters.push({id:genChapId(),subject_id:addForm.subject_id,name,sort_order:0});

}

// ===================== LIST =====================
let listFilter={subject_id:'',error_reason:'',mastery:'',grade:'',search:'',page:1};
const PER_PAGE=15;

function renderList(){
  const d=loadData();
  let filtered=[...d.questions];
  if(listFilter.subject_id) filtered=filtered.filter(q=>q.subject_id===parseInt(listFilter.subject_id));
  if(listFilter.error_reason) filtered=filtered.filter(q=>q.error_reason===listFilter.error_reason);
  if(listFilter.mastery!=='') filtered=filtered.filter(q=>q.mastery===parseInt(listFilter.mastery));
  if(listFilter.grade!=='') filtered=filtered.filter(q=>gradeMatch(q,listFilter.grade));
  if(listFilter.search) {const s=listFilter.search.toLowerCase();filtered=filtered.filter(q=>q.content.toLowerCase().includes(s)||q.tags.toLowerCase().includes(s));}
  filtered.sort((a,b)=>b.id-a.id);
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  const page=Math.min(listFilter.page,totalPages);
  const paged=filtered.slice((page-1)*PER_PAGE,page*PER_PAGE);
  return`<div class="card">
    <div class="card-title"><i class="fas fa-filter"></i> 筛选</div>
    <div class="filter-bar">
      <select class="form-select" id="lf_subject" onchange="listFilter.subject_id=this.value;listFilter.page=1;refreshList()">
        <option value="">📚 全部科目</option>${d.subjects.map(s=>`<option value="${s.id}" ${listFilter.subject_id==String(s.id)?'selected':''}>${s.name}</option>`).join('')}
      </select>
      <select class="form-select" onchange="listFilter.grade=this.value;listFilter.page=1;refreshList()">
        <option value="">🎓 全部年级</option>
        <option value="none" ${listFilter.grade==='none'?'selected':''}>未标注年级</option>
        ${GRADES.map(g=>`<option value="${g}" ${listFilter.grade===String(g)?'selected':''}>${g}年级</option>`).join('')}
      </select>
      <select class="form-select" onchange="listFilter.error_reason=this.value;listFilter.page=1;refreshList()">
        <option value="">📌 全部原因</option>${ERROR_REASONS.map(r=>`<option value="${r}" ${listFilter.error_reason===r?'selected':''}>${r}</option>`).join('')}
      </select>
      <select class="form-select" onchange="listFilter.mastery=this.value;listFilter.page=1;refreshList()">
        <option value="">🎯 掌握度</option><option value="0" ${listFilter.mastery==='0'?'selected':''}>未掌握</option>
        <option value="1" ${listFilter.mastery==='1'?'selected':''}>待复习</option><option value="5" ${listFilter.mastery==='5'?'selected':''}>已掌握</option>
      </select>
      <input class="form-control" placeholder="🔍 搜索题目…" value="${listFilter.search}" onchange="listFilter.search=this.value;listFilter.page=1;refreshList()" style="min-width:150px">
      <button class="btn btn-outline btn-sm" onclick="listFilter={subject_id:'',error_reason:'',mastery:'',grade:'',search:'',page:1};refreshList()"><i class="fas fa-undo"></i> 重置</button>
    </div>
    <div>${paged.length?paged.map(q=>{
      const subj=d.subjects.find(s=>s.id===q.subject_id);
      const chap=d.chapters.find(c=>c.id===q.chapter_id);
      return`<div class="question-item" onclick="navigate('detail',{qid:${q.id}})">
        <div class="q-header"><span class="q-badge badge-subject">${subj?subj.name:'?'}</span>
        <span class="q-badge badge-grade">${gradeText(q.grade)}</span>
        ${chap?`<span class="q-badge badge-chapter">${chap.name}</span>`:''}
        <span class="q-badge badge-reason">${q.error_reason}</span>
        <span class="q-badge badge-source">${q.source}</span>
        <span class="q-badge badge-mastery">${q.mastery}/5</span></div>
        <div class="q-content">${q.content.substring(0,200)}${q.content.length>200?'…':''}</div>
        <div class="q-meta">${q.created_at} ${q.tags?'🏷️ '+q.tags:''}</div></div>`;
    }).join(''):'<div class="empty-state"><i class="fas fa-inbox"></i><h5>没有匹配的错题</h5></div>'}
    ${totalPages>1?`<div class="pagination">${[...Array(totalPages).keys()].map(i=>`<a class="${i+1===page?'active':''}" onclick="listFilter.page=${i+1};refreshList()">${i+1}</a>`).join('')}</div>`:''}
  </div>`;

let reviewList=[],reviewIdx=0,reviewAnswered=false,reviewFilter='all';

function renderReview(){
  const d=loadData();
  let qs;
  if(reviewFilter==='need'){
    qs=d.questions.filter(q=>q.next_review&&q.next_review<=today());
    if(!qs.length)qs=d.questions.filter(q=>q.mastery<5);
    if(!qs.length)qs=[...d.questions];
  }else if(reviewFilter==='twice'){
    qs=d.questions.filter(q=>q.review_count<2);
    if(!qs.length)qs=[...d.questions];
  }else{
    // 默认：先复习未满2次重做的错题（确保每道错题重做2次以上）
    qs=d.questions.filter(q=>q.review_count<2);
    if(!qs.length)qs=d.questions.filter(q=>q.next_review&&q.next_review<=today());
    if(!qs.length)qs=d.questions.filter(q=>q.mastery<5);
    if(!qs.length)qs=[...d.questions];
  }
  qs=rvfApply(qs);
  if(!qs.length)return rvfPanel()+'<div class="empty-state"><i class="fas fa-filter" style="color:var(--text-light)"></i><h5>当前筛选下没有错题</h5><p>把条件放宽，或点下面清空筛选。</p><button class="btn btn-primary" onclick="rvfClear()"><i class="fas fa-eraser"></i> 清空筛选</button></div>';
  reviewList=qs.sort(()=>Math.random()-.5);
  reviewIdx=0;reviewAnswered=false;
  return reviewView();
}

function reviewResult(r){
  const q=reviewList[reviewIdx];
  const d=loadData();
  const qq=d.questions.find(x=>x.id===q.id);
  if(qq){
    // 流程检查（五步法）：四项必填，不填完不算订正完成
    const fcVals={};
    ['fc_known','fc_target','fc_plan','fc_check'].forEach(id=>{const el=document.getElementById(id);fcVals[id]=el?(el.value||'').trim():'';});
    if(!fcVals.fc_known||!fcVals.fc_target||!fcVals.fc_plan||!fcVals.fc_check){
      const warn=document.getElementById('fc_warn');if(warn)warn.style.display='block';
      toast('⚠️ 流程未完成：请填完 已知/求/步骤/检验 四项，才算订正完成！','error');
      return;
    }
    qq.flow={known:fcVals.fc_known,target:fcVals.fc_target,plan:fcVals.fc_plan,check:fcVals.fc_check};
    if(r===2)qq.mastery=Math.min(qq.mastery+1,REVIEW_INTERVALS.length);
    else if(r===0)qq.mastery=0;
    qq.next_review=calcNextReview(qq.mastery);
    qq.review_count++;
    qq.updated_at=now();
    saveData(d);
    if(qq.review_count===2)toast('✅ 该错题已重做2次，基础巩固达成！','success');
    if(qq.review_count>=2&&qq.mastery>=3)toast('🏆 已重做2次以上且掌握良好！','success');
    if(qq.mastery>=5)toast('🎉 该错题已完全掌握！','success');
  }
  reviewIdx++;reviewAnswered=false;
  document.querySelector('#app').innerHTML=reviewView();
}

// ===================== TRAINING =====================
let trainingLayer=1,trainingQ=null,trainingFromQid=null;
let trainingGrade='';                    // 三层训练的年级维度：''=全部 'none'=未标注 '7'..'12'
function trainGradeMatch(q){
  if(trainingGrade==='none')return q.grade===undefined||q.grade===null||q.grade==='';
  if(trainingGrade!=='')return q.grade===parseInt(trainingGrade);
  return true;
}
function trainingGradeChips(d){
  const has=(k)=>d.questions.some(q=>gradeMatch(q,k));
  const chip=(k,txt)=>`<button class="grade-chip ${trainingGrade===k?'active':''}" onclick="trainingGrade='${k}';refreshTraining()">${txt}</button>`;
  const present=GRADES.filter(g=>has(String(g)));
  if(!has('none')&&present.length<2)return'';   // 只有一个年级且无未标注 → 不显示筛选条
  return `<div class="grade-chips" style="margin-bottom:.5rem">${chip('','全部年级')}${present.map(g=>chip(String(g),g+'年级')).join('')}${has('none')?chip('none','未标注'):''}</div>`;
}

const SUBJ_ICON={'数学':'fa-calculator','物理':'fa-atom','化学':'fa-flask','语文':'fa-book','英语':'fa-language','历史':'fa-scroll','地理':'fa-globe','生物':'fa-dna','道法':'fa-balance-scale'};
function subjIcon(n){return SUBJ_ICON[n]||'fa-book';}

function renderTraining(data){
  const d=loadData();
  // If a specific question is requested
  if(data&&data.qid){
    const q=d.questions.find(x=>x.id===data.qid);
    if(!q)return'<div class="empty-state"><i class="fas fa-question-circle"></i><h5>题目不存在</h5></div>';
    trainingQ=q;
    trainingLayer=1;
    trainingFromQid=q.id;                 // 记住来源，返回时回到该错题详情
    return renderQTraining(q);
  }
  trainingQ=null;
  trainingFromQid=null;
  // Show subject selection
  const gQs=d.questions.filter(trainGradeMatch);          // 先过年级维度
  const counts={};
  d.subjects.forEach(x=>{counts[x.name]=gQs.filter(q=>q.subject_id===x.id).length;});   // 全部科目（含语文/英语）
  const subjects=Object.keys(counts).filter(n=>counts[n]>0);
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  if(!total)return`<div class="card">${trainingGradeChips(d)}<div class="empty-state"><i class="fas fa-layer-group"></i><h5>${trainingGrade?'该年级还没有错题':'还没有错题'}</h5><p>先录入错题，再用三层训练强化</p></div></div>`;
  return`<div class="training-layout">
    <div class="training-panel"><h4 style="margin-bottom:.8rem"><i class="fas fa-layer-group" style="color:var(--primary)"></i> 三层训练</h4>
      <p style="font-size:.9rem;color:var(--text-light);margin-bottom:1rem">
      <strong>1️⃣ 基础同构</strong> → 原题重做<br>
      <strong>2️⃣ 条件变化</strong> → 改编条件/换语境，灵活应变<br>
      <strong>3️⃣ 反向综合</strong> → 综合应用，提升思维</p>
      ${trainingGradeChips(d)}
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">
        ${subjects.map(s=>`<button class="btn btn-primary" onclick="startSubjectTraining('${s}')"><i class="fas ${subjIcon(s)}"></i> ${s}（${counts[s]}题）</button>`).join('')}
        ${Object.values(counts).reduce((a,b)=>a+b,0)?'<button class="btn btn-success" onclick="startSubjectTraining(\'all\')"><i class="fas fa-random"></i> 全部混合（'+Object.values(counts).reduce((a,b)=>a+b,0)+'题）</button>':''}
      </div>
    </div></div>`;
}

function startSubjectTraining(subjName){
  const d=loadData();
  let qs;
  if(subjName==='all'){
    const subjIds=d.subjects.map(s=>s.id);
    qs=d.questions.filter(q=>subjIds.includes(q.subject_id)&&trainGradeMatch(q));
  }else{
    const subj=d.subjects.find(s=>s.name===subjName);
    if(!subj)return;
    qs=d.questions.filter(q=>q.subject_id===subj.id&&trainGradeMatch(q));
  }
  if(!qs.length){toast('没有符合条件的错题','error');return;}
  trainingQ=qs[Math.floor(Math.random()*qs.length)];
  trainingLayer=1;
  document.querySelector('#app').innerHTML=renderQTraining(trainingQ);
}

function renderQTraining(q){
  const d=loadData();
  const subj=d.subjects.find(s=>s.id===q.subject_id);
  const layers=getOrGenLayers(q);
  const layerNames=['','🔵 基础同构 · 原题重现','🟠 条件变化 · 灵活应变','🔴 反向综合 · 思维提升'];
  const layerCols=['','#667eea','#e67e22','#e74c3c'];
  const layerBg=['','#667eea10','#e67e2210','#e74c3c10'];
  const l=layers[trainingLayer-1];
  return`<div class="training-panel fade-in-up">
    <div style="display:flex;gap:.3rem;margin-bottom:.8rem;flex-wrap:wrap">
      ${[0,1,2].map((li,i)=>{
        const ln=i+1;
        return`<button class="btn btn-sm ${ln===trainingLayer?'btn-primary':'btn-outline'}" onclick="trainingLayer=${ln};document.querySelector('#app').innerHTML=renderQTraining(trainingQ)">
          ${['🔵','🟠','🔴'][i]} 第${ln}层</button>`;
      }).join('')}

    </div>
    <div style="padding:.8rem;background:${layerBg[trainingLayer]};border-radius:var(--radius-sm);margin-bottom:.8rem;border-left:4px solid ${layerCols[trainingLayer]};font-size:.9rem">
      ${l.content}
    </div>
    <textarea class="form-control" rows="${trainingLayer===3?'5':'4'}" placeholder="${l.placeholder}" style="margin-bottom:.8rem">${l.savedAnswer||''}</textarea>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem">
      <button class="btn btn-outline btn-sm" onclick="showLayerAns()"><i class="fas fa-eye"></i> 查看参考答案</button>
    </div>
    <div id="layerAns" style="display:none;padding:.8rem;background:#48bb7810;border-radius:var(--radius-sm);margin-bottom:.8rem;border-left:4px solid var(--success);font-size:.88rem">
      <strong style="color:var(--success)">✅ 参考答案：</strong><br>${l.answer}
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">
      <button class="btn btn-outline btn-sm" onclick="trainingLayer=Math.max(1,trainingLayer-1);document.querySelector('#app').innerHTML=renderQTraining(trainingQ)" ${trainingLayer<=1?'disabled':''}><i class="fas fa-arrow-left"></i> 上一层</button>
      <button class="btn btn-primary btn-sm" onclick="trainingLayer=Math.min(3,trainingLayer+1);document.querySelector('#app').innerHTML=renderQTraining(trainingQ)" ${trainingLayer>=3?'disabled':''}>下一层 <i class="fas fa-arrow-right"></i></button>
      <button class="btn btn-success btn-sm" onclick="saveLayerAns()"><i class="fas fa-save"></i> 保存作答</button>
      <button class="btn btn-outline btn-sm" onclick="nextTrainingQ()"><i class="fas fa-random"></i> 换一题</button>
      <button class="btn btn-outline btn-sm" onclick="backFromTraining()"><i class="fas fa-arrow-left"></i> ${trainingFromQid?'返回错题详情':'返回'}</button>
    </div>
  </div>`;
}

function backFromTraining(){
  const back=trainingFromQid;
  trainingQ=null;trainingFromQid=null;
  if(back){navigate('detail',{qid:back});return;}
  navigate('training',{});
}

function showLayerAns(){
  const el=document.getElementById('layerAns');
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

function saveLayerAns(){
  const d=loadData();
  const q=d.questions.find(x=>x.id===trainingQ.id);
  if(!q)return;
  if(!q._layers)q._layers={answers:[]};
  const ta=document.querySelector('.training-panel textarea');
  if(!q._layers.answers)q._layers.answers=[];
  q._layers.answers[trainingLayer-1]=ta?ta.value:'';
  saveData(d);
  toast('✅ 作答已保存','success');
}

function getOrGenLayers(q){
  const d=loadData();
  const fq=d.questions.find(x=>x.id===q.id);
  if(fq&&fq._layers&&fq._layers.data)return fq._layers.data;
  const layers=genLayers(q);
  if(fq){if(!fq._layers)fq._layers={};fq._layers.data=layers;saveData(d);}
  return layers;
}

function genLayers(q){
  const content=q.content||'';
  const answer=q.correct_answer||'';
  const d0=loadData();
  const subjName=((d0.subjects||[]).find(s=>s.id===q.subject_id)||{}).name||'';
  const isMath=/\d+/.test(content);
  const hasChoice=/[A-D]\)/.test(content)||/A\./.test(content);
  
  // Layer 1: 原题重现
  const l1={
    title:'基础同构 · 原题重做',
    content:`<strong>原题：</strong><span class="prewrap">${content}</span><br><strong style="color:var(--success)">✅ 原题正确答案：</strong><span class="prewrap">${answer||'（见下方）'}</span>`,
    placeholder:'请重新解答这道题，检验是否真正掌握…',
    answer:`原题正确答案：${answer||'（未记录）'}<br>重新做一遍，看是否和正确答案一致。`,
    savedAnswer:''
  };

  // Layer 2: 生成变式
  let l2Content,l2Ans,l2Place;
  if(subjName==='英语'||subjName==='语文'){
    // 语言类 → 同考点换素材（不能换数字）
    const w=subjName==='英语'?'句子':'语段';
    l2Content=`<strong>变式题（同考点换个语境）：</strong>把这道题考查的同一个知识点，换一个${w}再练一遍。<br><br>`+
      `<div style="background:var(--card-bg);padding:.6rem .8rem;border-radius:8px;border-left:3px solid #e67e22">`+
      `💡 提示：${subjName==='英语'?'换个主语/时间/情境，让同一个词或语法点出现在新句子里':'换个说法或换一段文字，同一个考点换一种表达方式'}，<br>`+
      `写出来后再对照原题，看这个知识点是不是真的会用了。</div>`;
    l2Ans=`换语境训练的关键：<br>1. 先写清原题考的是哪个知识点<br>2. 自己造一个新的${w}，确保用上同一个知识点<br>3. 对照原题答案，检查用法是否一致`;
    l2Place=`写出你编的新${w}，并标明用到的知识点…`;
  }else if(subjName==='物理'){
    // 物理 → 换场景
    l2Content=`<strong>变式题（换场景）：</strong>保持考查的知识点和公式不变，换一个物体或生活场景再算一遍。`;
    l2Ans=`换场景训练的关键：<br>1. 明确原题用的公式/规律<br>2. 换物体、换数值或换情境，重算一遍<br>3. 对比原题，看结论是否合理`;
    l2Place='换一个场景改编，写出新题和数据，再解一遍…';
  }else if(isMath&&!/[A-D]\)/.test(content)){
    // 数学计算题 → 换数字
    const nums=content.match(/\d+(\.\d+)?/g);
    if(nums&&nums.length){
      const newNums=nums.map(n=>String(Math.floor(parseFloat(n)*(0.5+Math.random()*0.8)+1)));
      let v=content;nums.forEach((n,i)=>{v=v.replace(n,newNums[i%newNums.length]);});
      l2Content=`<strong>变式题（换数）：</strong>${v}`;
      l2Ans=`题目变了数字，但解题方法相同。按照原题思路，代入新数据重新计算。`;
      l2Place='按照原题解题方法，代入新的数据计算…';
    }else{
      l2Content=`<strong>变式题：</strong>改变题目中的一个条件，自己编一道类似的题并解答。`;
      l2Ans=`变式练习的关键是找出题目的核心条件，改变其中一个，看解题思路是否变化。`;
      l2Place='尝试改变条件，题目会怎么变？写出变式题和解答…';
    }
  }else if(hasChoice){
    // 选择题 → 改选项/改情景
    const opts=content.match(/[A-D][.）][^A-D]*/g);
    if(opts&&opts.length>=2){
      l2Content=`<strong>变式题（改选项/改情景）：</strong><br>把题目中的核心条件改一下，看看正确答案变不变？<br><br>`+
        `<div style="background:var(--card-bg);padding:.6rem .8rem;border-radius:8px;border-left:3px solid #e67e22">`+
        `💡 提示：想一下如果改变题目中的某个关键词，<br>比如"音调"改成"响度"、"声源处"改成"传播过程中"，<br>答案会怎么变？</div>`;
      l2Ans=`变式练习答案取决于具体改动。关键思路：<br>1. 找出题目考查的核心知识点<br>2. 改变条件后重新分析哪个选项正确<br>3. 验证原答案是否仍然成立`;
      l2Place='写出你改编的题目，以及改编后的正确答案…';
    }else{
      l2Content=`<strong>变式题：</strong>自己出一道与本题考查相同知识点的选择题，并给出答案。`;
      l2Ans=`编题思路：确定考查的知识点 → 设计题干 → 设计4个选项（1正确3干扰）<br>确保干扰项来自常见的概念混淆。`;
      l2Place='请编一道相似的选择题并给出答案…';
    }
  }else{
    // 其他题型
    l2Content=`<strong>变式题：</strong>改变题目的某个条件或数据，重新解答。看看条件变了以后，答案有什么不同？`;
    l2Ans=`变式练习的关键：<br>1. 找出题目的可变条件<br>2. 改变一个条件后重新分析<br>3. 对比原题答案，理解条件变化对结果的影响`;
    l2Place='写出你改编后的题目和解答过程…';
  }
  const l2={
    title:'条件变化 · 灵活应变',
    content:l2Content,
    placeholder:l2Place||'思考条件变化后的新解法…',
    answer:l2Ans||'条件变化训练的是你灵活运用知识的能力。尝试改变题目条件，看解题思路的变化。',
    savedAnswer:''
  };

  // Layer 3: 反向综合
  let l3Content,l3Ans,l3Place;
  if(answer){
    l3Content=`<strong>反向综合题：</strong>根据答案<strong>"${answer.length>50?answer.substring(0,50).replace(/\n/g,' ')+'…':answer.replace(/\n/g,' ')}"</strong>反推，<br>`+
      `你能编出一道能得到这个答案的题目吗？<br><br>`+
      `<div style="background:var(--card-bg);padding:.6rem .8rem;border-radius:8px;border-left:3px solid #e74c3c">`+
      `💡 提示：从答案出发，想想什么样的题目条件或场景能得出这个答案。`+
      `这是从"解题"到"出题"的思维转换，最能检验是否真正理解。</div>`;
    l3Ans=`反向综合示范：<br>原题问的是"${content.length>80?content.substring(0,80).replace(/\n/g,' ')+'…':content.replace(/\n/g,' ')}"<br>从答案"${answer.length>60?answer.substring(0,60).replace(/\n/g,' ')+'…':answer.replace(/\n/g,' ')}"反推，<br>可以编一道：保持核心知识点不变，换一个生活场景来出题。`;
    l3Place='从答案反推，编一道新题…';
  }else{
    l3Content=`<strong>反向综合题：</strong>请自己出一道与本题知识点相同的题目，<br>`+
      `并解释你的出题思路。<br><br>`+
      `<div style="background:var(--card-bg);padding:.6rem .8rem;border-radius:8px;border-left:3px solid #e74c3c">`+
      `💡 从"做题者"变成"出题者"，把这道题的知识点用你自己的方式再表达一次。</div>`;
    l3Ans=`出题思路：<br>1. 确定核心知识点<br>2. 设计一个应用场景<br>3. 设置条件和问题<br>4. 制定评分标准`;
    l3Place='编一道新题并写出出题思路…';
  }
  const l3={
    title:'反向综合 · 思维提升',
    content:l3Content,
    placeholder:l3Place,
    answer:l3Ans,
    savedAnswer:''
  };
  return[l1,l2,l3];
}

// ===================== ANALYSIS =====================
let analysisChart=null;

function renderAnalysis(){
  const d=loadData();
  const qs=d.questions;
  if(!qs.length)return'<div class="empty-state"><i class="fas fa-chart-pie"></i><h5>还没有数据</h5><p>录入错题后查看分析报告</p></div>';
  
  // By error reason
  const reasonCount={};ERROR_REASONS.forEach(r=>reasonCount[r]=0);
  qs.forEach(q=>{if(reasonCount[q.error_reason]!==undefined)reasonCount[q.error_reason]++;});
  
  // By subject
  const subjCount={},subjMastered={};d.subjects.forEach(s=>{subjCount[s.id]=0;subjMastered[s.id]=0;});
  qs.forEach(q=>{if(subjCount[q.subject_id]!==undefined){subjCount[q.subject_id]++;if(q.mastery>=5)subjMastered[q.subject_id]++;}});
  
  // By chapter
  const chapWeak={};
  d.chapters.forEach(c=>chapWeak[c.id]=0);
  qs.forEach(q=>{if(q.chapter_id&&chapWeak[q.chapter_id]!==undefined&&q.mastery===0)chapWeak[q.chapter_id]++;});
  const weakChaps=Object.entries(chapWeak).filter(([_,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // By grade（年级维度）
  const gradeAgg={};
  qs.forEach(q=>{const k=(q.grade===undefined||q.grade===null||q.grade==='')?'none':String(q.grade);
    if(!gradeAgg[k])gradeAgg[k]={total:0,mastered:0};gradeAgg[k].total++;if(q.mastery>=5)gradeAgg[k].mastered++;});
  const gradeRows=[...GRADES.map(String),'none'].filter(k=>gradeAgg[k]);

  setTimeout(()=>{
    const canvas=document.getElementById('chartReason');
    if(!canvas)return;
    if(analysisChart)analysisChart.destroy();
    const ctx=canvas.getContext('2d');
    const labels=Object.keys(reasonCount).filter(k=>reasonCount[k]>0);
    const data=labels.map(k=>reasonCount[k]);
    const colors=['#f56565','#ecc94b','#4299e1','#9b59b6','#e67e22','#a0aec0'];
    analysisChart=new Chart(ctx,{type:'doughnut',data:{labels:labels.map(l=>l+`(${reasonCount[l]})`),datasets:[{data,backgroundColor:colors.slice(0,labels.length),borderWidth:0}]},
      options:{responsive:true,cutout:'60%',plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}});
  },50);

  return`<div class="chart-grid">
    <div class="chart-box"><h4>错因分布</h4><canvas id="chartReason" style="max-height:250px"></canvas></div>
    <div class="chart-box"><h4>科目统计</h4>
      <table class="analysis-table"><thead><tr><th>科目</th><th>错题</th><th>已掌握</th><th>掌握率</th></tr></thead>
      <tbody>${d.subjects.map(s=>{
        const total=subjCount[s.id]||0;
        const mastered=subjMastered[s.id]||0;
        return`<tr><td>${s.name}</td><td>${total}</td><td>${mastered}</td><td>${total?Math.round(mastered/total*100)+'%':'-'}</td></tr>`;
      }).join('')}</tbody></table></div>
  </div>
  <div class="card" style="margin-top:1rem">
    <div class="card-title"><i class="fas fa-graduation-cap" style="color:var(--primary)"></i> 年级维度统计</div>
    <table class="analysis-table"><thead><tr><th>年级</th><th>错题</th><th>已掌握</th><th>掌握率</th></tr></thead>
      <tbody>${gradeRows.map(k=>{const a=gradeAgg[k];
        return`<tr><td>${k==='none'?'未标注年级':k+'年级'}</td><td>${a.total}</td><td>${a.mastered}</td><td>${a.total?Math.round(a.mastered/a.total*100)+'%':'-'}</td></tr>`;
      }).join('')}</tbody></table>
    <p style="font-size:.8rem;color:var(--text-light);margin-top:.5rem">💡 跨年级错题可分开集中突破；点「错题本」用年级筛选查看</p>
  </div>
  <div class="card" style="margin-top:1rem">
    <div class="card-title"><i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i> 薄弱章节 TOP</div>
    ${weakChaps.length?`<table class="analysis-table"><thead><tr><th>章节</th><th>未掌握题数</th></tr></thead>
      <tbody>${weakChaps.map(([cid,cnt])=>{
        const chap=d.chapters.find(c=>c.id===parseInt(cid));
        const subj=chap?d.subjects.find(s=>s.id===chap.subject_id):null;
        return`<tr><td>${subj?subj.name+' · ':''}${chap?chap.name:'?'}</td><td><span style="color:var(--danger);font-weight:600">${cnt}</span></td></tr>`;
      }).join('')}</tbody></table>`:'<p style="color:var(--text-light)">暂无薄弱章节数据</p>'}
  </div>`;
}

// ===================== 复习筛选（「复习」页 与「复习要点」共用）=====================
// 五个维度：科目 / 年级 / 学期(上·下) / 月份 / 哪一周。
// 数据全部来自错题本身（subject_id / grade / created_at），不改数据、不做推断。
// 学期口径：9月~次年1月=上学期，2月~7月=下学期，8月(暑假)不计入学期筛选（只出现在「全部」）。
let RVF={subject:'all',grade:'all',term:'all',month:'all',week:'all'};
let rvfOpen=false;
function rvfSave(){try{localStorage.setItem('wrong_bank_review_filter_test',JSON.stringify(RVF));}catch(e){}}
function rvfLoad(){try{const j=JSON.parse(localStorage.getItem('wrong_bank_review_filter_test')||'null');if(j&&typeof j==='object')RVF=Object.assign({subject:'all',grade:'all',term:'all',month:'all',week:'all'},j);}catch(e){}
  if(RVF.term==='up'||RVF.term==='lower')RVF.term='all';   // 旧版学期值（上学期/下学期）已弃用
  rvfOpen=rvfHas();   // 上次的筛选还在生效时自动展开，避免"怎么只有一部分题"
}
function rvfWeekStart(dt){const x=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;}
function rvfHalf(dt){const m=dt.getMonth()+1;return (m>=9||m<=1)?'up':(m<=7?'lo':'');}   // 8月='' 不计入
function rvfTermKey(q){const dt=rvfDate(q);if(!dt)return'';const h=rvfHalf(dt);if(!h)return'';return ((q.grade==null||q.grade==='')?'none':String(q.grade))+'-'+h;}
function rvfSchoolYear(dt){const m=dt.getMonth()+1,y=dt.getFullYear();if(m>=9)return String(y).slice(2)+'秋';if(m<=1)return String(y-1).slice(2)+'秋';return String(y).slice(2)+'春';}
function rvfMonthKey(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function rvfDate(q){return ptsParseDate(q.created_at);}
function rvfList(list,skip){
  list=list||(loadData().questions||[]);
  return list.filter(function(q){
    const dt=rvfDate(q);
    if(skip!=='subject'&&RVF.subject!=='all'&&String(q.subject_id)!==String(RVF.subject))return false;
    if(skip!=='grade'&&RVF.grade!=='all'&&String(q.grade==null?'none':q.grade)!==String(RVF.grade))return false;
    if(skip!=='term'&&RVF.term!=='all'&&rvfTermKey(q)!==RVF.term)return false;
    if(skip!=='month'&&RVF.month!=='all'&&(!dt||rvfMonthKey(dt)!==RVF.month))return false;
    if(skip!=='week'&&RVF.week!=='all'&&(!dt||rvfWeekStart(dt).getTime()!==Number(RVF.week)))return false;
    return true;
  });
}
function rvfApply(list){return rvfList(list,null);}
function rvfHas(){return Object.keys(RVF).some(k=>RVF[k]!=='all');}
function rvfCount(list,fn){return list.filter(fn).length;}
function rvfSubjectOpts(){
  const d=loadData(),base=rvfList(null,'subject'),m={};
  base.forEach(q=>{m[q.subject_id]=(m[q.subject_id]||0)+1;});
  return (d.subjects||[]).filter(s=>m[s.id]).map(s=>({v:s.id,label:s.name,n:m[s.id]}));
}
function rvfGradeOpts(){
  const base=rvfList(null,'grade'),m={};
  base.forEach(q=>{const k=(q.grade==null?'none':q.grade);m[k]=(m[k]||0)+1;});
  return Object.keys(m).sort((a,b)=>(a==='none'?99:+a)-(b==='none'?99:+b))
    .map(k=>({v:k,label:(k==='none'?'未标注':k+'年级'),n:m[k]}));
}
function rvfTermOpts(){
  const base=rvfList(null,'term'),m={},yr={};
  base.forEach(function(q){
    const k=rvfTermKey(q);if(!k)return;
    m[k]=(m[k]||0)+1;
    const sy=rvfSchoolYear(rvfDate(q));
    if(!yr[k])yr[k]={};
    yr[k][sy]=1;
  });
  const keys=Object.keys(m).sort(function(a,b){
    const pa=a.split('-'),pb=b.split('-');
    const ga=(pa[0]==='none'?99:+pa[0]),gb=(pb[0]==='none'?99:+pb[0]);
    if(ga!==gb)return ga-gb;
    return pa[1]==='up'?-1:1;
  });
  const dup={};keys.forEach(k=>{if(Object.keys(yr[k]).length>1)dup[k]=1;});
  return keys.map(function(k){
    const p=k.split('-');
    const lab=(p[0]==='none'?'未标注年级':p[0]+'年级')+(p[1]==='up'?'上':'下');
    return {v:k,label:lab+(dup[k]?'（'+Object.keys(yr[k]).sort().join('/')+'）':''),n:m[k]};
  });
}
function rvfMonthOpts(){
  const base=rvfList(null,'month'),m={};
  base.forEach(q=>{const dt=rvfDate(q);if(dt){const k=rvfMonthKey(dt);m[k]=(m[k]||0)+1;}});
  return Object.keys(m).sort().reverse().map(k=>{
    const p=k.split('-');return {v:k,label:String(p[0]).slice(2)+'年'+Number(p[1])+'月',n:m[k]};
  });
}
function rvfWeekOpts(){
  const base=rvfList(null,'week'),m={};
  base.forEach(q=>{const dt=rvfDate(q);if(dt){const t=rvfWeekStart(dt).getTime();m[t]=(m[t]||0)+1;}});
  const now=rvfWeekStart(new Date()).getTime();
  return Object.keys(m).map(Number).sort((a,b)=>b-a).map(function(t){
    const s=new Date(t),e=new Date(t+6*86400000),diff=Math.round((now-t)/(7*86400000));
    const tag=diff===0?'本周':diff===1?'上周':diff+'周前';
    return {v:t,label:tag+'('+(s.getMonth()+1)+'/'+s.getDate()+'~'+(e.getMonth()+1)+'/'+e.getDate()+')',n:m[t]};
  });
}
function rvfChipRow(label,key,opts){
  if(!opts.length)return'';
  const all={v:'all',label:'全部',n:rvfList(null,key).length};
  return '<div class="rvf-row"><span class="rvf-lab">'+label+'</span>'
    +[all].concat(opts).map(o=>'<button class="rvf-chip'+(String(RVF[key])===String(o.v)?' active':'')
      +'" onclick="rvfSet(\''+key+'\',\''+o.v+'\')">'+o.label+'<i>'+o.n+'</i></button>').join('')+'</div>';
}
function rvfNames(){
  const n=[];
  if(RVF.subject!=='all'){const s=(loadData().subjects||[]).filter(x=>String(x.id)===String(RVF.subject))[0];n.push(s?s.name:'科目'+RVF.subject);}
  if(RVF.grade!=='all')n.push(RVF.grade==='none'?'未标注年级':RVF.grade+'年级');
  if(RVF.term!=='all'){const o=rvfTermOpts().filter(x=>String(x.v)===String(RVF.term))[0];n.push(o?o.label.replace(/（.*$/,''):'学期');}
  if(RVF.month!=='all'){const p=RVF.month.split('-');n.push(String(p[0]).slice(2)+'年'+Number(p[1])+'月');}
  if(RVF.week!=='all'){const o=rvfWeekOpts().filter(x=>String(x.v)===String(RVF.week))[0];
    n.push(o?o.label.replace(/\(.*/,''):'指定周');}
  return n;
}
function rvfPanel(){
  const total=(loadData().questions||[]).length,hit=rvfList(null,null).length,nm=rvfNames();
  let h='<div class="rvf-box"><div class="rvf-head" onclick="rvfToggle()">'
    +'<span><i class="fas fa-filter"></i> 筛选：<b>'+(nm.length?nm.join(' · '):'全部')+'</b></span>'
    +'<span class="rvf-note" style="margin:0">命中 <b>'+hit+'</b> / '+total+' 题　'
    +(nm.length?'<a href="javascript:void(0)" onclick="event.stopPropagation();rvfClear()" class="rvf-clr">清空</a> ':'')
    +'<span>'+(rvfOpen?'收起 ▲':'展开 ▼')+'</span></span></div>';
  if(rvfOpen){
    h+=rvfChipRow('科目','subject',rvfSubjectOpts());
    h+=rvfChipRow('年级','grade',rvfGradeOpts());
    h+=rvfChipRow('学期','term',rvfTermOpts());
    h+=rvfChipRow('月份','month',rvfMonthOpts());
    h+=rvfChipRow('哪一周','week',rvfWeekOpts());
    h+='<div class="rvf-note">时间按错题的<b>录入日期</b>筛；学期＝年级+上/下（如 8年级上），上下半按录入日期定：9~1月=上、2~7月=下、8月不计入；'
      +(nm.length?'<a href="javascript:rvfClear()" style="color:var(--primary)">清空筛选</a>':'勾选即生效，再点一次取消。')+'</div>';
  }
  h+='</div>';
  return h;
}
function rvfSet(k,v){RVF[k]=(String(RVF[k])===String(v))?'all':v;rvfSave();rvfRedraw();}
function rvfToggle(){rvfOpen=!rvfOpen;rvfRedraw();}
function rvfClear(){RVF={subject:'all',grade:'all',term:'all',month:'all',week:'all'};rvfSave();rvfRedraw();}
function rvfRedraw(){
  if(currentPage==='points')document.getElementById('app').innerHTML=renderPoints();
  else if(currentPage==='review')document.getElementById('app').innerHTML=renderReview();
  else render(currentPage);
}

// ===================== 复习要点（AI错题本）=============================
// 四个板块＝四种复习节奏，各自的"汇总维度"不同（避免四块内容雷同）：
//   A 周复习   → 按错因（本周错在哪类）
//   B 月复习   → 按科目（各科薄弱在哪）
//   C 半期复习 → 按考点（章节化归并，抓高频考点）
//   D 期末复习 → 全量补漏（逐考点：关联错因 + 典型易错 + 全部题号）
// 内容 100% 由真实字段聚合：error_reason / tags / ana5.pitfall / ana5.points /
// mastery / review_count / created_at。不做猜测、不改写，每条结论都标来源题号可点开核对。
const POINTS_BLOCKS=[
  {key:'week', label:'A 周复习', days:7, axis:'error',   dim:'按错因',
   tip:'每周末 30 分钟：先纠错因，再重做本周错题'},
  {key:'month',label:'B 月复习', days:30, axis:'subject', dim:'按科目',
   tip:'每月末：按科目过一遍，定位各科薄弱环节'},
  {key:'half', label:'C 半期复习', days:90, axis:'point', dim:'按考点',
   tip:'期中考前一周：按考点归并，主攻高频考点'},
  {key:'final',label:'D 期末复习', days:0, axis:'full',   dim:'全量补漏',
   tip:'期末考前两周：逐考点补漏，把没复习过的清掉'}
];
let pointsBlock='week';
const PTS_SUBJ=['数学','物理','化学','语文','英语','历史','地理','生物','道法','政治'];

function ptsSpec(bk){const a=POINTS_BLOCKS.filter(b=>b.key===bk);return a.length?a[0]:POINTS_BLOCKS[0];}
function ptsParseDate(s){
  const m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(s||''));
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
function ptsSubjName(d,id){const s=(d.subjects||[]).filter(x=>x.id===id);return s.length?s[0].name:'未分科目';}
function ptsTags(q){return String(q.tags||'').split(',').map(x=>x.trim()).filter(x=>x&&PTS_SUBJ.indexOf(x)<0);}
function ptsErr(q){const k=String(q.error_reason||'').trim();return k||'未标注错因';}
function ptsErrShow(k){return (k==='其他'||k==='未标注错因')?k+'（原记录未细分）':k;}
function ptsTop(obj,n){return Object.keys(obj).sort((a,b)=>obj[b]-obj[a]).slice(0,n).map(k=>[k,obj[k]]);}
function ptsCount(list){const o={};list.forEach(x=>{o[x]=(o[x]||0)+1;});return o;}
function ptsQids(ids){return ids.slice(0,8).map(i=>`<span class="pts-q" onclick="navigate('detail',{qid:${i}})">#${i}</span>`).join('');}
function ptsPitfall(q){
  const p=String(((q.ana5||{}).pitfall)||'');if(!p)return'';
  const lines=p.split('\n').map(s=>s.trim()).filter(Boolean);let t='';
  for(let i=0;i<lines.length;i++){
    const m=/^(易错点|常见错法|错在哪|错误原因)[:：]\s*(.+)$/.exec(lines[i]);
    if(m){t=m[2];break;}
  }
  if(!t)t=(lines[0]||'').replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/,'');
  return t.replace(/^(易错点|常见错法|错在哪|错误原因)[:：]\s*/,'').replace(/^[0-9]+[.、]\s*/,'').replace(/[。；;]$/,'').trim();
}
function ptsPoints(q){return String(((q.ana5||{}).points)||'').split('\n').map(s=>s.trim()).filter(Boolean);}
function ptsWindow(bk){
  const d=loadData(),spec=ptsSpec(bk),all=d.questions||[];
  // 用户在筛选里指定了 学期/月份/哪一周 → 时间范围以用户选的为准，板块不再叠加自己的天数窗口
  const userTime=(RVF.week!=='all'||RVF.month!=='all'||RVF.term!=='all');
  let qs=all;
  if(spec.days>0&&!userTime){
    const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    qs=all.filter(q=>{const t=ptsParseDate(q.created_at);return t&&Math.round((t0-t)/86400000)<=spec.days;});
  }
  const f=rvfApply(qs);
  return {spec:spec,qs:f,allCount:all.length,d:d,thinner:f.length<all.length,filtered:f.length!==qs.length,userTime:userTime};
}
function ptsRangeText(w){
  const st=ptsCount(w.qs.map(q=>ptsSubjName(w.d,q.subject_id)));
  let s=w.spec.days>0?'近 '+w.spec.days+' 天':'全部';
  if(w.qs.length){
    const ds=w.qs.map(q=>String(q.created_at||'').slice(0,10)).filter(Boolean).sort();
    if(ds.length)s+='（'+ds[0]+' ~ '+ds[ds.length-1]+'）';
  }
  s+=' · <b>'+w.qs.length+'</b> 题';
  if(w.qs.length)s+=' · '+Object.keys(st).sort((a,b)=>st[b]-st[a]).map(k=>k+' '+st[k]).join(' / ');
  if(w.thinner)s+=' · <span class="pts-note">（共 '+w.allCount+' 题，其余不在本板块时间范围内）</span>';
  return s;
}

/* ① 学习上的弱点 —— 四种维度 */
function ptsWeaknessHtml(w){
  const qs=w.qs,d=w.d,ax=w.spec.axis;
  if(!qs.length)return'<div class="pts-empty">还没有错题。</div>';
  let h='';
  if(ax==='error'){
    const errs=ptsCount(qs.map(ptsErr));
    ptsTop(errs,4).forEach(function(pr){
      const k=pr[0],v=pr[1],inQ=qs.filter(q=>ptsErr(q)===k);
      const tags=ptsTop(ptsCount([].concat.apply([],inQ.map(ptsTags))),3).map(x=>x[0]);
      const sj=[];inQ.forEach(q=>{const n=ptsSubjName(d,q.subject_id);if(sj.indexOf(n)<0)sj.push(n);});
      h+=`<div class="pts-item"><b>${ptsErrShow(k)}</b><span class="pts-badge">${v} 题 · 占 ${Math.round(v/qs.length*100)}%</span><br>`
        +`<span class="pts-note">集中在：${sj.join('、')}${tags.length?'（'+tags.join('、')+'）':''}　来源：${ptsQids(inQ.map(q=>q.id))}</span></div>`;
    });
  }else if(ax==='subject'){
    const sj=[];qs.forEach(q=>{const n=ptsSubjName(d,q.subject_id);if(sj.indexOf(n)<0)sj.push(n);});
    sj.sort((a,b)=>qs.filter(q=>ptsSubjName(d,q.subject_id)===b).length-qs.filter(q=>ptsSubjName(d,q.subject_id)===a).length);
    sj.forEach(function(n){
      const inQ=qs.filter(q=>ptsSubjName(d,q.subject_id)===n);
      const errs=ptsTop(ptsCount(inQ.map(ptsErr)),3).map(x=>x[0]+'×'+x[1]).join('、');
      const tags=ptsTop(ptsCount([].concat.apply([],inQ.map(ptsTags))),4).map(x=>x[0]);
      h+=`<div class="pts-item"><b>${n}</b><span class="pts-badge">${inQ.length} 题 · 占 ${Math.round(inQ.length/qs.length*100)}%</span><br>`
        +`<span class="pts-note">主要错因：${errs}<br>涉及考点：${tags.join('、')||'（未打标签）'}<br>来源：${ptsQids(inQ.map(q=>q.id))}</span></div>`;
    });
  }else if(ax==='point'){
    const ks=ptsKeyData(qs,d).slice(0,5);
    ks.forEach(function(o){
      const inQ=qs.filter(q=>ptsTags(q).indexOf(o.name)>=0);
      const errs=ptsTop(ptsCount(inQ.map(ptsErr)),2).map(x=>ptsErrShow(x[0])+'×'+x[1]).join('、');
      h+=`<div class="pts-item"><b>${o.name}</b><span class="pts-badge">${o.n} 次错</span><br>`
        +`<span class="pts-note">错因：${errs}${o.pitfall?'<br>典型易错：'+o.pitfall:''}　来源：${ptsQids(o.ids)}</span></div>`;
    });
  }else{
    const errs=ptsCount(qs.map(ptsErr));
    ptsTop(errs,5).forEach(function(pr){
      const inQ=qs.filter(q=>ptsErr(q)===pr[0]);
      const tags=ptsTop(ptsCount([].concat.apply([],inQ.map(ptsTags))),4).map(x=>x[0]);
      h+=`<div class="pts-item"><b>${ptsErrShow(pr[0])}</b><span class="pts-badge">${pr[1]} 题 · 占 ${Math.round(pr[1]/qs.length*100)}%</span><br>`
        +`<span class="pts-note">涉及考点：${tags.join('、')||'（未打标签）'}　来源：${ptsQids(inQ.map(q=>q.id))}</span></div>`;
    });
  }
  const zero=qs.filter(q=>!(q.mastery>0)).length,noRev=qs.filter(q=>!(q.review_count>0)).length;
  h+=`<div class="pts-item"><b>掌握度</b>：`+(zero===qs.length&&noRev===qs.length
    ? `<b>${qs.length}</b> 题全部为 0 级（均未复习）`
    : `<b>${zero}</b> / ${qs.length} 题仍为 0 级<span class="pts-badge">${noRev} 题从未复习</span>`)+`</div>`;
  return h;
}

/* ② 易错点（五维「易错点」原文，不动一个字） */
function ptsPitfallData(qs){
  const map={};
  qs.forEach(function(q){
    const t=ptsPitfall(q);if(!t)return;
    const k=t.replace(/[\s，,。、；;：:（）()【】「」]/g,'').slice(0,14);
    if(!map[k])map[k]={text:t,ids:[],tags:ptsTags(q).slice(0,2)};
    map[k].ids.push(q.id);
  });
  const arr=Object.keys(map).map(k=>map[k]).sort((a,b)=>b.ids.length-a.ids.length);
  return {arr:arr,covered:qs.filter(q=>ptsPitfall(q)).length,total:qs.length};
}
function ptsPitfallHtml(w){
  const qs=w.qs,ax=w.spec.axis;
  if(!qs.length)return'<div class="pts-empty">还没有错题。</div>';
  const r=ptsPitfallData(qs);
  const noAna=qs.length-r.covered;
  if(!r.arr.length)return`<div class="pts-empty">这 ${r.total} 道题的「易错点」还没填写，可在错题详情里点「编辑」补上。</div>`;
  let h='';
  if(ax==='point'){
    const ks=ptsKeyData(qs,w.d);
    let shown=0;
    ks.forEach(function(o){
      if(shown>=6)return;
      const inQ=qs.filter(q=>ptsTags(q).indexOf(o.name)>=0);
      const pr=ptsPitfallData(inQ).arr.slice(0,2);
      if(!pr.length)return;shown++;
      h+=`<div class="pts-item"><b>${o.name}</b><br>`
        +pr.map(x=>`<span class="pts-note">· ${x.text}${x.ids.length>1?'（'+x.ids.length+' 题）':''}</span>`).join('<br>')
        +`<br><span class="pts-note">来源：${ptsQids(inQ.map(q=>q.id))}</span></div>`;
    });
  }else{
    const n=(ax==='full')?15:8;
    r.arr.slice(0,n).forEach(function(o){
      h+=`<div class="pts-item">${o.text}${o.ids.length>1?`<span class="pts-badge">${o.ids.length} 题</span>`:''}<br>`
        +`<span class="pts-note">来源：${ptsQids(o.ids)}${o.tags.length?'　考点：'+o.tags.join('、'):''}</span></div>`;
    });
    if(r.arr.length>n)h+=`<div class="pts-note" style="margin-top:.4rem">另有 ${r.arr.length-n} 条已按同类合并，未逐条展开。</div>`;
  }
  if(noAna)h+=`<div class="pts-note" style="margin-top:.4rem">另有 ${noAna} 题未填写五维分析，未纳入统计。</div>`;
  return h;
}

/* ③ 重点（考点标签按命中次数） */
function ptsKeyData(qs,d){
  const map={};
  qs.forEach(function(q){
    ptsTags(q).forEach(function(t){
      if(!map[t])map[t]={n:0,ids:[],subjects:[],pitfall:''};
      if(map[t].ids.indexOf(q.id)<0){
        map[t].n++;map[t].ids.push(q.id);
        const sn=d?ptsSubjName(d,q.subject_id):'';
        if(sn&&map[t].subjects.indexOf(sn)<0)map[t].subjects.push(sn);
      }
      if(!map[t].pitfall)map[t].pitfall=ptsPitfall(q);
    });
  });
  return Object.keys(map).sort((a,b)=>map[b].n-map[a].n).map(k=>{const o=map[k];o.name=k;return o;});
}
function ptsKeyHtml(w){
  const ks=ptsKeyData(w.qs,w.d);
  if(!w.qs.length)return'<div class="pts-empty">还没有错题。</div>';
  if(!ks.length)return'<div class="pts-empty">还没有带考点标签的错题，先给错题打上考点标签。</div>';
  const sum=ks.reduce((a,b)=>a+b.n,0);
  const n=(w.spec.axis==='full')?20:((w.spec.axis==='error')?6:10);
  const list=(w.spec.axis==='full'||w.spec.axis==='point')?ks:ks.slice(0,n);
  let h=`<div class="pts-item">考点清单${list.length<ks.length?'（前 '+list.length+' 个／共 '+ks.length+' 个）':'（共 '+ks.length+' 个）'}，按错题命中次数排序</div>`;
  list.forEach(function(o,i){
    h+=`<div class="pts-item">${i+1}. <b>${o.name}</b><span class="pts-badge">${o.n} 题</span><br>`
      +`<span class="pts-note">${o.pitfall?'典型易错：'+o.pitfall+'<br>':''}来源：${ptsQids(o.ids)}</span></div>`;
  });
  h+=`<div class="pts-note" style="margin-top:.4rem">共 ${ks.length} 个考点标签、${sum} 次命中（同一题多个考点会重复计入）。</div>`;
  return h;
}

/* ④ 应该补充学习的内容 */
function ptsTodoHtml(w){
  const qs=w.qs,d=w.d,ax=w.spec.axis;
  if(!qs.length)return'<div class="pts-empty">还没有错题。</div>';
  const ks=ptsKeyData(qs,d);
  if(!ks.length)return'<div class="pts-empty">还没有带考点标签的错题，先给错题打上考点标签。</div>';
  let h='';
  if(ax==='subject'){
    const sj=[];qs.forEach(q=>{const n=ptsSubjName(d,q.subject_id);if(sj.indexOf(n)<0)sj.push(n);});
    sj.forEach(function(n){
      const inQ=qs.filter(q=>ptsSubjName(d,q.subject_id)===n);
      const tk=ptsTop(ptsCount([].concat.apply([],inQ.map(ptsTags))),3);
      if(!tk.length)return;
      h+=`<div class="pts-item"><b>${n}</b><span class="pts-badge">优先补 ${tk.length} 个考点</span><br>`
        +`<span class="pts-note">`+tk.map(x=>`「${x[0]}」${x[1]} 题`).join('、')+`<br>做法：把该考点下这 ${inQ.length} 题重做一遍（错因已标在详情里）。</span></div>`;
    });
  }else{
    const n=(ax==='full')?12:(ax==='point'?8:5);
    ks.slice(0,n).forEach(function(o,i){
      const inQ=qs.filter(q=>ptsTags(q).indexOf(o.name)>=0);
      const errs=ptsTop(ptsCount(inQ.map(ptsErr)),2).map(x=>ptsErrShow(x[0])+'×'+x[1]).join('、');
      const rev=inQ.filter(q=>!(q.review_count>0)).length;
      h+=`<div class="pts-item"><b>${i+1}. ${o.name}</b><span class="pts-badge">${o.n} 题${rev?' · '+rev+' 题未复习':''}</span><br>`
        +`<span class="pts-note">错因：${errs}${o.pitfall?'<br>先解决：'+o.pitfall:''}<br>来源：${ptsQids(o.ids)}</span></div>`;
    });
  }
  if(ax==='error'){
    h+=`<div class="pts-note" style="margin-top:.4rem">排序依据：考点在错题里命中的次数（次数越多越该先补）。</div>`;
  }else if(ax==='full'){
    h+=`<div class="pts-note" style="margin-top:.4rem">全量清单：${ks.length} 个考点全部列出，按命中次数排序；标「未复习」的题请优先重做。</div>`;
  }else if(ax==='point'){
    h+=`<div class="pts-note" style="margin-top:.4rem">按考点归并：同一考点的错题一起处理，比重做单题更省时间。</div>`;
  }
  return h;
}

function renderPoints(){
  const w=ptsWindow(pointsBlock),sp=w.spec;
  const tabs=POINTS_BLOCKS.map(b=>
    `<button class="pts-tab${b.key===pointsBlock?' active':''}" onclick="pointsBlock='${b.key}';document.querySelector('#app').innerHTML=renderPoints()">${b.label}</button>`).join('');
  return rvfPanel()+`<div class="card">
    <div class="pts-title"><i class="fas fa-clipboard-check" style="color:var(--primary)"></i> 复习要点</div>
    <div class="pts-range" style="margin-bottom:.7rem">按复习节奏分四个板块，内容自动汇总自错题本里的题（错因 / 易错点 / 考点标签 / 掌握度），<b>每条都标来源题号，可点开核对</b>。「考点标签」＝录入时打的标签，不用打＝没标签先补。</div>
    <div class="pts-tabs">${tabs}</div>
    <div class="pts-range"><b>${sp.label}</b>　${sp.dim}汇总　范围：${ptsRangeText(w)}${w.userTime?'　<span class="pts-note">（时间范围＝上方筛选的学期/月/周）</span>':(w.filtered?'　<span class="pts-note">（已套用上方筛选）</span>':'')}<br>💡 ${sp.tip}</div>
    <div class="pts-card c1"><h5>1️⃣ 学习上的弱点（${sp.dim}）</h5>${ptsWeaknessHtml(w)}</div>
    <div class="pts-card c2"><h5>2️⃣ 易错点${sp.axis==='point'?'（按考点归并）':''}</h5>${ptsPitfallHtml(w)}</div>
    <div class="pts-card c3"><h5>3️⃣ 重点（高频考点${sp.axis==='full'?'全量':' Top'}）</h5>${ptsKeyHtml(w)}</div>
    <div class="pts-card c4"><h5>4️⃣ 应该补充学习的内容</h5>${ptsTodoHtml(w)}</div>
  </div>`;
}

// 数据层/渲染函数与原页完全同源；localStorage 键与云端后端也一致 ⇒ 两页数据互通：
// 在原错题库录入或复习的题，这里立刻可见；反之亦然。
let _aiLastNbPage = 'dashboard';
function _aiTopTabOf(page){ return page === 'training' ? 'training' : (page === 'points' ? 'points' : 'notebook'); }
function _aiApplyTopTab(page){
  const t = _aiTopTabOf(page);
  document.querySelectorAll('#topTabs .top-tab').forEach(b => b.classList.toggle('active', b.dataset.top === t));
  const mn = document.getElementById('mainNav');
  if (mn) mn.style.display = (t === 'notebook') ? 'flex' : 'none';   // 三层训练/复习要点页隐藏错题本子导航
  document.body.setAttribute('data-domain', t);
}
function switchTop(tab){
  if (tab === 'training') { navigate('training', {}); return; }
  if (tab === 'points')   { navigate('points'); return; }
  navigate(_aiLastNbPage || 'dashboard');
}
const _aiNavigateBase = navigate;
navigate = function(page, data){
  _aiNavigateBase(page, data);
  if (page !== 'training' && page !== 'points') _aiLastNbPage = (page === 'detail') ? 'list' : page;  // detail 需带参，不记忆
  _aiApplyTopTab(page);
};
