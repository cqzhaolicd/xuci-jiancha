<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学错题三层训练系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #333; line-height: 1.7; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 30px; border-radius: 16px; margin-bottom: 24px; text-align: center; }
  header h1 { font-size: 26px; margin-bottom: 8px; }
  header p { opacity: .85; font-size: 14px; }
  .layer-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .layer-tab { flex: 1; min-width: 100px; padding: 10px 16px; border: 2px solid #ddd; border-radius: 10px; background: #fff; cursor: pointer; text-align: center; font-size: 14px; font-weight: 600; transition: all .2s; }
  .layer-tab:hover { border-color: #667eea; }
  .layer-tab.active { border-color: #667eea; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .layer-tab .badge { display: inline-block; background: #ff6b6b; color: #fff; border-radius: 20px; padding: 0 8px; font-size: 11px; margin-left: 4px; }
  .layer-tab.active .badge { background: rgba(255,255,255,.3); }
  .questions { display: none; }
  .questions.active { display: block; }
  .question-card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border-left: 4px solid #667eea; }
  .question-card.marked { border-left-color: #ff6b6b; background: #fff5f5; }
  .q-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .q-title .level { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 8px; font-weight: 400; }
  .level-L1 { background: #e8f5e9; color: #2e7d32; }
  .level-L2 { background: #fff3e0; color: #e65100; }
  .level-L3 { background: #fce4ec; color: #c62828; }
  .q-text { margin-bottom: 12px; font-size: 15px; }
  .q-answer-input { width: 100%; min-height: 60px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; font-family: inherit; margin-bottom: 10px; }
  .q-answer-input:focus { outline: none; border-color: #667eea; }
  .q-answer { display: none; background: #f0f4ff; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 14px; border-left: 3px solid #667eea; }
  .q-answer.show { display: block; }
  .q-answer strong { color: #667eea; }
  .q-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 6px 14px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all .2s; font-weight: 500; }
  .btn-answer { background: #667eea; color: #fff; }
  .btn-answer:hover { background: #5a6fd6; }
  .btn-mark { background: #ff6b6b; color: #fff; }
  .btn-mark:hover { background: #e55a5a; }
  .btn-mark.marked { background: #495057; }
  .btn-mark.marked:hover { background: #343a40; }
  .btn-correct { background: #51cf66; color: #fff; }
  .btn-correct:hover { background: #40c057; }
  .summary-bar { position: sticky; bottom: 0; background: #fff; border-radius: 14px 14px 0 0; padding: 14px 20px; box-shadow: 0 -2px 12px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .summary-bar .stat { font-size: 14px; }
  .summary-bar .stat span { font-weight: 700; color: #667eea; }
  .btn-save { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 10px 20px; font-size: 14px; border-radius: 8px; }
  .btn-save:hover { opacity: .9; }
  .btn-reset { background: #868e96; color: #fff; }
  .btn-reset:hover { background: #727b84; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 100; justify-content: center; align-items: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 24px; }
  .modal h2 { font-size: 20px; margin-bottom: 16px; }
  .modal .close-btn { float: right; background: none; border: none; font-size: 24px; cursor: pointer; color: #868e96; }
  .modal .close-btn:hover { color: #333; }
  .modal .error-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
  .modal .error-item:last-child { border-bottom: none; }
  .modal .error-item .q-no { font-weight: 700; color: #ff6b6b; }
  .modal .empty-msg { text-align: center; color: #868e96; padding: 30px; }
  .progress-stats { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 120px; background: #fff; border-radius: 10px; padding: 14px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
  .stat-card .num { font-size: 28px; font-weight: 700; color: #667eea; }
  .stat-card .label { font-size: 12px; color: #868e96; margin-top: 4px; }
  .stat-card.marked-stat .num { color: #ff6b6b; }
  @media (max-width: 600px) {
    .container { padding: 12px; }
    header { padding: 20px; }
    header h1 { font-size: 20px; }
    .layer-tab { font-size: 12px; padding: 8px 10px; min-width: 80px; }
    .question-card { padding: 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📐 数学错题三层训练</h1>
    <p>基础同构 → 条件变化 → 反向综合 · 逐层攻克薄弱点</p>
  </header>

  <div class="progress-stats">
    <div class="stat-card"><div class="num" id="totalCount">8</div><div class="label">总题数</div></div>
    <div class="stat-card"><div class="num" id="answeredCount">0</div><div class="label">已作答</div></div>
    <div class="stat-card marked-stat"><div class="num" id="markedCount">0</div><div class="label">标记错题</div></div>
  </div>

  <div class="layer-tabs" id="layerTabs">
    <div class="layer-tab active" data-layer="all">全部 <span class="badge">8</span></div>
    <div class="layer-tab" data-layer="L1">🌟 基础同构 <span class="badge">3</span></div>
    <div class="layer-tab" data-layer="L2">🔥 条件变化 <span class="badge">3</span></div>
    <div class="layer-tab" data-layer="L3">🚀 反向综合 <span class="badge">2</span></div>
  </div>

  <div id="questionsContainer"></div>

  <div class="summary-bar">
    <div class="stat">已标记 <span id="barMarked">0</span> 道错题</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-save" onclick="showErrorList()">📋 生成错题清单</button>
      <button class="btn btn-reset" onclick="resetAll()">🔄 重新开始</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">×</button>
    <h2>📋 错题清单</h2>
    <div id="errorList"></div>
  </div>
</div>

<script>
const questions = [
  // ===== 初一 基础同构 =====
  {
    id: 1, layer: 'L1', grade: '初一',
    title: '【基础同构】有理数混合运算',
    text: '计算：(-2)³ + (-3) × [(-4)² + 2] - 5 ÷ (-1)',
    answer: '(-2)³ = -8<br>(-4)² = 16<br>(-4)² + 2 = 18<br>(-3) × 18 = -54<br>5 ÷ (-1) = -5<br>原式 = -8 + (-54) - (-5) = -8 - 54 + 5 = -57'
  },
  {
    id: 2, layer: 'L1', grade: '初一',
    title: '【基础同构】一元一次方程',
    text: '解方程：3(x - 2) + 5 = 2(2x + 1) - 1',
    answer: '3x - 6 + 5 = 4x + 2 - 1<br>3x - 1 = 4x + 1<br>3x - 4x = 1 + 1<br>-x = 2<br>x = -2'
  },
  {
    id: 3, layer: 'L1', grade: '初二',
    title: '【基础同构】整式乘除',
    text: '计算：(2a + 3b)(2a - 3b) - (a - 2b)²',
    answer: '(2a + 3b)(2a - 3b) = 4a² - 9b²<br>(a - 2b)² = a² - 4ab + 4b²<br>原式 = (4a² - 9b²) - (a² - 4ab + 4b²)<br>= 4a² - 9b² - a² + 4ab - 4b²<br>= 3a² + 4ab - 13b²'
  },
  // ===== 初二 条件变化 =====
  {
    id: 4, layer: 'L2', grade: '初二',
    title: '【条件变化】勾股定理',
    text: '在Rt△ABC中，∠C=90°，AC=6，BC=8，CD是斜边AB上的高，求CD的长。',
    answer: '由勾股定理：AB² = AC² + BC² = 36 + 64 = 100<br>∴ AB = 10<br>由面积法：S = ½×AC×BC = ½×AB×CD<br>∴ ½×6×8 = ½×10×CD<br>24 = 5CD<br>CD = 4.8'
  },
  {
    id: 5, layer: 'L2', grade: '初二',
    title: '【条件变化】一次函数',
    text: '已知一次函数 y = kx + b 的图像经过点 A(1, 5) 和点 B(-2, -1)，求这个一次函数的表达式，并求它与两坐标轴围成的三角形面积。',
    answer: '代入A、B：<br>5 = k + b<br>-1 = -2k + b<br>相减：6 = 3k → k = 2<br>代入：b = 5 - 2 = 3<br>∴ y = 2x + 3<br>与x轴：y=0时 2x+3=0 → x=-1.5<br>与y轴：x=0时 y=3<br>S = ½ × 1.5 × 3 = 2.25'
  },
  {
    id: 6, layer: 'L2', grade: '初三',
    title: '【条件变化】相似三角形',
    text: '如图，在△ABC中，DE∥BC，AD:DB=2:3，△ABC的面积为50，求△ADE的面积。',
    answer: '∵ DE∥BC ∴ △ADE ∽ △ABC<br>AD:AB = 2:(2+3) = 2:5<br>相似比 k = 2/5<br>面积比 = k² = 4/25<br>S△ADE = 50 × 4/25 = 8'
  },
  // ===== 初三 反向综合 =====
  {
    id: 7, layer: 'L3', grade: '初三',
    title: '【反向综合】二次函数最值',
    text: '已知二次函数 y = -x² + 2mx + 3 在 x ≤ 2 时 y 随 x 增大而增大，求 m 的取值范围。',
    answer: '对称轴：x = -b/(2a) = -2m/(2×(-1)) = m<br>a = -1 < 0，开口向下<br>在对称轴左侧 y 随 x 增大而增大<br>∴ x ≤ 2 应在对称轴左侧<br>即 2 ≤ m<br>∴ m ≥ 2'
  },
  {
    id: 8, layer: 'L3', grade: '初三',
    title: '【反向综合】圆与相似综合',
    text: '已知⊙O的直径AB=10，弦CD⊥AB于点E，且AE:EB=1:4，求CD的长。',
    answer: 'AB=10，半径 r=5<br>AE:EB=1:4 ∴ AB=5份=10<br>AE=2，EB=8<br>OE = AE - OA = 2 - 5 = -3（或OE = OA - AE = 3）<br>连OC：CE² = OC² - OE² = 25 - 9 = 16<br>CE = 4<br>CD = 2CE = 8'
  }
];

let state = {
  answers: new Array(questions.length).fill(''),
  showAnswer: new Array(questions.length).fill(false),
  marked: new Array(questions.length).fill(false),
  currentLayer: 'all'
};

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  let html = '';
  const filtered = state.currentLayer === 'all'
    ? questions
    : questions.filter(q => q.layer === state.currentLayer);

  filtered.forEach((q, idx) => {
    const realIdx = questions.indexOf(q);
    html += `
      <div class="question-card ${state.marked[realIdx] ? 'marked' : ''}" data-index="${realIdx}">
        <div class="q-title">
          <span class="level level-${q.layer}">${q.layer === 'L1' ? '基础' : q.layer === 'L2' ? '提升' : '挑战'}</span>
          ${q.title} <span style="font-weight:400;font-size:12px;color:#868e96;">${q.grade}</span>
        </div>
        <div class="q-text">${q.text}</div>
        <textarea class="q-answer-input" placeholder="在此输入你的解答..." oninput="saveAnswer(${realIdx}, this.value)">${state.answers[realIdx]}</textarea>
        <div class="q-answer ${state.showAnswer[realIdx] ? 'show' : ''}">
          <strong>参考答案：</strong><br>${q.answer}
        </div>
        <div class="q-actions">
          <button class="btn btn-answer" onclick="toggleAnswer(${realIdx})">${state.showAnswer[realIdx] ? '隐藏答案' : '查看答案'}</button>
          <button class="btn btn-mark ${state.marked[realIdx] ? 'marked' : ''}" onclick="toggleMark(${realIdx})">
            ${state.marked[realIdx] ? '✅ 已标记' : '📌 标记错题'}
          </button>
          <button class="btn btn-correct" onclick="markCorrect(${realIdx})">✅ 做对了</button>
        </div>
      </div>`;
  });
  container.innerHTML = html;
  updateStats();
}

function saveAnswer(idx, val) {
  state.answers[idx] = val;
  updateStats();
}

function toggleAnswer(idx) {
  state.showAnswer[idx] = !state.showAnswer[idx];
  renderQuestions();
}

function toggleMark(idx) {
  state.marked[idx] = !state.marked[idx];
  renderQuestions();
}

function markCorrect(idx) {
  state.marked[idx] = false;
  state.showAnswer[idx] = true;
  renderQuestions();
}

function updateStats() {
  const answered = state.answers.filter(a => a.trim() !== '').length;
  const marked = state.marked.filter(m => m).length;
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('markedCount').textContent = marked;
  document.getElementById('barMarked').textContent = marked;
}

function showErrorList() {
  const modal = document.getElementById('modalOverlay');
  const list = document.getElementById('errorList');
  const marked = questions.filter((q, i) => state.marked[i]);
  if (marked.length === 0) {
    list.innerHTML = '<div class="empty-msg">🎉 太棒了！当前没有标记错题！</div>';
  } else {
    list.innerHTML = marked.map(q => `
      <div class="error-item">
        <span class="q-no">🔴 ${q.title}</span>（${q.grade}）
        <div style="margin:4px 0;color:#555;">${q.text}</div>
        <div style="font-size:12px;color:#667eea;"><strong>参考答案：</strong>${q.answer.replace(/<br>/g, ' | ')}</div>
      </div>
    `).join('');
  }
  modal.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function resetAll() {
  if (!confirm('确定要重新开始吗？所有作答和标记将被清空。')) return;
  state.answers = new Array(questions.length).fill('');
  state.showAnswer = new Array(questions.length).fill(false);
  state.marked = new Array(questions.length).fill(false);
  renderQuestions();
}

// Layer tabs
document.getElementById('layerTabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.layer-tab');
  if (!tab) return;
  document.querySelectorAll('.layer-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  state.currentLayer = tab.dataset.layer;
  renderQuestions();
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init
renderQuestions();
</script>
<script>
// 点击音效
(function(){try{var ac;document.addEventListener('click',function(e){var t=e.target.closest('button, a, .option, .tab-btn, .subject-header, .section-title, .check-item, .navbar-nav a, .btn, .flashcard, .layer-tab, .q-header');if(t){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=700;o.type='sine';g.gain.setValueAtTime(0.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.06);o.start(ac.currentTime);o.stop(ac.currentTime+0.06)}catch(e2){}}})}catch(e){}})();
</script>

</body>
</html>
