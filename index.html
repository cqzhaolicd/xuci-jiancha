  document.getElementById("info").innerHTML = "<span>字：" + d.w + " · 第" + d.i + "组</span><span>已完成 " + c + "/" + total + "</span>";
  document.getElementById("pos").textContent = (idx+1) + "/" + total;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === total - 1;
  var html = '<div class="crd">';
  html += '<div class="hd"><span class="num">' + (idx+1) + '</span><span class="wd">' + d.w + '</span>';
  if (st === "ok") html += '<span style="background:#27ae60;color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;font-family:sans-serif">\u2714已掌握</span>';
  html += '</div>';
  html += '<div style="font-size:11px;color:#8b5a2b;font-weight:700;font-family:sans-serif">完整原文：</div>';
  html += '<div class="src">' + d.s + '</div>';
  html += '<div class="q">' + d.q + '</div>';
  html += '<div class="opts">';
  d.o.forEach(function(o, oi) {
    var cls = "opt";
    if (st === "ok" || done[idx] === "no") cls += " d";
    if (st === "ok" && oi === d.a) cls += " ok";
    else if (st === "ok") cls += " no";
    else if (done[idx] === "no" && oi === d.a) cls += " ok";
    else if (done[idx] === "no") cls += " no";
    html += '<div class="' + cls + '" onclick="pick(' + idx + ',' + oi + ')">' + o + '</div>';
  });
  html += '</div>';
  if (st === "ok") html += '<div class="fb ok">\u2705 正确！</div>';
  if (done[idx] === "no") {
    var correct = d.o[d.a];
    html += '<div class="fb no">\u274c 正确答案是：' + correct + '</div>';
  }
  html += '</div>';
  document.getElementById("main").innerHTML = html;
}
function pick(id, oi) {
  if (done[id]) return;
  if (oi === D[id].a) { done[id] = "ok"; }
  else { done[id] = "no"; }
  render();
}
function go(d) {
  var next = idx + d;
  if (next < 0 || next >= D.length) return;
  idx = next;
  render();
}
render();
</script>
</body>
</html>
