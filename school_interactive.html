<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 互动学习</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#667eea;--secondary:#764ba2;--success:#48bb78;--warning:#ecc94b;--danger:#f56565;--info:#4299e1;--bg:#f0f2f5;--card-bg:#fff;--text:#1a202c;--text-light:#718096;--border:#e2e8f0;--radius:16px;--radius-sm:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
.navbar{background:linear-gradient(135deg,var(--primary),var(--secondary));padding:.7rem 0;position:sticky;top:0;z-index:1000;box-shadow:0 2px 20px rgba(102,126,234,.3)}
.navbar .container{max-width:1100px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between}
.navbar-brand{color:#fff;text-decoration:none;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.navbar-brand a{color:#fff;text-decoration:none}
.navbar-nav{display:flex;gap:.2rem}
.navbar-nav a{color:rgba(255,255,255,.85);text-decoration:none;padding:.35rem .7rem;border-radius:8px;font-size:.82rem;cursor:pointer;transition:all .2s}
.navbar-nav a:hover,.navbar-nav a.active{background:rgba(255,255,255,.2);color:#fff}
.container{max-width:1000px;margin:0 auto;padding:1rem}
.hero{background:var(--card-bg);border-radius:var(--radius);padding:2rem;margin-bottom:1.5rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.hero h1{font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .meta{margin-top:.5rem;display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;color:var(--text-light);font-size:.88rem}
.tab-nav{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap}
.tab-btn{padding:.55rem 1.1rem;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--card-bg);cursor:pointer;font-size:.85rem;font-weight:500;transition:all .2s;color:var(--text-light);display:flex;align-items:center;gap:.35rem}
.tab-btn:hover,.tab-btn.active{border-color:var(--primary);color:var(--primary)}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeInUp .3s ease}
.card{background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-light)}
.empty-state i{font-size:3rem;opacity:.3;margin-bottom:1rem}
.empty-state h5{font-size:1rem;margin-bottom:.3rem}
@keyframes fadeInUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.footer{text-align:center;padding:1.5rem;color:var(--text-light);font-size:.82rem}
@media(max-width:768px){.hero h1{font-size:1.2rem}.navbar-nav a span{display:none}}
</style>
</head><body>

<nav class="navbar"><div class="container">
  <a class="navbar-brand" href="index.html"><i class="fas fa-arrow-left"></i> 学习中心</a>
  <div class="navbar-nav">
    <a class="active" onclick="switchTab('knowledge')"><i class="fas fa-sitemap"></i><span>知识点</span></a>
    <a onclick="switchTab('quiz')"><i class="fas fa-pen"></i><span>测验</span></a>
    <a onclick="switchTab('flashcard')"><i class="fas fa-layer-group"></i><span>卡片</span></a>
  </div>
</div></nav>

<div class="container" id="app"></div>
<div class="footer">为若琳定制的学习工具 | 持续更新中</div>

<script>
const params = new URLSearchParams(location.search);
const LEVEL = params.get('level') || '初中学习';
const SUBJECT = params.get('subject') || '数学';
document.title = `${SUBJECT} · 互动学习`;

const questions = [];
const flashcards = [];

// ===================== RENDER =====================
function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="hero fade-in-up">
      <h1><i class="fas fa-book-open"></i> ${SUBJECT}</h1>
      <div class="meta">
        <span>${LEVEL}</span>
        <span><i class="fas fa-check-circle"></i> 待出题</span>
        <span><i class="fas fa-layer-group"></i> 待制作</span>
      </div>
    </div>
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('knowledge')"><i class="fas fa-sitemap"></i> 知识点</button>
      <button class="tab-btn" onclick="switchTab('quiz')"><i class="fas fa-pen"></i> 闯关测验</button>
      <button class="tab-btn" onclick="switchTab('flashcard')"><i class="fas fa-layer-group"></i> 知识卡牌</button>
    </div>
    <div id="tab-knowledge" class="tab-content active">
      <div class="card">
        <div class="card-title"><i class="fas fa-lightbulb" style="color:var(--warning)"></i> 学习提示</div>
        <div class="empty-state">
          <i class="fas fa-hourglass-half"></i>
          <h5>${SUBJECT}（${LEVEL}）的学习内容准备中</h5>
          <p style="margin-top:.3rem">上传课件或告诉我学习要求，即可生成互动学习内容</p>
          <p style="margin-top:.8rem;font-size:.82rem;color:var(--text-light)">
            <i class="fas fa-arrow-left"></i> 回学习中心 · 说出"新增${LEVEL}${SUBJECT}第一讲"
          </p>
        </div>
      </div>
    </div>
    <div id="tab-quiz" class="tab-content">
      <div class="card">
        <div class="empty-state">
          <i class="fas fa-pen"></i>
          <h5>暂无测验题</h5>
          <p>上传课件后自动生成测验题</p>
        </div>
      </div>
    </div>
    <div id="tab-flashcard" class="tab-content">
      <div class="card">
        <div class="empty-state">
          <i class="fas fa-layer-group"></i>
          <h5>暂无知识卡</h5>
          <p>上传课件后自动生成知识卡牌</p>
        </div>
      </div>
    </div>
  `;
}

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(el => {
    const icons = {knowledge:'fa-sitemap',quiz:'fa-pen',flashcard:'fa-layer-group'};
    if (el.innerHTML.includes(icons[name])) el.classList.add('active');
  });
}

render();
</script>
</body></html>
