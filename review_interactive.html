<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复习模块 · 赵若琳学习中心</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#f4f6fb;color:#1f2937;line-height:1.7}
  .wrap{max-width:900px;margin:0 auto;padding:1rem 1rem 3rem}
  .hero{background:linear-gradient(135deg,#2f6fed,#5f3dc4);color:#fff;border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1rem}
  .hero h1{margin:0 0 .35rem;font-size:1.3rem}
  .hero p{margin:0;font-size:.86rem;opacity:.92}
  .toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
  .tab{background:#fff;border:1px solid #e3e8f2;border-radius:999px;padding:.4rem .95rem;font-size:.88rem;cursor:pointer;color:#374151;user-select:none;transition:.15s}
  .tab:hover{border-color:#b9c6e8}
  .tab.on{background:#2f6fed;border-color:#2f6fed;color:#fff;font-weight:600}
  .tab .cnt{opacity:.7;font-size:.78rem;margin-left:.25rem}
  input.search{flex:1;min-width:150px;border:1px solid #e3e8f2;border-radius:10px;padding:.45rem .8rem;font-size:.9rem;outline:none}
  input.search:focus{border-color:#2f6fed}
  .stat{color:#6b7280;font-size:.85rem;margin:.2rem 0 .9rem}
  .q-card{background:#fff;border-radius:14px;margin-bottom:1rem;box-shadow:0 2px 10px rgba(31,41,55,.06);overflow:hidden}
  .q-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.7rem 1rem;background:#f8faff;border-bottom:1px solid #eef1f8}
  .q-head .subj{background:#e8efff;color:#2f6fed;font-weight:700;font-size:.8rem;border-radius:7px;padding:.15rem .5rem}
  .q-head .num{font-weight:700;font-size:.95rem}
  .q-head .topic{color:#6b7280;font-size:.82rem}
  .q-head .date{margin-left:auto;color:#9aa3b2;font-size:.78rem}
  .q-body{padding:.9rem 1rem 1rem}
  .q-stem{background:#fafbff;border-left:3px solid #2f6fed;border-radius:8px;padding:.6rem .8rem;font-size:.93rem;margin-bottom:.7rem;white-space:pre-wrap}
  .q-img{width:100%;max-width:420px;border-radius:10px;border:1px solid #eef1f8;margin:.4rem 0 .8rem;cursor:zoom-in;display:block}
  .dim{border-radius:10px;padding:.55rem .8rem;margin-bottom:.5rem;font-size:.92rem}
  .dim .k{font-weight:700;font-size:.86rem;display:block;margin-bottom:.15rem}
  .dim p{margin:0;white-space:pre-wrap}
  .dim.A{background:#eef7ff;border:1px solid #d3e8ff}.dim.A .k{color:#1a6bb8}
  .dim.B{background:#eefaf3;border:1px solid #c7eeda}.dim.B .k{color:#0b6b3a}
  .dim.C{background:#fff8e8;border:1px solid #ffe6b3}.dim.C .k{color:#a5720a}
  .dim.D{background:#fff2f2;border:1px solid #ffd6d6}.dim.D .k{color:#b02a2a}
  .dim.E{background:#f6f0ff;border:1px solid #e3d5ff}.dim.E .k{color:#6b3fc4}
  .empty{text-align:center;color:#9aa3b2;padding:2rem 1rem;font-size:.92rem}
  #lightbox{display:none;position:fixed;inset:0;background:rgba(15,20,35,.9);z-index:99;align-items:center;justify-content:center;padding:1rem}
  #lightbox img{max-width:100%;max-height:92vh;border-radius:10px}
  #lightbox.on{display:flex}
  .tip{background:#f0f4ff;border:1px dashed #b9c6e8;border-radius:10px;padding:.7rem .9rem;font-size:.85rem;color:#41507a;margin-bottom:1rem}
  footer{text-align:center;color:#9aa3b2;font-size:.78rem;margin-top:1.6rem}
  @media print{.toolbar,.tip,footer{display:none}.q-card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>📖 复习模块 · 作业题精析</h1>
    <p>每题五个维度：<b>A 已知条件 · B 求解什么 · C 做题思路 · D 易错点 · E 知识点</b></p>
  </div>

  <div class="tip">💡 用法：先看题干自己做一遍 → 再看 C 思路对答案 → 重点记 D 易错点。新上传的作业会按同样格式陆续补进本页。</div>

  <div class="toolbar">
    <div id="tabs" style="display:flex;gap:.5rem;flex-wrap:wrap"></div>
    <input class="search" id="q" placeholder="🔍 搜索关键词（题号/考点/公式）">
  </div>
  <div class="stat" id="stat"></div>
  <div id="list"></div>
  <footer>赵若琳学习中心 · 复习模块 ｜ 更新：2026-09-19</footer>
</div>
<div id="lightbox"><img id="lb-img" src="" alt="题目图片"></div>

<script>
/* ============ 复习数据（分批上传后在此追加） ============
   字段：subj 学科｜num 题号｜topic 考点｜date 来源日期｜stem 题干
        img 题图路径｜known 已知条件｜ask 求解什么｜method 做题思路
        pitfall 易错点｜points 知识点
======================================================== */
const REVIEW_DATA = [
  {
    subj:'物理', num:'第6题', topic:'横穿马路 · 临界速度', date:'2026-09-19',
    img:'uploads/wrong_bank/physics_20260919_p3.jpg',
    stem:'马路宽为 D = 20 m，一辆长为 6 m、宽为 3.2 m 的汽车以速度 v₁ = 15 m/s 在路中间匀速向前行驶，此时距车头 s = 30 m 处有一辆长为 1.6 m 的自行车要横穿马路。则自行车为了安全通过马路，它行驶的速度 v₂ 的范围是（　　）\nA. 0 < v₂ < 6.6 m/s　　B. v₂ < 4.2 m/s 或 v₂ > 5.8 m/s\nC. v₂ < 3.5 m/s 或 v₂ > 6.6 m/s　　D. v₂ < 3.5 m/s 或 v₂ > 4.2 m/s\n【答案】C',
    known:'① 马路宽 D = 20 m；\n② 汽车：长 6 m、宽 3.2 m，行驶在路正中间，速度 v₁ = 15 m/s；\n③ 自行车：长 1.6 m，车头距它 s = 30 m，要横穿马路。',
    ask:'求自行车能安全通过马路的行驶速度 v₂ 的范围。',
    method:'把"安全"拆成两种情形，分别求临界速度：\n① 慢速情况（让汽车先过）：自行车先走到车身近侧停下等待。\n   路边到车身近侧的距离 = (20 − 3.2) ÷ 2 = 8.4 m；\n   等待时间 = 车头到达的时间 + 车身完全通过的时间 = 30 ÷ 15 + 6 ÷ 15 = 2 s + 0.4 s = 2.4 s；\n   → v₂ ≤ 8.4 ÷ 2.4 = 3.5 m/s。\n② 快速情况（抢在汽车前通过）：自行车要在车头到达前穿过车身所占的横向区域并让出自身长度：\n   需穿过的距离 = 20 ÷ 2 + 3.2 ÷ 2 + 1.6 = 10 + 1.6 + 1.6 = 13.2 m；\n   可用时间 = 车头到达的时间 = 30 ÷ 15 = 2 s；\n   → v₂ ≥ 13.2 ÷ 2 = 6.6 m/s。\n结论：v₂ < 3.5 m/s 或 v₂ > 6.6 m/s，选 C。',
    pitfall:'① 忘记"汽车有长度"：车尾通过还要 0.4 s（6 ÷ 15），只算 2 s 就会算成 4.2 m/s；\n② 把"通过马路"误当成必须走完 20 m（实际只需走出车身区域）；\n③ 两个距离含义混淆：慢速用 8.4 m（到车身近侧），快速用 13.2 m（穿过车身区）；\n④ 只算出一个临界速度，漏掉另一侧，导致选错选项。',
    points:'匀速直线运动 v = s/t；\n临界状态分析（刚好通过 / 刚好相撞）；\n分类讨论求速度范围；\n几何建模：把"车身宽度、车身长度、自身长度"转化为实际需通过的距离。'
  },
  {
    subj:'物理', num:'第7题', topic:'相向运动 · s-t 图像 · 过街安全', date:'2026-09-19',
    img:'uploads/wrong_bank/physics_20260919_p3.jpg',
    stem:'如图甲，小车 A 和小车 B 在马路上相向而行；图乙是两车的路程随时间变化的图像，从开始计时到第 15 s 两车正好相遇。求：\n(1) 小车 A 和小车 B 在开始计时的时候相距多远？\n(2) 如图丙，马路为双向两车道，每条车道宽 3.5 m。一辆长 5 m、宽 2.1 m 的小车 C 以 6 m/s 由西向东匀速行驶在右侧车道的正中间。此时一行人突然从图中 E 点横穿马路，人与小车在东西方向的距离 s₃ = 25 m。为了能够安全通过，行人速度的范围是多少？（不考虑小车车速和方向变化，以及制动情况）\n【答案】(1) 125 m　(2) v ≤ 0.84 m/s 或 v ≥ 1.512 m/s',
    known:'① A、B 两车相向而行；\n② 图乙（s-t 图）：A 车 10 s 内通过 50 m（v_A = 5 m/s）；B 车 15 s 内通过 50 m；\n③ 第 15 s 两车正好相遇；\n④ 图丙：双向两车道，每车道宽 3.5 m；小车 C 长 5 m、宽 2.1 m，速度 6 m/s，行驶在右侧车道正中间；\n⑤ 行人从 E 点横穿，人与车东西方向距离 s₃ = 25 m。',
    ask:'(1) 开始计时时两车相距多远？\n(2) 行人安全横穿马路的行驶速度范围。',
    method:'(1) 由图乙读速度：v_A = 50 m ÷ 10 s = 5 m/s；B 车 15 s 走 50 m。\n    两车相向而行，15 s 后相遇 ⇒ 初始距离 = A 走的路程 + B 走的路程 = 5×15 + 50 = 75 + 50 = 125 m。\n\n(2) 小车宽 2.1 m，在 3.5 m 车道正中间 ⇒ 车身两侧各留 (3.5 − 2.1) ÷ 2 = 0.7 m。\n① 慢速（等车先过）：行人只需走到车身近侧，距离 s₁ = 3.5 ÷ 2 + 0.7 = 1.75 + 0.7 = 4.2 m；\n   车尾离开所需时间 t = (25 + 5) ÷ 6 = 5 s；⇒ v ≤ 4.2 ÷ 5 = 0.84 m/s。\n② 快速（抢在车头前过）：行人要穿过车身区域，距离 s₂ = 3.5 ÷ 2 + 2.1 ÷ 2 + 3.5 = 1.75 + 1.05 + 3.5 = 6.3 m；\n   可用时间 = 车头到达的时间 = 25 ÷ 6 s；⇒ v ≥ 6.3 ÷ (25 ÷ 6) = 1.512 m/s。\n结论：v ≤ 0.84 m/s 或 v ≥ 1.512 m/s。',
    pitfall:'① s-t 图像不会读：忽略"斜率 = 速度"，凭数字乱算；\n② 第二问忘记把"车长 5 m"计入车尾通过时间（用 25 ÷ 6 而非 30 ÷ 6）；\n③ 几何距离算错：分不清"车道宽、半车宽、半车道"的关系（4.2 m 与 6.3 m 的来历）；\n④ 只写一个不等式，漏掉分类讨论的另一种情况。',
    points:'s-t 图像：斜率表示速度；\n相向运动的路程关系（s_总 = s₁ + s₂）；\n临界问题与分类讨论；\n相对运动思想；\n几何建模（车道宽度 → 行人需通过的距离）。'
  },
  {
    subj:'物理', num:'第4题', topic:'匀速圆周运动 · 旋转法测子弹速度', date:'2026-09-19',
    img:'uploads/wrong_bank/physics_20260919_p2.jpg',
    stem:'有一种运用"旋转法"测子弹速度的方法：在电动机转轴上固定两个间距为 20 cm 的薄塑片，电动机以 500 转/s 的速度匀速转动。枪正对塑片水平射击，子弹先后射穿两塑片，两弹孔位置对应的圆心角为 60°。求：\n(1) 薄塑片转过 360° 和 60° 的时间分别是多少？（用 n 表示）\n(2) 若两薄塑片还未转过一周就被子弹射穿，子弹的速度是多少？\n(3) 若两薄塑片间的距离为 d，转速为 n，薄塑片转过 N 周后才被子弹射穿，弹孔仍如图。求子弹速度 v（用 d、n、N 表示）。\n【答案】(1) 1/n、1/(6n)　(2) 600 m/s　(3) 6nd/(6N+1)',
    known:'① 两薄塑片间距 20 cm = 0.2 m；\n② 电动机转速 n = 500 转/s（匀速转动）；\n③ 子弹水平射穿两片，两弹孔对应圆心角 60°；\n④ 第(3)问：间距 d、转速 n、转过 N 周后射穿。',
    ask:'(1) 塑片转 360°、60° 各用多少时间（用 n 表示）？\n(2) 未满一周即射穿时子弹速度？\n(3) 转过 N 周后才射穿时子弹速度表达式？',
    method:'核心思想：子弹在两片之间飞行的时间 = 塑片转过相应角度所用的时间（时间相等）。\n(1) 转一周用时 T = 1/n；转 60° 是 1/6 周 ⇒ 用时 = 1/(6n)。\n    代入 n = 500：T = 0.002 s，60° 用时 = 1/3000 s。\n(2) 子弹飞行时间 = 塑片转 60° 的时间 = 1/3000 s；\n    v = d ÷ t = 0.2 m ÷ (1/3000) s = 600 m/s。\n(3) 塑片先转 N 整周，再转 60°：t = N/n + 1/(6n) = (6N + 1)/(6n)；\n    v = d ÷ t = d × 6n ÷ (6N + 1) = 6nd/(6N+1)。',
    pitfall:'① 第(3)问符号混淆：把"N 周"写成 n，写出 6nd/(6n+1)（这是本次作业的错点）；\n② 忘记 60° = 1/6 转，直接写成 1/n；\n③ 单位不统一：20 cm 忘记换成 0.2 m；\n④ 不理解"时间相等"这个桥梁，试图分别算子弹和塑片的时间。',
    points:'转速与周期：T = 1/n；\n匀速圆周运动的角度—时间关系（角度 ÷ 360° = 时间 ÷ 周期）；\n匀速直线运动 v = s/t；\n"同步计时"思想：把两个物体的运动时间关联起来（这是本题的关键建模）。'
  },
  {
    subj:'物理', num:'第5题', topic:'匀变速直线运动 · 刹车安全距离', date:'2026-09-19',
    img:'uploads/wrong_bank/physics_20260919_p2.jpg',
    stem:'汽车在路上出现故障时，应在车后放置三角警示牌，以提醒后面驾车司机减速安全通过。在夜间，有一货车因故障停驶，后面有一小轿车以 30 m/s 的速度向前驶来，由于夜间视线不好，小轿车驾驶员只能看清前方 60 m 的物体，并且他的反应时间为 0.6 s，制动后最大加速度为 5 m/s²。求：\n(1) 小轿车从刹车到停止所用的最短时间；\n(2) 三角警示牌至少要放在车后多远处，才能有效避免两车相撞？\n【答案】(1) 6 s　(2) 48 m',
    known:'① 小轿车速度 v = 30 m/s；\n② 驾驶员能看清前方 60 m 的物体（夜间视线）；\n③ 反应时间 t_反 = 0.6 s（这段时间车仍匀速）；\n④ 制动后最大加速度 a = 5 m/s²。',
    ask:'(1) 从刹车到停止的最短时间？\n(2) 警示牌至少放在车后多远处才能避免相撞？',
    method:'(1) 刹车过程是匀减速：由 v = a·t ⇒ t = v ÷ a = 30 ÷ 5 = 6 s。\n(2) "从发现情况到停下"分两段：\n① 反应距离（匀速）：s_反 = v·t_反 = 30 × 0.6 = 18 m；\n② 制动距离（匀减速）：s_制 = v² ÷ (2a) = 30² ÷ (2×5) = 900 ÷ 10 = 90 m；\n总停车距离 = 18 + 90 = 108 m。\n驾驶员只能看清 60 m，所以警示牌至少要放在 108 − 60 = 48 m 之前（即 ≥ 48 m 处）。',
    pitfall:'① 漏掉反应距离 18 m，只算制动距离；\n② 用错公式：把 v² = 2as 写成 s = v/2a 或 s = at²/2 混用；\n③ 忘记减去"能看清的 60 m"，直接把 108 m 当答案；\n④ 把"至少"理解成"等于"——实际应 ≥ 48 m。',
    points:'匀变速直线运动基本公式：v = at、v² = 2as；\n反应距离 + 制动距离 = 停车距离（安全距离模型）；\n"最短时间"对应最大加速度；\n物理模型与实际交通安全的联系。'
  }
];

/* ============ 渲染 ============ */
const COLOR = {数学:'math', 语文:'chinese', 英语:'english', 物理:'physics', 化学:'chem', 生物:'bio', 历史:'hist', 地理:'geo', 道法:'pol'};
let curSubj = '全部', curKw = '';

function allSubjects(){
  const seen = [];
  REVIEW_DATA.forEach(q => { if(!seen.includes(q.subj)) seen.push(q.subj); });
  return seen;
}
function renderTabs(){
  const subs = allSubjects();
  const tabs = document.getElementById('tabs');
  const items = [['全部', REVIEW_DATA.length]].concat(subs.map(s => [s, REVIEW_DATA.filter(q => q.subj === s).length]));
  tabs.innerHTML = items.map(([name, n]) =>
    `<div class="tab${name === curSubj ? ' on' : ''}" data-s="${name}">${name}<span class="cnt">${n}</span></div>`
  ).join('');
  tabs.querySelectorAll('.tab').forEach(t => t.onclick = () => { curSubj = t.dataset.s; renderTabs(); renderList(); });
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderList(){
  let list = REVIEW_DATA.filter(q => curSubj === '全部' || q.subj === curSubj);
  if(curKw){
    const k = curKw.toLowerCase();
    list = list.filter(q => JSON.stringify(q).toLowerCase().includes(k));
  }
  document.getElementById('stat').textContent = `共 ${list.length} 道题` + (curKw ? `（关键词：${curKw}）` : '');
  const box = document.getElementById('list');
  if(!list.length){ box.innerHTML = '<div class="empty">没有匹配的题目</div>'; return; }
  box.innerHTML = list.map((q, i) => `
    <div class="q-card">
      <div class="q-head">
        <span class="subj">${esc(q.subj)}</span>
        <span class="num">${esc(q.num)}</span>
        <span class="topic">${esc(q.topic || '')}</span>
        <span class="date">${esc(q.date || '')}</span>
      </div>
      <div class="q-body">
        <div class="q-stem">${esc(q.stem)}</div>
        ${q.img ? `<img class="q-img" src="${esc(q.img)}" alt="${esc(q.subj)}${esc(q.num)}题目图片" loading="lazy" onclick="openLB(this.src)">` : ''}
        ${dim('A','已知条件', q.known)}
        ${dim('B','求解什么', q.ask)}
        ${dim('C','做题思路', q.method)}
        ${dim('D','易错点', q.pitfall)}
        ${dim('E','知识点', q.points)}
      </div>
    </div>`).join('');
}
function dim(k, title, v){
  if(!v) return '';
  return `<div class="dim ${k}"><span class="k">${k}　${title}</span><p>${esc(v)}</p></div>`;
}
function openLB(src){ document.getElementById('lb-img').src = src; document.getElementById('lightbox').classList.add('on'); }
document.getElementById('lightbox').onclick = () => document.getElementById('lightbox').classList.remove('on');
document.getElementById('q').addEventListener('input', e => { curKw = e.target.value.trim(); renderList(); });
renderTabs(); renderList();
</script>
</body>
</html>
